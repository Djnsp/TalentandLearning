y-education/en-us/course-manuals/learning-for-administrators/manage-learner-enrollment.html?toc=8"},"sample":0,"memberships":[{"collection":"learning150","label":"B23"}]},{"id":"L150-B24","module":"L","domain":4,"topic":"Instructor and assessor security","stem":"A vendor will deliver a virtual classroom and has no Workday learning account. Which sequence establishes their identity and instructional role?","options":["Create the external learning user and then the external learning instructor","Create an external learning instructor and then convert a learner assignment","Create only an extended enterprise affiliation and assign it to the classroom","Create an internal learning instructor and then an external assessor"],"answer":0,"why":"The instructor role is enabled on an external learning user. An assessor or learner identity on its own does not authorize teaching.","reference":{"title":"Configure Workday Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/configure-workday-learning.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B24"}]},{"id":"L150-B25","module":"L","domain":1,"topic":"Equivalencies, prerequisites and certifications","stem":"Two modules together cover an older course. Completing only one module must not earn equivalent credit. How should the source courses be modeled?","options":["Create two separate one-source equivalency rules for the target","Put both modules in the same source row of the equivalency rule","Put the old course in the source and each module in the target","Make all three courses members of one equivalency group"],"answer":1,"why":"Multiple sources in the same row require the set. Separate one-source rules would allow either module to satisfy the target.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"B25"}]},{"id":"L150-B26","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"A worker is needed in a workshop ahead of others on the waitlist. The administrator must choose which person takes the next open seat. Which design supports that policy?","options":["Use auto-enrollment and approve the preferred worker after the seat has already been offered","Use auto-enrollment and set the preferred worker’s earlier assignment due date","Use automatic waitlisting and shorten the worker’s assignment due date","Use a manual waitlist and select the worker when a seat opens"],"answer":3,"why":"Manual promotion gives the administrator a choice. An earlier assignment due date does not change an automatic queue.","reference":{"title":"Concept: Waitlists for Learning Course Offerings","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pzq1545307922509.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B26"}]},{"id":"L150-B27","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"A full offering should promote learners in queue order when a seat opens. Which configuration is sufficient at the course or offering level?","options":["Auto-enrollment from the waitlist and zero waitlist places","Unlimited enrollment capacity and manual waitlist management","A positive waitlist capacity and auto-enrollment from the waitlist","A positive waitlist capacity and a minimum enrollment of one"],"answer":2,"why":"Capacity provides room for the queue. Auto-enrollment controls promotion when a seat opens.","reference":{"title":"Concept: Waitlists for Learning Course Offerings","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pzq1545307922509.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B27"}]},{"id":"L150-B28","module":"L","domain":1,"topic":"Retraining and expiration","stem":"An office worker matches none of a course’s advanced expiration criteria. A nine-month default exists. What result should the administrator expect?","options":["The worker receives no expiry because advanced rules exist","Workday applies the first advanced rule to unmatched workers","The last advanced rule applies","The nine-month default applies"],"answer":3,"why":"The default covers the workers outside all qualifying advanced groups.","reference":{"title":"Concept: Expiry Periods for Learning Content","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/usx1517492748668.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B28"}]},{"id":"L150-B29","module":"L","domain":1,"topic":"Equivalencies, prerequisites and certifications","stem":"An advanced course accepts either a completed classroom foundation or a completed digital foundation. How should the prerequisite choices be modeled?","options":["Make the advanced course equivalent to each foundation","Enter both courses in one row with the completion qualifier","Enter both courses in one row with the enrollment qualifier","Use a separate prerequisite row for each accepted course"],"answer":3,"why":"Separate rows provide alternative routes. Combining courses in one row would require both.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"B29"}]},{"id":"L150-B30","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"A room becomes unavailable for one session. Other sessions of the same course will still run in their original rooms. Where should the replacement room be entered?","options":["On a new effective-dated course version applied to all offerings","On the instructor’s worker profile","On the program containing the course","On the affected course offering"],"answer":3,"why":"The change concerns one scheduled event. Editing that offering preserves the other dates and rooms.","reference":{"title":"Maintain Learning Content and Course Offerings","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/maintain-learning-content-and-course-offerings.html?toc=5"},"sample":0,"memberships":[{"collection":"learning150","label":"B30"}]},{"id":"L150-B31","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"The minimum enrollment for an offering is eight. At the cutoff only six workers are enrolled. What should the administrator expect?","options":["The administrator must monitor the count and decide whether to cancel","Workday cancels the offering and drops all six at the cutoff","The waitlist opens automatically until minimum enrollment is met","Workday moves all six enrollments to the next offering"],"answer":0,"why":"Minimum enrollment is a planning threshold. It does not itself cancel or reschedule an underfilled session.","reference":{"title":"Workday Learning Components","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-learning-components.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B31"}]},{"id":"L150-B32","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"A technician must watch a demonstration, then perform the procedure while an assessor observes. One enrollment should track both steps. What should you build?","options":["A blended course with a media lesson and a training activity","A program containing two stand-alone media lessons","A digital course with a media lesson and a scored survey","A digital course followed by an assessor’s course rating"],"answer":0,"why":"An observed training activity requires a scheduled offering. A survey can collect answers but cannot substitute for an assessor’s observation.","reference":{"title":"Workday Learning Components","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-learning-components.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B32"}]},{"id":"L150-B33","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"A saved audience report returns all intended employees for a senior administrator, but only one region when the campaign creator runs it. What should be investigated first?","options":["Whether the report results were previewed before the last reminder ran","Whether the campaign is scheduled to run daily or weekly","The identity and security context used to calculate the audience","The difference between the report’s current and saved prompt values for the same user"],"answer":2,"why":"The running user’s visibility constrains a report-driven audience. An appropriate calculation user can supply the intended authorized scope.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"B33"}]},{"id":"L150-B34","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"A new blended-course version is created before a scheduled class. The class should continue using its existing material. What should the administrator do with that offering?","options":["Update the offering to the new version and keep its old date","Leave the offering on its existing version","Change the offering’s start date to the new version effective date","Copy the new version label onto the offering to freeze it"],"answer":1,"why":"Creating a new version leaves the administrator a choice about existing offerings. Explicitly updating it would take up the new version.","reference":{"title":"Maintain Learning Content and Course Offerings","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/maintain-learning-content-and-course-offerings.html?toc=5"},"sample":0,"memberships":[{"collection":"learning150","label":"B34"}]},{"id":"L150-B35","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"A campaign should stop targeting people who transfer out of the qualifying group and include newly eligible workers on subsequent runs. What setup addresses the changing population?","options":["Use dynamic audience updates and the appropriate exclusion configuration","Save a one-time export of the workers and reuse it unchanged","Refresh the saved report but keep the campaign audience as a fixed list of named workers","Schedule extra reminders for the original audience without recalculating its membership"],"answer":0,"why":"Campaign audience recalculation addresses entry and exit. The enrollment format cannot maintain an evolving target population.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"B35"}]},{"id":"L150-B36","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"An existing office is available as a business site, but the classroom inside it is missing when scheduling an in-person offering. What configuration addresses the room itself?","options":["Give the entire course the office address as its training location","Create the room under the office with Workspace usage and select it as a training room","Create the training room as a course contact and inherit the office’s location usage","Create a location with Training Room usage and identify the superior site"],"answer":3,"why":"A schedulable training room is a location with the appropriate usage and site relationship. The course topic and instructor organization do not create the physical room.","reference":{"title":"Configure Workday Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/configure-workday-learning.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B36"}]},{"id":"L150-B37","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"Employees enroll on different dates and each must have 14 days to complete the course. Which configuration avoids assigning some workers less time?","options":["Require the learning and use a due-date duration","Set a one-time expiry date on the course version","Require the learning and use a single fixed due date","Set a 14-day waitlist period on the offering"],"answer":0,"why":"A relative duration gives each worker the same completion interval. A fixed date serves a common cutoff.","reference":{"title":"Mass Enroll Learners","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pia1560344513585.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B37"}]},{"id":"L150-B38","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"The June version increases the fee. Two workshops booked earlier must retain the old fee, while a third should adopt the new fee. What is the most targeted action?","options":["Rename the new version and wait for all bookings to inherit the fee","Create the new version and update only the third offering to it","Change the course title and set the new fee on the program","Edit the fee on the current version and copy all three workshops"],"answer":1,"why":"A new version preserves the earlier terms. Updating selected offerings lets the administrator move only the intended workshop.","reference":{"title":"Maintain Learning Content and Course Offerings","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/maintain-learning-content-and-course-offerings.html?toc=5"},"sample":0,"memberships":[{"collection":"learning150","label":"B38"}]},{"id":"L150-B39","module":"L","domain":1,"topic":"Packaged content and SCORM","stem":"A package fails in Workday and in an independent standards test with the same manifest error. What should be corrected first?","options":["The enrollment’s manual score and success values","The course’s interaction-reporting setting and quiz report filters","The exported package and its manifest","The course’s lesson-completion configuration"],"answer":2,"why":"A reproducible packaging error outside Workday isolates the content export. Workday configuration cannot repair an invalid manifest.","reference":{"title":"Setup Considerations: Packaged Content for Learning","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/packaged-content/hfx1625670674607.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B39"}]},{"id":"L150-B40","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"A course takes 90 minutes, awards two continuing-education credits, and costs $75. Which entries keep the three values independently reportable?","options":["Time value and duration unit for 90 minutes, Units for two credits, Cost for $75","Use Time Value for 90 minutes, Units for $75, and Cost for two credits","Units for 90 minutes, Cost for two credits, course duration for $75","Use Time Value for two hours, Units for 90 credits, and Cost for $75"],"answer":0,"why":"Duration measures time, units represent credit awarded, and cost records the fee. Combining credits and minutes distorts both measures.","reference":{"title":"Workday Learning Components","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-learning-components.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B40"}]},{"id":"L150-B41","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"A designer wants an anonymous opinion survey at course end and an assessment that determines pass or fail. Which configuration distinguishes those purposes?","options":["Use one survey and map favorable responses to the course grade","Use a survey for opinions and scored assessment content for the result","Use course ratings for opinions and use their average as the learner’s score","Use two surveys and treat submission of the second as a passing score"],"answer":1,"why":"A course survey collects feedback. A scored learning assessment supplies performance data for pass or fail.","reference":{"title":"Workday Learning Components","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-learning-components.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B41"}]},{"id":"L150-B42","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"A waiver run lists one open assignment and one completed assignment for the same person. Which selection is eligible?","options":["Only the completed assignment","Both assignments if on the same course","Only the open assignment","Both assignments if the reason is entered manually"],"answer":2,"why":"Manual waiver is available for open obligations. It is not a mechanism for reclassifying completed training.","reference":{"title":"Steps: Waive Learning Assignments","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/shb1581540363812.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B42"}]},{"id":"L150-B43","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"New employees should get policy training first and role-specific learning immediately when they finish the policy. Which campaign item schedule matches that dependency?","options":["Give the first item an earlier expiration date than the second","Send the second item on completion of the first","Send the second item a fixed number of days after hire regardless of progress","Give both items the same due date and send them together"],"answer":1,"why":"Completion-relative delivery uses the learner’s actual progress. Calendar offsets cannot guarantee the policy was completed first.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"B43"}]},{"id":"L150-B44","module":"L","domain":1,"topic":"Equivalencies, prerequisites and certifications","stem":"A new two-day course covers everything taught in a shorter briefing. The briefing alone must never satisfy the two-day requirement. Which equivalency setup fits?","options":["Two-day course as source and briefing as target in a one-way rule","A group equivalency containing both courses","Both courses as sources and targets in a two-way rule","Briefing as source and two-day course as target in a one-way rule"],"answer":0,"why":"Credit should flow from the broader completed course to the narrower requirement. A reciprocal rule would give excessive credit.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"B44"}]},{"id":"L150-B45","module":"L","domain":1,"topic":"Retraining and expiration","stem":"A worker completes a course on April 3. A colleague completes it on May 18. Each qualification must remain valid for exactly one year after that person’s completion. Which setting fits?","options":["One fixed calendar expiration date","A duration-based expiry period","An annual recurrence on January 1","A one-year campaign due date"],"answer":1,"why":"Duration anchors the expiration to the individual completion. A fixed or recurring calendar date aligns workers to a shared schedule.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"B45"}]},{"id":"L150-B46","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"A compliance analyst needs to report whether outstanding requirements were waived, including people who never enrolled. What should be the report’s primary data?","options":["Course versions and their effective dates","Course enrollment grades and attendance","Waitlist positions and their approval state","Learning assignment records and their statuses"],"answer":3,"why":"Waiver belongs to the requirement record. A report starting only from enrollments omits assigned learners who never enrolled.","reference":{"title":"Steps: Waive Learning Assignments","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/shb1581540363812.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B46"}]},{"id":"L150-B47","module":"L","domain":4,"topic":"Drive and Media Cloud","stem":"Security wants one sensitive clip restricted across every course that embeds it. Which scope is appropriate?","options":["Restrict one offering’s enrollment approval","Remove the clip from the recommendations slider on one course","Apply the access restriction to the media item under the relevant authentication policy","Change the audience on one campaign that sent the clip"],"answer":2,"why":"Media-level controls follow the shared file wherever it is used. Course or campaign changes affect only individual delivery paths.","reference":{"title":"Workday Drive and Media Cloud","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-drive-and-media-cloud.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B47"}]},{"id":"L150-B48","module":"L","domain":4,"topic":"Drive and Media Cloud","stem":"A user with Can Edit on a shared Drive video still has no media-editing controls. Which additional access is most relevant?","options":["Manage Course Offering permission only","The assessor role on the containing course","Manage: Media domain permission","Reports: Drive Admin permission for all tenant items"],"answer":2,"why":"Editing requires both file-level permission and appropriate media-domain access. Granting tenant-wide reporting would overshoot the need.","reference":{"title":"Workday Drive and Media Cloud","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-drive-and-media-cloud.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B48"}]},{"id":"L150-B49","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"An instructor needs to enroll eligible workers with normal constraints. Security proposes giving unrestricted administrator mass enrollment because the report already lists the right workers. What change better fits?","options":["Authorize facilitated enrollment and scope the instructor’s access","Give unrestricted enrollment and configure a warning on the course title","Give unrestricted enrollment but remove the course capacity field from the report","Authorize only roster editing and ask the instructor to mark applicants present"],"answer":0,"why":"Facilitated enrollment preserves controls while allowing the job to be done. Report layout and roster actions do not provide equivalent enforcement.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"B49"}]},{"id":"L150-B50","module":"L","domain":4,"topic":"Drive and Media Cloud","stem":"A caption file misstates a product name at several timestamps. The team wants both on-screen captions and the searchable transcript corrected. What should the editor update?","options":["Rename the Drive file and republish the course title","Add the corrected term to the course description","Correct the timestamped caption file and upload it through Edit Media","Add a pop-up interaction wherever the term is spoken"],"answer":2,"why":"Captions and the transcript use the caption data. A revised caption file corrects both presentations of the spoken text.","reference":{"title":"Workday Drive and Media Cloud","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-drive-and-media-cloud.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B50"}]},{"id":"L150-C01","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"A global campaign must send item two exactly one week after item one is delivered, irrespective of completion. Which trigger fits?","options":["Make the second item eligible after the first becomes overdue","Schedule relative to delivery of the first item","Use a due date seven days after delivery, with both items sent immediately","Schedule immediately on completion of the first item"],"answer":1,"why":"The requirement measures elapsed time after delivery. A completion trigger can delay item two indefinitely.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"C01"}]},{"id":"L150-C02","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"A learner is on leave and is unable to complete required learning by the assigned time frame. Their manager approved a four-month extension to complete the training. As the administrator, what option do you use to add four months to the current deadline?","options":["Manage Grading and Attendance","Reset Learning Due Dates","Manage Enrollment Completion","Learning Due Dates"],"answer":1,"why":"Choose Extend Current Due Date by Duration, enter four months, and apply the change to the learner’s assignment.","reference":{"title":"Reset Learning Due Dates","url":"https://doc.workday.com/admin-guide/nl-nl/human-capital-management/learning/inschrijvingen-leeronderdeel/oyv1565907127465.html"},"sample":4,"memberships":[{"collection":"learning150","label":"C02"}]},{"id":"L150-C03","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"There are three course offerings currently scheduled for next week with enrolled learners in each offering. As an administrator, you edit the course and add a new version with an effective date of tomorrow. You also update Custom Version Label field to 2. How do you ensure that version 2 does not extend past this calendar year?","options":["Edit version 2 and update the version notes.","Update the Version Schema field when adding a new version.","Edit version 2 and enter the expiry period.","Update the Effective Date field to the first date of next year when adding a new version."],"answer":3,"why":"Make the version after version 2 effective January 1. Workday then ends version 2 on December 31. The Expiry Period field governs when a learner needs to re-enroll.","reference":{"title":"Maintain Learning Content and Course Offerings","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/maintain-learning-content-and-course-offerings.html?toc=5"},"sample":2,"memberships":[{"collection":"learning150","label":"C03"}]},{"id":"L150-C04","module":"L","domain":4,"topic":"Instructor and assessor security","stem":"You want to assign security permissions to a manager of a supervisory organization who delivers in-person, classroom training. What task will you use?","options":["Create Internal Learning Assessor","Create Internal Learning Instructor","Create External Learning User","Create External Learning Instructor"],"answer":1,"why":"The manager is already a worker in the organization and will teach an instructor-led course. Create the internal instructor record to grant the relevant permissions.","reference":{"title":"Configure Workday Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/configure-workday-learning.html"},"sample":14,"memberships":[{"collection":"learning150","label":"C04"}]},{"id":"L150-C05","module":"L","domain":4,"topic":"Instructor and assessor security","stem":"You want to assign someone from outside of your organization to observe and grade an on-the-job training activity. To grant grading permissions, what task do you complete first to make them an assessor?","options":["Create Extended Enterprise Affiliation","Create Extended Enterprise Learner","Create External Learning Instructor","Create External Learning User"],"answer":3,"why":"Create the external user account first. Then use Create External Learning Assessor to grant the person access to assess training activities.","reference":{"title":"Supplied sample question and reviewed answer","url":""},"sample":20,"memberships":[{"collection":"learning150","label":"C05"}]},{"id":"L150-C06","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"The same content and assessment must be delivered as an in-person workshop and as an independent online course. Which pair preserves a scheduled roster for only the workshop?","options":["Two digital courses differentiated by classroom location","Two stand-alone lessons differentiated by delivery mode","Blended course for the workshop and digital course for independent study","Digital course for the workshop and blended course for independent study"],"answer":2,"why":"The physical workshop needs an instructor-led offering. The independent version can use a digital course with an assessment in its media.","reference":{"title":"Workday Learning Components","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-learning-components.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C06"}]},{"id":"L150-C07","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"You want a manager to perform a mass enrollment and have the course display on the learners’ Required for You slider. After the manager selects the offering, what is their next step for the course to display on the slider?","options":["In the Required Learning section, select Yes.","In the Due Date section, select Duration.","In the Due Date section, select Date.","The course will automatically display on the slider."],"answer":0,"why":"Marking the enrollment as required places the course on each team member’s Required for You slider.","reference":{"title":"Mass Enroll Learners","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pia1560344513585.html"},"sample":9,"memberships":[{"collection":"learning150","label":"C07"}]},{"id":"L150-C08","module":"L","domain":4,"topic":"Instructor and assessor security","stem":"When managing learners’ grading for a course, what security group can also manage attachments and add comments?","options":["All Extended Enterprise Learners","Learning Assessor","Manager","All Learners"],"answer":1,"why":"Assessors can grade assigned learning activities, attach supporting material, and record comments.","reference":{"title":"Supplied sample question and reviewed answer","url":""},"sample":18,"memberships":[{"collection":"learning150","label":"C08"}]},{"id":"L150-C09","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"You create an audience. While you create the campaign, the audience displays as an available value. What configuration causes the audience to display as an option?","options":["The campaign category and the audience category match.","The exclusion rule on the campaign is not enabled.","The audience name matches the campaign title.","The exclusion rule on the campaign is enabled."],"answer":0,"why":"Assigning a category to an audience makes it available for campaigns in that category.","reference":{"title":"Create Audiences to Use in Collaboration Tasks","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/collaboration/campaigns-and-scheduled-distributions/fmv1466082228537.html"},"sample":13,"memberships":[{"collection":"learning150","label":"C09"}]},{"id":"L150-C10","module":"L","domain":3,"topic":"Learning reports","stem":"A learner wants to find a digital course to develop a specific competency and skills. What report should they use to narrow down the available options?","options":["Browse Learning Content","Learning Content by Rating","Learning Content by Progress","Topics"],"answer":0,"why":"The learner can filter the catalog by content type and skills to narrow the list to relevant digital courses.","reference":{"title":"Introduction to Workday Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/introduction-to-workday-learning.html"},"sample":7,"memberships":[{"collection":"learning150","label":"C10"}]},{"id":"L150-C11","module":"L","domain":1,"topic":"Retraining and expiration","stem":"A corrected expiration rule should update eligible enrollments, but an administrator intentionally protected one learner’s date from recalculation. What explains the exception?","options":["A later due-date reminder was scheduled for that assignment","The learner’s course version label differs from the current version label","The course is displayed in a campaign audience","Manual Expiration Override is set for that record"],"answer":3,"why":"The override flag protects an individually adjusted date from the expiration update job.","reference":{"title":"Concept: Expiry Periods for Learning Content","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/usx1517492748668.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C11"}]},{"id":"L150-C12","module":"L","domain":3,"topic":"Completion corrections and exceptions","stem":"A supervisor wants to correct the result on a course already manually marked Complete. What should the administrator establish before trying the same completion task again?","options":["Changing the reason for a manual completion restores that enrollment to In Progress","An administrator can always change finalized results if the learner is still employed","A new course version automatically reopens the learner’s completed enrollment for editing","The task cannot change that enrollment after manual finalization"],"answer":3,"why":"Manage Enrollment Completion applies to eligible Not Started or In Progress enrollments. Finalizing the manual result closes that route.","reference":{"title":"Manage Enrollment Completion","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/eas1550266780581.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C12"}]},{"id":"L150-C13","module":"L","domain":3,"topic":"Grading, attendance and trainer scope","stem":"As an administrator, how do you enter grades and attendance on a course offering?","options":["From the Learning Trainer dashboard, select Manage Enrollments.","From the course, use the More (three dot) icon to Update Offering to Version.","From the Learning Administrator dashboard, select the Campaign dashboard.","From the offering, use the More (three dot) icon to Manage Roster."],"answer":3,"why":"Open the roster for the scheduled offering to enter attendance and grades for the learners enrolled in that session.","reference":{"title":"The Learning Trainer","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/the-learning-trainer.html?toc=10"},"sample":6,"memberships":[{"collection":"learning150","label":"C13"}]},{"id":"L150-C14","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"When you create a digital course that requires enrollment, what lesson types can you include?","options":["External Content and Media","Training Activity and Survey","Survey and Virtual Classroom (Instructor Led)","Training Activity and Virtual Classroom (Instructor Led)"],"answer":0,"why":"Digital courses support external content, media, and surveys. Every other pair listed includes a training activity or virtual classroom, which requires a scheduled offering.","reference":{"title":"Workday Learning Components","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-learning-components.html"},"sample":11,"memberships":[{"collection":"learning150","label":"C14"}]},{"id":"L150-C15","module":"L","domain":1,"topic":"Retraining and expiration","stem":"A policy expires for everyone on one specified date, regardless of when each learner completed it. The policy will be replaced after that date. Which expiry type fits?","options":["A fixed date","A recurring frequency with no end","A duration from each completion","A retrain window without an expiry rule"],"answer":0,"why":"A one-time fixed date gives all completions the same boundary. A duration would produce different dates for different learners.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"C15"}]},{"id":"L150-C16","module":"L","domain":1,"topic":"Equivalencies, prerequisites and certifications","stem":"A supervisor course should open only after both Safety and Ethics are complete. How should the prerequisite grid be configured?","options":["Place both courses in one row with an enrollment qualifier","Place each course in its own row with a completion qualifier","Place both courses in one rule row with a completion qualifier","Set up a two-way equivalency between the two prerequisite courses"],"answer":2,"why":"A single row combines the requirements. The completion qualifier keeps enrollment alone from satisfying the gate.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"C16"}]},{"id":"L150-C17","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"You create a New Hire campaign and want to configure a reminder on one of the campaign items. What configuration enables you to add a reminder to a campaign item?","options":["The campaign item has a send date.","The campaign item has a due date.","The campaign category is Required Learning.","The campaign category is not Required Learning."],"answer":1,"why":"A campaign item’s due date provides the date used to schedule its reminders.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":15,"memberships":[{"collection":"learning150","label":"C17"}]},{"id":"L150-C18","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"A learning partner can run Find Workers to Enroll and see the intended workers. The facilitated enrollment action is unavailable. Where should the security administrator look next?","options":["The facilitated enrollment initiating action and related learning domains","The display order of the certification facets on the search report","The enrollment criteria for the next offering after the action has run","The approval step order in an already submitted mass enrollment event"],"answer":0,"why":"Report visibility and authority to initiate the mass action are separate. Verify business process and domain access for the partner.","reference":{"title":"Mass Enroll Learners","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pia1560344513585.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C18"}]},{"id":"L150-C19","module":"L","domain":1,"topic":"Packaged content and SCORM","stem":"A vendor provides a plain web link, and the business asks for pass/fail data from the vendor quiz. What should the designer establish before promising that report?","options":["Whether the external link is the last lesson in the course","Whether an instructor is named on the parent digital course","Whether the external link is marked required on the program","Whether the vendor can supply a supported tracked package or integration"],"answer":3,"why":"Opening an ordinary external link does not transmit the vendor’s quiz result. Tracking needs a supported mechanism that sends the result.","reference":{"title":"Workday Learning Components","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-learning-components.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C19"}]},{"id":"L150-C20","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"A learner has an open assignment for a course that accepts equivalent credit. They complete the qualifying equivalent course. How should the satisfied requirement be represented?","options":["The target assignment stays open until both courses are taken","Only a manual waiver can close the target assignment","The equivalent credit can complete the target assignment","The source course completes but equivalent target assignments always require a separate manual completion"],"answer":2,"why":"Earned equivalency can satisfy an assignment. A waiver denotes an exemption, not completion through qualifying learning.","reference":{"title":"Concept: Learning Assignments","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/qsv1580739481320.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C20"}]},{"id":"L150-C21","module":"L","domain":4,"topic":"Drive and Media Cloud","stem":"Compliance wants viewers to answer each embedded question once. They may replay previously watched segments but should not skip ahead. Which individual-video setting fits?","options":["Enable Limit Question Attempts","Enable Skip Restrictions but leave question attempts unlimited","Publish multiple-choice interactions and leave both settings at their defaults","Configure the tenant playback quality and keep the video’s attempts unrestricted"],"answer":0,"why":"Limiting attempts also enables skip restrictions. Viewers can still revisit earlier material.","reference":{"title":"Workday Drive and Media Cloud","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-drive-and-media-cloud.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C21"}]},{"id":"L150-C22","module":"L","domain":1,"topic":"Equivalencies, prerequisites and certifications","stem":"An auditor wants to inspect and edit the course pairs that grant substitute credit. Which tool should the administrator open?","options":["Manage Learning Certification Rules","Reset Expiration Date on Learning Records","Manage Learning Equivalency Rules","Manage Learning Prerequisite Rules"],"answer":2,"why":"Substitute credit is an equivalency relationship. Prerequisites gate entry and certifications issue credentials.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"C22"}]},{"id":"L150-C23","module":"L","domain":4,"topic":"Drive and Media Cloud","stem":"A video editor wants the compliance reviewer to see draft interactions before learners receive any changes. Which workflow preserves the published version?","options":["Delete the published video and upload the working copy","Publish first and use Revert to hide the live changes","Change the course version number without saving the draft","Save Draft and preview the changes before publishing"],"answer":3,"why":"Saving a draft preserves unpublished work. Publish updates the version available for consumption.","reference":{"title":"Workday Drive and Media Cloud","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-drive-and-media-cloud.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C23"}]},{"id":"L150-C24","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"Which content types allow you to enroll learners into required content?","options":["Blended Course, Digital Course, SCORM-Packaged Content","Blended Course, Digital Course, Lesson","Blended Course, Digital Course, Program","Blended Course, Campaign, SCORM-Packaged Content"],"answer":2,"why":"Learners can enroll in a blended course offering or in a digital course or program that requires enrollment.","reference":{"title":"Manage Learner Enrollment","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/manage-learner-enrollment.html?toc=8"},"sample":17,"memberships":[{"collection":"learning150","label":"C24"}]},{"id":"L150-C25","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"A waiver report must distinguish true completions from policy exceptions. Which fields most directly support that audit?","options":["Assignment due date and course completion date only","Assignment status and waive reason","Enrollment status and enrollment cancellation reason","Course expiration date and enrollment source only"],"answer":1,"why":"The assignment status distinguishes completed and waived obligations. The waiver reason records why the exception was granted.","reference":{"title":"Steps: Waive Learning Assignments","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/shb1581540363812.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C25"}]},{"id":"L150-C26","module":"L","domain":3,"topic":"Grading, attendance and trainer scope","stem":"For blended courses, what task or report do instructors use to change a learner's completion status?","options":["Manage Grades and Attendance task","Manage Enrollments report","Manage Waitlist report","Manage Learning Assignment Waive task"],"answer":0,"why":"The option says “Manage Grades and Attendance.” Workday’s manual calls the task “Manage Grading and Attendance.” The instructor records the required results here so Workday can update completion.","reference":{"title":"The Learning Trainer","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/the-learning-trainer.html?toc=10"},"sample":3,"memberships":[{"collection":"learning150","label":"C26"}]},{"id":"L150-C27","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"A manager enrolled five direct reports in an optional blended course. Two should come off that session and the other three must stay enrolled. Which action fits?","options":["Waive all five assignments and reactivate three","Reduce the offering capacity by two","Cancel the offering and re-enroll the other three","Use the manager’s drop action and select the two workers"],"answer":3,"why":"The manager can drop selected workers they enrolled. Lowering capacity does not identify which enrollments to remove.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"C27"}]},{"id":"L150-C28","module":"L","domain":1,"topic":"Packaged content and SCORM","stem":"The learning team sees pass/fail but no answers to individual SCORM questions. The package produces interaction records in an independent test. What should be checked next?","options":["The package lesson’s overall score field on the enrollment","The program setting that recognizes successful course completions","Packaged content interaction reporting in Edit Tenant Setup - HCM","The placement of the quiz after the last mandatory media lesson"],"answer":2,"why":"Summary completion can exist without item-level reporting. Once the package is known to emit interactions, check the tenant setting for receiving them.","reference":{"title":"Setup Considerations: Packaged Content for Learning","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/packaged-content/hfx1625670674607.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C28"}]},{"id":"L150-C29","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"There are three course offerings currently scheduled for next week with enrolled learners in each offering. As an administrator, you edit the course and add a new version with an effective date of tomorrow. You also update Custom Version Label field to 2. How do you change the currently scheduled offerings to version 2?","options":["Copy the existing offering and schedule the new offerings using version 2.","Cancel the existing offerings and schedule new offerings using version 2.","Nothing, the offerings will update automatically to version 2, effective tomorrow.","From the course page use the Update Offering to Version task and select the three offerings to update."],"answer":3,"why":"Select version 2 on the course, open Update Offering to Version, and choose the three scheduled offerings.","reference":{"title":"View and Edit Learning Content","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/qgv1507821855841.html"},"sample":19,"memberships":[{"collection":"learning150","label":"C29"}]},{"id":"L150-C30","module":"L","domain":1,"topic":"Equivalencies, prerequisites and certifications","stem":"HR wants workers to see that a course awards a credential before they enroll. The certification rule already issues the credential correctly. Which change is most specific?","options":["Select Display on Content on the certification rule","Set the course’s default expiry equal to the credential duration","Select Display Equivalency Records on Learning History","Enable Recognize Previous Completions on the program"],"answer":0,"why":"Issuance and catalog visibility are separate. The rule’s display option makes the credential visible on the content page.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"C30"}]},{"id":"L150-C31","module":"L","domain":1,"topic":"Packaged content and SCORM","stem":"An analyst wants to explain why a SCORM learner earned 74 rather than 80. The report contains only completion status, success, and final score. Which evidence is missing?","options":["The learner’s completion timestamp for each quiz attempt","Question-level interaction data from the package","The latest total score grouped by package version","A second summary report containing pass/fail by worker"],"answer":1,"why":"The final score is a summary. Explaining it by individual answers requires interaction data captured by the package.","reference":{"title":"Concept: Packaged Content","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/packaged-content/pxu1522169462024.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C31"}]},{"id":"L150-C32","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"Operations copied a campaign to a new location and manually re-launched the old one. Previously staggered items arrived together. Which behavior explains this?","options":["A newly included location always resets all item offsets to the first launch date","A reminder automatically converts all future items to required content","A manually triggered run can send all eligible items at that time","The campaign treats all dates as relative to each learner’s completed enrollment"],"answer":2,"why":"Rerunning an existing campaign can release eligible items together. A separate campaign for a missed cohort avoids disrupting the original sequence.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"C32"}]},{"id":"L150-C33","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"There are three course offerings currently scheduled for next week with enrolled learners in each offering. As an administrator, you edit the course and add a new version with an effective date of tomorrow. You also update Custom Version Label field to 2. Due to building maintenance, you can no longer host an upcoming session and you need to remove that offering from the schedule. What step(s) do you take to remove the offering from the schedule and the learners’ My Transcript report?","options":["Cancel Course Offering","Drop Enrollments and Cancel Course Offering","Drop Enrollments","Drop Enrollments and Inactivate Course Offering"],"answer":1,"why":"Canceling the offering leaves a canceled entry on the learner’s transcript. Dropping the enrollment also removes that entry.","reference":{"title":"Maintain Learning Content and Course Offerings","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/maintain-learning-content-and-course-offerings.html?toc=5"},"sample":8,"memberships":[{"collection":"learning150","label":"C33"}]},{"id":"L150-C34","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"There is a course offering with 10 seats and a waitlist capacity of six seats. Currently, seven workers are enrolled in this offering. If a manager has a team of nine workers, how many workers can they enroll in the course?","options":["The manager can enroll three workers and add six to the waitlist.","The manager can enroll nine workers.","The manager can enroll six workers and add three to the waitlist.","The manager can enroll three workers, but they will not be able to add any workers to the waitlist."],"answer":3,"why":"Seven of ten seats are occupied, leaving three. Joining the waitlist is a learner self-service action, so the manager can enroll three workers and add none to the waitlist.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":12,"memberships":[{"collection":"learning150","label":"C34"}]},{"id":"L150-C35","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"You need to build a campaign audience. The audience needs to include customer service representatives in France. What action do you complete first?","options":["Use the Manage Audiences task.","Use the Create Campaign task.","Use the Find Workers to Enroll report.","Create a saved search on the Find Workers report."],"answer":3,"why":"Filter Find Workers to customer service representatives in France and save the search. Use those criteria to build the campaign audience.","reference":{"title":"Supplied sample question and reviewed answer","url":""},"sample":16,"memberships":[{"collection":"learning150","label":"C35"}]},{"id":"L150-C36","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"Employees will watch a recording and take a survey at their convenience. The license holder needs a formal enrollment before they start. Which design meets both requirements?","options":["Digital course with Requires Enrollment cleared","Blended course with a separate virtual classroom for each learner","Program with a survey entered directly as a program item","Digital course with Requires Enrollment selected"],"answer":3,"why":"A digital course can contain media and a survey. Requiring enrollment supplies the formal entry point without adding a scheduled class.","reference":{"title":"Workday Learning Components","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-learning-components.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C36"}]},{"id":"L150-C37","module":"L","domain":3,"topic":"Completion corrections and exceptions","stem":"One case concerns a classroom attendance omission. Another concerns a missing completion from a tracked video. Which task pairing is appropriate?","options":["Manage Grading and Attendance for the classroom and Manage Enrollment Completion for the video","Manage Enrollment Completion for the classroom and Manage Grading and Attendance for the video","Reset Learning Due Dates for the classroom and cancel the video enrollment","Waive Learning Assignment for the classroom and Manage Roster for the video"],"answer":0,"why":"Instructor-led results use the roster workflow. Eligible digital tracking failures can be corrected on the individual enrollment.","reference":{"title":"Manage Enrollment Completion","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/eas1550266780581.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C37"}]},{"id":"L150-C38","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"The learner completes required training with an expiry period. A second assignment has a due date matching the completion’s expiration. What kind of record is it?","options":["A waitlist assignment for a future offering","A retraining assignment","An approval task on the original enrollment","An accidental duplicate of the current initial assignment"],"answer":1,"why":"Workday uses the enrollment expiration date to drive the next retraining requirement. The previous completion remains part of the history.","reference":{"title":"Concept: Learning Assignments","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/qsv1580739481320.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C38"}]},{"id":"L150-C39","module":"L","domain":3,"topic":"Completion corrections and exceptions","stem":"Attendance records confirm that a worker attended yesterday’s closed offering, but the worker was omitted from the roster. Which authorized path can address the late enrollment?","options":["Self-service waitlisting for the closed offering","Administrative Learning Mass Enroll into the closed offering","Entering an overall grade before creating an enrollment","Manager Enroll My Team into the closed offering"],"answer":1,"why":"The administrative route can enroll into closed or in-progress offerings. A grade belongs to an enrollment and cannot create the missing roster entry.","reference":{"title":"Mass Enroll Learners","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pia1560344513585.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C39"}]},{"id":"L150-C40","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"For versioning, what field is specific to blended courses?","options":["Effective Date","Requires Enrollment","Skills","Course Number"],"answer":0,"why":"A blended course can have a future-dated version. An edit to a digital course takes effect immediately.","reference":{"title":"View and Edit Learning Content","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/qgv1507821855841.html"},"sample":5,"memberships":[{"collection":"learning150","label":"C40"}]},{"id":"L150-C41","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"A division head wants to use Enroll My Team for workers two supervisory levels below them. None appears as eligible. Which distinction matters?","options":["Enroll My Team targets direct reports, so use an authorized broader route for the division","Changing the offering from optional to required expands the manager’s targeting scope","Workers must first be selected in a saved search for Enroll My Team to expand the hierarchy","Indirect reports appear only after the director is added as an enrollment approver"],"answer":0,"why":"Manager self-service is scoped to the direct team. Broader populations need a separately authorized enrollment route.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"C41"}]},{"id":"L150-C42","module":"L","domain":1,"topic":"Retraining and expiration","stem":"Training expires on a common renewal date. Compliance wants employees to see it under Required for You in the weeks leading up to renewal. Which change targets that requirement?","options":["Turn the original campaign send date into a fixed expiry date","Configure the retrain window for the content","Change the first offering’s maximum enrollment","Set a new course version effective at the beginning of those weeks"],"answer":1,"why":"The retrain window controls when upcoming retraining becomes visible. The expiry rule still sets the validity boundary.","reference":{"title":"Concept: Expiry Periods for Learning Content","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/usx1517492748668.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C42"}]},{"id":"L150-C43","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"When you create a program that requires enrollment, what content types can you include?","options":["Blended Course, Lesson, and Survey","Digital Course, Media, and Survey","Media, SCORM-Packaged Content, and Survey","Blended Course, Digital Course and Lesson"],"answer":3,"why":"A program can group courses and stand-alone lessons. Individual media or survey components belong within a course.","reference":{"title":"Create Learning Programs","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/qqs1548170650369.html"},"sample":10,"memberships":[{"collection":"learning150","label":"C43"}]},{"id":"L150-C44","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"An administrator must select individual workers from several locations, then enroll them in one specific session. Which sequence targets both the workers and the session?","options":["Choose the course version, update all offerings, then select the locations","Select workers, assign the blended course by campaign, and assume the first date is booked","Filter Find Workers to Enroll, select workers, use Learning Mass Enroll, then choose the offering","Select the date in the course version notes, then mass enroll at the course level"],"answer":2,"why":"The mass action starts from selected workers and requests the learning item and offering. A campaign or catalog change would solve a different problem.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"C44"}]},{"id":"L150-C45","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"A worker was incorrectly assigned a required course but wants to complete it voluntarily. What removes the obligation and preserves the active enrollment?","options":["Mark the assignment completed and record a passing grade","Drop the enrollment only","Waive the open assignment only","Cancel the enrollment and waive the assignment"],"answer":2,"why":"A waiver removes the obligation without ending participation. Dropping or canceling would affect the enrollment the worker wants to keep.","reference":{"title":"Steps: Waive Learning Assignments","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/shb1581540363812.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C45"}]},{"id":"L150-C46","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"A learning partner must enroll workers across approved locations. Every request must respect prerequisites, capacity, and a configured approval step. Which route fits?","options":["Mass Enroll by Role with override access","Enroll My Team as each worker’s direct manager","Learning Facilitated Enroll","Learning Mass Enroll as a learning administrator"],"answer":2,"why":"Facilitated enrollment can be scoped to a nonmanager role and routes through Mass Enroll approvals while enforcing constraints.","reference":{"title":"Mass Enroll Learners","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pia1560344513585.html"},"sample":0,"memberships":[{"collection":"learning150","label":"C46"}]},{"id":"L150-C47","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"A client wants version 2 to stop being current when version 3 launches. Which date establishes that boundary?","options":["The start date of the first version 3 offering","The effective date of version 3","The due date of the last version 2 assignment","The expiration date of the most recent version 2 enrollment"],"answer":1,"why":"Beginning a subsequent version establishes the previous version’s end. Learner expiry, deadlines, and offering dates represent different events.","reference":{"title":"Maintain Learning Content and Course Offerings","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/maintain-learning-content-and-course-offerings.html?toc=5"},"sample":0,"memberships":[{"collection":"learning150","label":"C47"}]},{"id":"L150-C48","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"A learner enrolls in an onboarding program containing a blended safety course with three upcoming dates. What must the learner still do to secure a seat?","options":["Start the blended program item and rely on its first available offering to reserve a seat","Enroll a second time in the onboarding program","Enroll in a specific offering of the blended course","Wait for the manager to select a date on the parent program enrollment"],"answer":2,"why":"Program enrollment does not select an offering. A separate offering enrollment identifies the date and consumes a seat.","reference":{"title":"Manage Learner Enrollment","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/manage-learner-enrollment.html?toc=8"},"sample":0,"memberships":[{"collection":"learning150","label":"C48"}]},{"id":"L150-C49","module":"L","domain":1,"topic":"Equivalencies, prerequisites and certifications","stem":"A prerequisite was retired after two years. The administrator wants to stop enforcing it while preserving its history. What should they do?","options":["Change the qualifier to enrollment and leave the rule active","Create a reverse prerequisite and keep both rules active","Inactivate the existing prerequisite rule","Delete every previous enrollment affected by the rule"],"answer":2,"why":"Inactivation stops enforcement and preserves the rule for reporting. Relaxing the qualifier still imposes a gate.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"C49"}]},{"id":"L150-C50","module":"L","domain":3,"topic":"Learning reports","stem":"The administrator needs access to an inactive course. What report allows administrators to find both active and inactive learning content?","options":["Search Learning","Manage Learning Content","Learning Content by Rating","Browse Learning Content"],"answer":1,"why":"The administrator can use this report to find a course even after it has been made inactive.","reference":{"title":"Supplied sample question and reviewed answer","url":""},"sample":1,"memberships":[{"collection":"learning150","label":"C50"}]},{"id":"T150-B04","module":"T","domain":2,"topic":"Routing and visibility","stem":"A reviewer can enter competency ratings, but HR expected them to comment across all enabled review sections as a second manager. What was configured?","options":["The additional-manager path was used, but its visibility setting turned comments into competency ratings","The review-period midpoint assigned the lead to the wrong primary manager","The additional-reviewer path was used where the additional-manager path was intended","The primary manager was routed to the wrong goal period"],"answer":2,"why":"Additional reviewers and additional managers do different work. Change the participant path to match the requested scope.","reference":{"title":"Setup Considerations: Performance Reviews","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/performance-reviews/ham1552329509919.html"},"sample":0,"memberships":[{"collection":"talent150","label":"B04"}]},{"id":"T150-C01","module":"T","domain":4,"topic":"Succession sourcing","stem":"A manager starts the Assess My Team's Potential task. What option allows them to suggest workers for a job profile and if enabled tracking potential successors for a succession plan?","options":["Review Rating","Nominations","Achievable Level","Retention"],"answer":1,"why":"Managers can nominate a worker for a job profile during a potential assessment. With nomination tracking enabled, administrators can review nominees for succession.","reference":{"title":"Setup Considerations: Succession","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/succession/wzj1581029577662.html"},"sample":19,"memberships":[{"collection":"talent150","label":"C01"}]},{"id":"T150-C02","module":"T","domain":1,"topic":"Feedback","stem":"What prevents an administrator from deleting a feedback question from the question library?","options":["The feedback question requires a date answer type.","The feedback question uses a single-select answer type.","The feedback question allows for selecting more than one question type.","The question appears in a feedback event."],"answer":3,"why":"A question used in a feedback event remains protected from deletion even if it is later removed from the template.","reference":{"title":"Create and Manage Feedback Questions","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/feedback/feedback-templates/cly1622751584290.html"},"sample":8,"memberships":[{"collection":"talent150","label":"C02"}]},{"id":"T150-C03","module":"T","domain":2,"topic":"Review templates","stem":"You are using a performance review template and a goal is not populating into an employee's review. What could cause this issue?","options":["The goal is in Not Started status.","The goal was created using the Cascade Goals business process.","The goal has milestones that are not in Complete status.","The goal due date falls outside the period start and end dates of the template."],"answer":3,"why":"Check the goal’s due date against the review start and end dates. For a goal without a due date, the creation date determines whether it falls in the period.","reference":{"title":"Supplied sample question and reviewed answer","url":""},"sample":6,"memberships":[{"collection":"talent150","label":"C03"}]},{"id":"T150-C05","module":"T","domain":2,"topic":"Routing and visibility","stem":"The annual evaluation task reaches the right security group. Reviewers may rate competencies, but the business requires a second manager to contribute comments without taking over the primary evaluation. Which configuration should change?","options":["Make the primary manager evaluation step repeat for the second manager","Enable additional manager evaluations on the template and configure the corresponding subprocesses","Route employee acknowledgment to the second manager instead of the employee","Add a second Get Additional Reviewers step on the same competencies section"],"answer":1,"why":"Manager comments use the additional-manager feature and its own workflow. Repeating the primary or peer-rating path gives the wrong contribution.","reference":{"title":"Setup Considerations: Performance Reviews","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/performance-reviews/ham1552329509919.html"},"sample":0,"memberships":[{"collection":"talent150","label":"C05"}]},{"id":"T150-C09","module":"T","domain":3,"topic":"Talent pools","stem":"You want each talent partner to create their own talent pools and be able to manually add or remove pool members. If they choose to create a pool that is not shared with others, what type of talent pool will they create?","options":["Restricted Dynamic Talent Pool","Restricted Static Talent Pool","Private Dynamic Talent Pool","Private Static Talent Pool"],"answer":3,"why":"Private keeps the pool with its owner. Static membership lets the talent partner add or remove people individually.","reference":{"title":"Create Talent Pools","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-pools/dan1370796676163.html?toc=7.15.1"},"sample":2,"memberships":[{"collection":"talent150","label":"C09"}]},{"id":"T150-C12","module":"T","domain":1,"topic":"Feedback","stem":"A manager wants to request feedback about a worker. They select a locked feedback template to initially populate questions. What can the manager do?","options":["The manager may edit the defaulted questions to better meet their requirements.","The manager may add a question from a bank of previously written questions.","The manager may only use the default questions.","The manager may add additional new questions."],"answer":2,"why":"Locking the template preserves the question set. The manager must use it as supplied.","reference":{"title":"Supplied sample question and reviewed answer","url":""},"sample":3,"memberships":[{"collection":"talent150","label":"C12"}]},{"id":"T150-C13","module":"T","domain":1,"topic":"Feedback","stem":"Your client wants to integrate a feedback request directly into the annual performance appraisal process. How do you configure this?","options":["Add the Get Feedback from Review action step to the Start Performance Review process and attach the feedback template to the employee review template.","Attach the required feedback template to the employee review.","Add the Get Feedback from Review action step to the Start Development Plan process and attach the feedback template to the employee review.","Include Role Requested Feedback in the employee review's feedback section."],"answer":0,"why":"The business process step initiates the request. The feedback template supplies the questions for the annual review.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":11,"memberships":[{"collection":"talent150","label":"C13"}]},{"id":"T150-C15","module":"T","domain":3,"topic":"Skills and Career Profile","stem":"An enterprise wants to create their own list of skills and use them as search facets in reports. What type of skills can they create to accomplish this?","options":["Crowdsourced skills","Synonymous skills","Maintained skills","Skills Cloud skills"],"answer":2,"why":"Use maintained skills for the organization’s own skills list. These skills can appear in report search facets.","reference":{"title":"Reference: Skills Terminology","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/skills-and-skills-cloud/skills/reference--types-of-skills.html.html"},"sample":18,"memberships":[{"collection":"talent150","label":"C15"}]},{"id":"T150-C18","module":"T","domain":2,"topic":"Routing and visibility","stem":"Your Performance Review business process includes the following steps: (a) Set Review Content (b) Get Additional Reviewers (c) Complete Self Evaluation (d) Complete Manager Evaluation What Performance Review business process configuration allows your employees to review and confirm they received their performance review?","options":["Add a Provide Employee Review Comments step to the Complete Manager Evaluation subprocess.","Add a Complete Questionnaire step to the Complete Self Evaluation subprocess.","Add a Complete Questionnaire step to the Complete Manager Evaluation subprocess.","Add a Get Feedback step to the Start Performance Review business process."],"answer":0,"why":"This step lets the employee acknowledge receipt of the manager’s completed review and enter a comment.","reference":{"title":"Maintain Employee Review Acknowledgement Statuses","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/common-employee-review-setup/dan1370797570829.html"},"sample":20,"memberships":[{"collection":"talent150","label":"C18"}]},{"id":"T150-C21","module":"T","domain":1,"topic":"Goal cascading","stem":"You recently created a talent pool to help develop potential new managers. You added ten managers to the pool. Now you want to assign two self-development goals to each member of the talent pool. What task allows you to assign those two goals to all members in one event?","options":["Manage Organization Goals","Maintain Goals Setup","Add Goal To Employees","Create Goal for Worker"],"answer":2,"why":"Run the action from the talent pool to assign goals to the pool members together.","reference":{"title":"Steps: Manage Talent Pools","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-pools/dan1370796673944.html"},"sample":17,"memberships":[{"collection":"talent150","label":"C21"}]},{"id":"T150-C24","module":"T","domain":2,"topic":"Routing and visibility","stem":"During testing, you launched a Performance Review event with calibrations and all events are still in-progress. You notice that the goals are not populating as planned. What is the first task you should run before you correct your configuration?","options":["The Mass Rescind Business Process task for Start Performance Review only, including the subprocesses","The Mass Cancel Business Process task for Start Performance Review only, without the subprocesses","The Mass Rescind Business Process task for Start Performance Review and Launch Calibration, without the subprocesses","The Mass Cancel Business Process task for Start Performance Review and Launch Calibration, including the subprocesses"],"answer":3,"why":"The review and calibration have both started. Cancel Start Performance Review and Launch Calibration, including their subprocesses, before correcting the setup.","reference":{"title":"Supplied sample question and reviewed answer","url":""},"sample":1,"memberships":[{"collection":"talent150","label":"C24"}]},{"id":"T150-C26","module":"T","domain":3,"topic":"Skills and Career Profile","stem":"HR wants to record certification specialties and optionally collect specialty dates. Which configuration sequence addresses those requirements?","options":["Enable certification specialties but leave specialty date fields unconfigured","Configure optional date fields only on the course’s learning certification rule","Enable certification specialties in Skills and Experience Setup and configure the optional fie
