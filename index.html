lds","Configure a skill category for each specialty and collect dates in skill descriptions"],"answer":2,"why":"The setup enables certification specialties, while optional-field configuration controls the date details captured for them.","reference":{"title":"Steps: Set Up Certifications","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/worker-information/worker-experience/certifications/dan1370797325325.html"},"sample":0,"memberships":[{"collection":"talent150","label":"C26"}]},{"id":"T150-C27","module":"T","domain":3,"topic":"Talent pools","stem":"You want to create a talent pool of employees with a specific certification. What Workday-delivered report do you use to search for employees and then add them to the talent pool?","options":["Find Workers","Career Hub","Manage Talent Pool","Talent Pools"],"answer":0,"why":"Filter the report for the certification, select the matching workers, and use Add to Pool.","reference":{"title":"Add Members to Static Talent Pools","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-pools/jai1438380940642.html"},"sample":16,"memberships":[{"collection":"talent150","label":"C27"}]},{"id":"T150-C28","module":"T","domain":2,"topic":"Routing and visibility","stem":"For additional managers to participate in an employee's performance review, the employee's direct manager receives the Additional Manager task in their Inbox. They enter the employee's matrix manager, former manager, and a manager who works closely with the employee. When they submit the task, an error displays. Why did the error occur?","options":["You can only select up to two additional managers.","You can only select additional managers who are members of the Manager security group.","Additional managers can only receive a review that includes a Competencies section.","Additional managers cannot receive a review that includes a Feedback section."],"answer":0,"why":"The manager entered three names. Workday supports the primary manager plus up to two additional managers for a single review.","reference":{"title":"Concept: Additional Manager Evaluations","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/performance-reviews/additional-manager-evaluations/jai1423170003644.html"},"sample":15,"memberships":[{"collection":"talent150","label":"C28"}]},{"id":"T150-C31","module":"T","domain":2,"topic":"Routing and visibility","stem":"You want to configure your Performance Review business process so that other users can rate an employee's competencies. Which subprocesses do you configure for this?","options":["Get Additional Manager Evaluation for Performance Review and Complete Additional Evaluation for Performance Review","Get Additional Reviewers for Performance Review and Complete Additional Manager Evaluation for Performance Review","Get Additional Reviewers for Performance Review and Complete Additional Evaluation for Performance Review","Get Additional Manager Evaluation for Performance Review and Complete Additional Manager Evaluation for Performance Review"],"answer":2,"why":"The first subprocess identifies the additional reviewers. The second gives those reviewers a place to rate the employee’s competencies.","reference":{"title":"Setup Considerations: Performance Reviews","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/performance-reviews/ham1552329509919.html"},"sample":14,"memberships":[{"collection":"talent150","label":"C31"}]},{"id":"T150-C32","module":"T","domain":2,"topic":"Routing and visibility","stem":"An employee had a manager from January through August. The employee then had a new manager from September through December. In the Start Performance Review business process, for the Complete Manager Evaluation step, what security group would you use to route the step to the employee's manager that they had in January?","options":["Manager","Manager for Majority of Event","Matrix Manager","Primary Manager"],"answer":1,"why":"In this January–December review, the first manager supervised the employee from January through August. This group routes the evaluation to that manager.","reference":{"title":"Supplied sample question and reviewed answer","url":""},"sample":12,"memberships":[{"collection":"talent150","label":"C32"}]},{"id":"T150-C36","module":"T","domain":1,"topic":"Feedback","stem":"Your organization is launching a new feedback program, allowing feedback providers and requestors to decide if their name and photo appears with their feedback. Which feedback setting do you use to meet this requirement?","options":["Check Disable Anonymity","Check Disable Confidential Feedback for Give Feedback","Check Disable Confidential Feedback for Get Feedback","Uncheck Disable Anonymity"],"answer":3,"why":"Leaving Disable Anonymity unchecked lets users choose whether to reveal their identity. Confidentiality settings govern who can view the feedback.","reference":{"title":"Feedback Management","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/feedback-management.html"},"sample":4,"memberships":[{"collection":"talent150","label":"C36"}]},{"id":"T150-C38","module":"T","domain":3,"topic":"Talent pools","stem":"You want to create a talent pool that automatically updates its members based on criteria. You also want those in the Manager role to only have permissions to the members of their organization. What type of talent pool do you create?","options":["Restricted Dynamic Talent Pool","Restricted Static Talent Pool","Open Static Talent Pool","Open Dynamic Talent Pool"],"answer":0,"why":"Dynamic membership follows the saved search criteria. Restricted access can limit each manager’s view to members in their own supervisory organization.","reference":{"title":"Example: Give Administrators Access to Restricted Talent Pools","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-pools/tre1461018818406.html"},"sample":7,"memberships":[{"collection":"talent150","label":"C38"}]},{"id":"T150-C39","module":"T","domain":3,"topic":"Talent review workflow","stem":"The HR department wants to gather talent information from their employees and managers. What business process can they use?","options":["Complete Manager Evaluation","Launch Calibration","Launch Talent Review","Start Performance Review"],"answer":2,"why":"A talent review collects employee profile information and routes it to the manager for input or review.","reference":{"title":"Start Talent Reviews","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-reviews/dan1370796673224.html"},"sample":5,"memberships":[{"collection":"talent150","label":"C39"}]},{"id":"T150-C40","module":"T","domain":1,"topic":"Goal cascading","stem":"A manager wants to cascade a goal to several workers. What option is available in the Add Goal to Employees task?","options":["Succession Pool","Job Family","Organizations","Job Profile"],"answer":2,"why":"Select Organizations in Add Goal to Employees to send the goal to workers in the chosen supervisory organizations.","reference":{"title":"Supplied sample question and reviewed answer","url":""},"sample":10,"memberships":[{"collection":"talent150","label":"C40"}]},{"id":"T150-C47","module":"T","domain":2,"topic":"Review templates","stem":"Before the performance review event began, workers set their goals. You want to automatically include their goals in the performance review content. What configuration option do you select on the employee review template?","options":["Load Relevant Goals","Allow User to Add Existing Goals Manually","Show Additional Rating to Employee","Items Rated"],"answer":0,"why":"Select this option in the template’s Goals section to bring eligible existing goals into the review automatically.","reference":{"title":"Employee Review Template","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-template.html"},"sample":13,"memberships":[{"collection":"talent150","label":"C47"}]},{"id":"T150-C48","module":"T","domain":4,"topic":"Succession sourcing","stem":"An enterprise uses only the job management staffing model. What option groups workers for succession purposes?","options":["Succession Pools","Candidate Pools","Succession Plans","Development Plan"],"answer":0,"why":"Succession pools group potential successors by job profile, making them a fit for organizations using job management.","reference":{"title":"Setup Considerations: Succession","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/succession/wzj1581029577662.html"},"sample":9,"memberships":[{"collection":"talent150","label":"C48"}]},{"id":"T150-C50","module":"T","domain":1,"topic":"Feedback","stem":"A recognition badge has years of recorded use, but HR wants no new feedback to use it. Which maintenance action makes sense?","options":["Delete every feedback event in which it appears","Inactivate the badge","Delete the in-use badge","Rename the badge to the newest award and keep it active"],"answer":1,"why":"Inactivation retires the badge while preserving prior feedback. Workday restricts deletion once a badge has been used.","reference":{"title":"Feedback Management","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/feedback-management.html"},"sample":0,"memberships":[{"collection":"talent150","label":"C50"}]},{"id":"BP-001","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"Rina opens a review for Alex. Both can approve along with Jo. Policy bars the person who opened the event, but Alex may approve. Which restriction meets that requirement?","options":["Exclude Prior Approvers","Exclude Latest Reviser","Exclude Initiator","Exclude Event Subject"],"answer":2,"why":"Rina initiated the event. Alex is its subject, so excluding the subject would remove the wrong candidate.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"001"}]},{"id":"BP-002","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"An HR partner initiates Kai's review. Kai also holds the local HR approval role. Which control stops Kai approving this review while retaining eligibility for colleagues' reviews?","options":["Exclude Event Subject on the approval","Exclude Initiator on the approval","Exclude Prior Approvers on the approval","Remove the HR role from Kai's organization"],"answer":0,"why":"The restriction compares the candidate with the person under review. Removing the role would also change how colleagues' reviews route.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"002"}]},{"id":"BP-003","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"Mara completed an Action to enter a rating. Ian approved it. Both are candidates for the following Approval, whose only restriction excludes prior approvers. Who remains eligible?","options":["Ian only","Mara only","Neither person","Both Mara and Ian"],"answer":1,"why":"Ian completed an Approval. Entering rating data on an Action does not make Mara a prior approver.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"003"}]},{"id":"BP-004","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"Leah launched a review, Omar approved a prior step, and Mia is the subject. The final approval excludes initiators and prior approvers. All three hold the role. Who can receive it?","options":["Mia only","Leah only","Leah and Mia","Omar and Mia"],"answer":0,"why":"Leah and Omar each match an exclusion. The absence of a subject restriction leaves Mia eligible.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"004"}]},{"id":"BP-005","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"An HR approval has two eligible partners. One initiated the event. An alternate manager group is configured, and Exclude Initiator is on. Where does the approval go?","options":["To both HR partners until one acts","To the other partner and the alternate manager","To the other eligible HR partner","Only to the alternate manager"],"answer":2,"why":"An alternate group is consulted when restrictions remove every original candidate. One original partner survives here.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"005"}]},{"id":"BP-006","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"The only eligible approver is the employee being reviewed. Exclude Event Subject is on, and there is no alternate routing. What should the administrator expect in history?","options":["The step is left unassigned","The employee receives a warning and can approve","The approval escalates to the employee's manager","The step is skipped as Not Required"],"answer":3,"why":"There was an initial recipient and the restriction eliminated that person. With no alternate, the step is skipped.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"006"}]},{"id":"BP-007","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"A new supervisory organization has never had an HR partner. A review approval targets that role and has a valid alternate for excluded users. What happens?","options":["The initiator inherits the vacant role for this event","The step is skipped as Not Required","The alternate handles the vacant role","An unassigned task is created"],"answer":3,"why":"There were zero candidates before exclusions were tested. Alternate routing handles excluded candidates, not an initially empty role.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"007"}]},{"id":"BP-008","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"A regional approver launches reviews outside her home organization. If she is excluded, HR wants her own manager to approve, even when another manager owns the review subject. Which alternate context applies?","options":["Relative to the excluded user(s)","Relative to the review period midpoint","Relative to the transaction","One User Per Group Per Organization Required"],"answer":0,"why":"The fallback relationship must be evaluated from the excluded approver. Transaction-relative routing can resolve a different manager.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"008"}]},{"id":"BP-009","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"A central partner initiates a review in another division and is the only primary approver. The fallback HR role must resolve against that review's organization. Which setting matches?","options":["Alternate group relative to the transaction","Alternate group relative to the excluded user","Default alternate delegate of the initiator","Manager for Majority of Event on the initiation"],"answer":0,"why":"The review supplies the organizational context. The initiating partner's home organization is irrelevant to the requirement.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"009"}]},{"id":"BP-010","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"An administrator wants to configure alternate groups on an otherwise unrestricted approval. What must be in place to use the alternate routing rule?","options":["An entry rule must identify each possible alternate recipient","At least one routing restriction must be selected","Every primary approver must be assigned the Manager role","An approval chain must precede the restricted step"],"answer":1,"why":"Advanced routing links alternate groups to exclusions. A step delay, condition, or completion flag does not activate that fallback.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"010"}]},{"id":"BP-011","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"An alternate group should own an approval because all original candidates were excluded. Which process-history entry would distinguish this from ordinary routing?","options":["Manually Skipped","Approval by Alternate","Approval Chain by Alternate, for every kind of approval","Manually Advanced"],"answer":1,"why":"Workday labels an alternate-routed Approval with its own history entry. An Approval Chain has a separate alternate label.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"011"}]},{"id":"BP-012","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"Two HR partners hold the role in North and three in South. Both organizations must approve a review exception, but one partner per organization is enough. What should be configured?","options":["One Approval Chain up the North hierarchy","One User Per Group Per Organization Required for HR Partner","All five individual approvers on a single step","An alternate group relative to each excluded user"],"answer":1,"why":"Organization role-based routing requires a response for each represented organization while allowing any one holder of its selected role to act.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"012"}]},{"id":"BP-013","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"A review exception routes to one HR partner per organization. East has two partners and West has none. No other organization is involved. What happens?","options":["The entire step becomes unassigned","East receives the step and West is skipped","East must submit twice to represent West","West's manager must approve before East can act"],"answer":1,"why":"At least one organization has an assignee, so routing continues there. An empty role in another organization does not necessarily unassign the whole step.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"013"}]},{"id":"BP-014","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"Three organizations are returned by contextual security for a review approval. None has the required role filled. One-user-per-group-per-organization routing is enabled. What is the outcome?","options":["The original initiator approves for all three","All three approvals complete as Not Required","The step is unassigned","The first organization's manager is substituted"],"answer":2,"why":"With no holder in any of the returned organizations, Workday has no recipient for the step.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"014"}]},{"id":"BP-015","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"A designer combines an alternate group with one-user-per-group-per-organization routing on the same approval. Which behavior should testing confirm?","options":["The alternate acts before the organization role holders","The first organization uses the alternate and the others use role holders","The organization role routing takes precedence and the alternate is disregarded","An alternate is added to each organization's required approval"],"answer":2,"why":"These mechanisms do not stack on that step. Test actual role coverage in each returned organization.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"015"}]},{"id":"BP-016","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"A designer wants one participant per organization on a review follow-up reminder. Among the proposed step types, which supports the organization role-based setting?","options":["Checklist","Service","Initiation","To Do"],"answer":3,"why":"The setting is supported on Approval, Consolidated Approval, and To Do. A reminder implemented as a checklist would not expose it.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"016"}]},{"id":"BP-017","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"An administrator wants to prevent certain workers from launching a review by applying advanced routing to Initiation. Which change addresses the requirement?","options":["Restrict the initiating action in the BP security policy","Add alternate routing to Initiation","Exclude Prior Approvers on the Initiation step","Exclude Event Subject on the Initiation step"],"answer":0,"why":"Advanced routing cannot reroute Initiation. The initiating action determines who is permitted to start the transaction.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"017"}]},{"id":"BP-018","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"A vacant-role task is on Unassigned Tasks. An administrator wants the system to reevaluate restrictions and fallback groups while finding an eligible recipient. Which approach does that?","options":["Use role reassignment on the report","Choose an alternate delegate for the initiator","Manually choose a named person on the report","Change the event subject, then manually name a recipient"],"answer":0,"why":"Role reassignment reevaluates the next candidate. A manual person selection there does not apply routing restrictions.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"018"}]},{"id":"BP-019","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"A manager delegates approval to Pat. Pat already approved an earlier step. The tenant applies routing restrictions during delegation, the next step excludes prior approvers, and Lee is an eligible designated alternate delegate. Who should receive the delegated work?","options":["Pat, because the earlier approval was delegated","The prior approver's role holder regardless of delegation setup","The event subject","Lee"],"answer":3,"why":"When delegation honors restrictions, a prior approval by the delegate counts. The designated eligible alternate handles the task.","reference":{"title":"Concept: Delegation Routing Restrictions","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/delegate-business-processes/concept-delegation-routing-restrictions.html"},"sample":0,"memberships":[{"collection":"bp200","label":"019"}]},{"id":"BP-020","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"Approval and To Do run in parallel. Both exclude prior approvers, and tenant delegation restrictions apply. A delegate approves first. Why does the To Do disappear from that delegate's tasks?","options":["The approval rescinded the delegation","Only the manager can ever complete a delegated To Do","Parallel tasks always cancel one another","The delegate has become a prior approver even for the parallel To Do"],"answer":3,"why":"The delegate's approval changes eligibility before the parallel task is completed. Sharing a step order does not protect the second task from the restriction.","reference":{"title":"Concept: Delegation Routing Restrictions","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/delegate-business-processes/concept-delegation-routing-restrictions.html"},"sample":0,"memberships":[{"collection":"bp200","label":"020"}]},{"id":"BP-021","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"Both the delegate and alternate delegate are excluded on a review-related task. Where can a BP administrator find such exceptions?","options":["Talent Review Status Summary","My Team's Performance Reviews","Worker Calibration History","Business Process Tasks Not Delegated"],"answer":3,"why":"The delegation exception report identifies work excluded for both recipients. Review status reports track the underlying review instead.","reference":{"title":"Concept: Delegation Routing Restrictions","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/delegate-business-processes/concept-delegation-routing-restrictions.html"},"sample":0,"memberships":[{"collection":"bp200","label":"021"}]},{"id":"BP-022","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"A manager chooses Use Default Alternate for a delegation covering performance approvals. Which person does that option identify?","options":["The delegating manager's primary manager","The delegate's primary manager","The review subject's primary manager","The delegate's most recent approver"],"answer":1,"why":"The default is determined from the delegate, which can produce a different person than the manager of the subject or delegator.","reference":{"title":"Concept: Delegation Routing Restrictions","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/delegate-business-processes/concept-delegation-routing-restrictions.html"},"sample":0,"memberships":[{"collection":"bp200","label":"022"}]},{"id":"BP-023","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"A proposed delegation design expects the alternate delegate to initiate a review on the delegate's behalf. Which design decision is sound?","options":["Make the alternate transaction-relative to enable initiation","Enable prior-approver exclusion to grant initiation rights","Authorize a suitable initiator separately through the process policy","Use the alternate delegate to initiate whenever the primary delegate is absent"],"answer":2,"why":"An alternate delegate cannot initiate on behalf of a delegate. Initiation needs its own supported security arrangement.","reference":{"title":"Concept: Delegation Routing Restrictions","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/delegate-business-processes/concept-delegation-routing-restrictions.html"},"sample":0,"memberships":[{"collection":"bp200","label":"023"}]},{"id":"BP-024","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"A reviewer amended data after another person approved it. On a process that offers Exclude Latest Reviser, the next approval must exclude the editor but retain the prior approver. Which single restriction fits?","options":["Exclude Latest Reviser","Exclude Prior Approvers","Exclude Initiator","Exclude Event Subject"],"answer":0,"why":"A revision and an approval are different actions. Check that the specific process offers the reviser restriction before designing around it.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"024"}]},{"id":"BP-025","module":"T","domain":2,"topic":"Routing restrictions and alternate assignees","stem":"Manager appears in an alternate-group prompt, but it is not a valid security group for this step. A reviewer expects to send an excluded approver's task to the review subject's manager. What prevents this setup?","options":["Manager becomes valid for the transaction as soon as Exclude Initiator is selected","Manager requires a while-running condition before it can serve as a fallback","Manager cannot be selected relative to the transaction on this step","Manager can be selected only if the excluded user is also the event subject"],"answer":2,"why":"The prompt can include Manager even where that group is not valid for the step. Transaction-relative manager fallback has that additional validity check.","reference":{"title":"Maintain Advanced Routing","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/dan1370797863289.html?toc=6.3.5"},"sample":0,"memberships":[{"collection":"bp200","label":"025"}]},{"id":"BP-026","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"Ada manages from January to March. Bo manages from April through December, including the midpoint and the last day. HR wants the review to follow the delivered majority rule. Who receives the step?","options":["Both managers sequentially","Bo","Ada","The manager who initiated the review"],"answer":1,"why":"Workday first compares the midpoint manager with the end manager. They match, so Bo receives the task.","reference":{"title":"Concept: The Employee Review Process","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/thh1532439326282.html?toc=7.7.1.3"},"sample":0,"memberships":[{"collection":"bp200","label":"026"}]},{"id":"BP-027","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"For an annual review, Tori is manager at the start, Ren at the midpoint, and Sol at the end. Ren managed the most calendar days. With Manager for Majority of Event, who receives the task?","options":["Tori","Both Ren and Sol","Ren","Sol"],"answer":0,"why":"When the midpoint and end managers differ, the delivered rule chooses the start manager. It does not total days across every assignment.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"027"}]},{"id":"BP-028","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"A transfer occurred one week before year-end. The sponsor wants the new manager to own the task because they are the current manager, while the prior manager may contribute comments. Which pairing fits?","options":["Route to Manager and invite the prior manager for an additional manager evaluation","Assign both as majority managers on the same task","Use an approval chain to select whichever manager submits first","Route to Manager for Majority of Event and invite the new manager as a peer"],"answer":0,"why":"Current ownership and supplementary input are separate decisions. Majority routing in this case is likely to return the prior manager.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"028"}]},{"id":"BP-029","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"The majority manager gets the evaluation but the next applicable manager task still goes to the new manager. HR wants consistent majority-based ownership. What should it review?","options":["The group on each applicable step and its BP policy permissions","Only the organization chosen for the mass launch","Only the section visibility on the review template","The reviewer type assigned to peers"],"answer":0,"why":"Configuring one step does not reroute every subsequent step. Each applicable assignment and policy must support the intended group.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"029"}]},{"id":"BP-032","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"A host manager must complete a plan for a worker's additional position. Which modification belongs on Start Performance Improvement Plan?","options":["Apply the position routing modifier to Complete Manager Plan","Add the position modifier to Get Additional Reviewers on the PIP","Change Start Performance Review and leave the PIP definition alone","Use the modifier on Get Additional Manager Evaluation on the PIP"],"answer":0,"why":"Complete Manager Plan is a supported PIP step for position-specific routing. The performance review definition governs a different event.","reference":{"title":"Concept: Route Review Steps for Workers with Additional Positions","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/iih1552506963311.html"},"sample":0,"memberships":[{"collection":"bp200","label":"032"}]},{"id":"BP-033","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"A second HR approval should run only for executive reviews. All eligible executives use the same HR partner group. What should change?","options":["An exclusion of the HR partner on nonexecutive reviews","A critical validation on every manager evaluation","A step delay on the HR approval","An entry condition on the HR approval"],"answer":3,"why":"The decision is whether the step is needed for this event. An entry condition controls that decision before routing.","reference":{"title":"Concept: Step Conditions","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/dan1370796347609.html"},"sample":0,"memberships":[{"collection":"bp200","label":"033"}]},{"id":"BP-034","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"A consultant saved an executive-only condition rule. Nonexecutive reviews still enter the approval, and the step shows no condition. Which action is missing?","options":["Add the rule to the security group's membership","Define a second rule with the same expression","Make the HR approval the completion step","Apply the rule through Maintain Step Conditions on the step"],"answer":3,"why":"Creating a rule makes it available for reuse. The approval evaluates it only after the rule is attached to that step.","reference":{"title":"Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/hcm-core-for-administrators/business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"034"}]},{"id":"BP-035","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"An approval has two separate entry rules. The senior-level test is true but the exception-rating test is false. What happens to this approval?","options":["It runs because one rule passed","It runs and warns the approver","It becomes unassigned until both rules pass","It is skipped because both attached rules must pass"],"answer":3,"why":"Separate rules attached as one step condition must all evaluate true. A false result concerns the step's applicability, not its staffing.","reference":{"title":"Concept: Step Conditions","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/dan1370796347609.html"},"sample":0,"memberships":[{"collection":"bp200","label":"035"}]},{"id":"BP-036","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"HR wants a manager to fix an invalid rating explanation before submitting a revisable evaluation Action. Which configuration gives immediate enforcement?","options":["An entry condition on the next approval","An exit condition on the approval chain","A warning validation on that Action","A critical validation condition on that Action"],"answer":3,"why":"A critical validation blocks submission while its error condition is true. Skipping the next approval would leave the invalid data intact.","reference":{"title":"Concept: Step Conditions","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/dan1370796347609.html"},"sample":0,"memberships":[{"collection":"bp200","label":"036"}]},{"id":"BP-037","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"A short development comment is allowed, but the writer should see an advisory message before continuing. What fits a supported revisable Action?","options":["Entry condition on initiation","Warning validation","Exit condition on an Approval Chain","Critical validation"],"answer":1,"why":"A warning highlights the condition without blocking progress. A critical validation would enforce a mandatory change.","reference":{"title":"Concept: Step Conditions","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/dan1370796347609.html"},"sample":0,"memberships":[{"collection":"bp200","label":"037"}]},{"id":"BP-038","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"A rule is removed effective May 1. Two otherwise identical reviews started April 29 and May 2. Which pair is best for testing the removal?","options":["Expect behavior to depend solely on who owns the next task","Expect both to retain it until the review period ends","Expect both to omit it once the current date is May 2","Expect the old event still to use the rule and the new event to omit it"],"answer":3,"why":"Workday retains removed step conditions for previously initiated events. The removal's effective date determines which new events use the change.","reference":{"title":"Concept: Step Conditions","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/dan1370796347609.html"},"sample":0,"memberships":[{"collection":"bp200","label":"038"}]},{"id":"BP-039","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"An HR approval is skipped for a specific worker. The administrator can see the condition name but needs to know which comparison failed for that exact event. What should they use?","options":["Maintain Advanced Routing on the manager's organization","Test Rule from the event's Business Process related actions","The template's Applies To rule without reference to the event","Maintain Step Conditions on a fresh copy of the definition"],"answer":1,"why":"Rule Tester evaluates a condition against a specific transaction and shows its component results. Access requires an event using a condition rule and the relevant administration domain.","reference":{"title":"Advanced Business Process Configurations","url":"https://doc.workday.com/workday-education/en-us/course-manuals/hcm-core-supplemental-for-administrators/advanced-business-process-configurations.html"},"sample":0,"memberships":[{"collection":"bp200","label":"039"}]},{"id":"BP-040","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"A rating exception goes up an approval chain. Midlevel managers without the required authority should be skipped, but higher levels must still be considered. What sort of condition fits?","options":["An entry condition that rejects the entire chain","A while-running condition on the chain","An exit condition that is true for each midlevel manager","A critical validation on the initiating step"],"answer":1,"why":"The while-running condition decides whether a level participates. An exit condition would stop the chain instead of continuing upward.","reference":{"title":"Concept: Step Conditions","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/dan1370796347609.html"},"sample":0,"memberships":[{"collection":"bp200","label":"040"}]},{"id":"BP-041","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"An executive has signed off on a performance exception. No higher approval should be requested once the specified authority has been reached. What should the designer use?","options":["An alternate group for the last approver","A while-running condition to skip all lower levels","An exit condition on the Approval Chain","A checklist after the chain"],"answer":2,"why":"The chain climbs the hierarchy until its termination criterion or the top is reached. An exit condition expresses that stopping criterion.","reference":{"title":"Concept: Approval Chain Step","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-step-types/klq1658852814436.html"},"sample":0,"memberships":[{"collection":"bp200","label":"041"}]},{"id":"BP-042","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"The corporate review definition is correct. A child supervisory organization has a separate version and still follows an old path. Which definition should HR inspect first?","options":["The child's own definition","The corporate definition exclusively","The definition for the initiator's home organization in every case","The parent of the highest approver's organization"],"answer":0,"why":"A child's own version supersedes the inherited organizational definition for that child.","reference":{"title":"Concept: Business Processes and Organizations","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/dan1370797198109.html"},"sample":0,"memberships":[{"collection":"bp200","label":"042"}]},{"id":"BP-043","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"A new definition takes effect August 10. A review is initiated August 8 for a period ending August 31. Under ordinary organization-based selection, which version is used?","options":["The newest version available at completion","The version in effect on August 31","The version in effect on August 8","Whichever version was modified last before the first approval"],"answer":2,"why":"The event's initiation date selects the definition. The review period and completion date do not move the event to a later version.","reference":{"title":"Concept: Business Processes and Organizations","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/dan1370797198109.html"},"sample":0,"memberships":[{"collection":"bp200","label":"043"}]},{"id":"BP-044","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"Two definition-selection rules match the same review. The general rule is first and the executive rule is second. Which configuration will prioritize executive cases?","options":["Mark the second definition as having more steps","Set identical effective dates on both rules","Move the executive rule ahead of the general rule","Add an exit condition to the general approval chain"],"answer":2,"why":"Workday stops at the first matching rule. A broad rule placed first can prevent the more specific definition from being used.","reference":{"title":"Configure Rule-Based Business Processes","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/customize-business-processes/ala1435595998613.html"},"sample":0,"memberships":[{"collection":"bp200","label":"044"}]},{"id":"BP-045","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"An analyst needs to determine if a proposed subprocess is allowed on this review type before designing its routing. Which report should they use?","options":["Talent Review Status Summary","Business Process Tasks Not Delegated","Business Process Configuration Options","My Team's Performance Reviews"],"answer":2,"why":"Configuration Options lists allowed subprocesses, prerequisite actions, and supported actions for each BP type.","reference":{"title":"Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/hcm-core-for-administrators/business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"045"}]},{"id":"BP-046","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"A review should commit only after a required HR approval. A follow-up To Do may remain open afterward. Which design meets both requirements?","options":["Set both the approval and the To Do as completion steps","Mark the To Do as an approval and place it after completion","Make the employee's initiation the completion step and put the approval after it","Put the approval before completion and the To Do after completion"],"answer":3,"why":"The completion step commits the event; subsequent tasks can still run. Approval and Review steps must precede completion.","reference":{"title":"Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/hcm-core-for-administrators/business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"046"}]},{"id":"BP-047","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"A custom review definition has five sequential steps and no step explicitly marked for completion. When will the process be marked complete?","options":["When its last step finishes","As soon as the initiator submits","On the employee review period end date","At the first manager approval"],"answer":0,"why":"With no designated completion step, the last step determines completion. The period end date has a different purpose.","reference":{"title":"Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/hcm-core-for-administrators/business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"047"}]},{"id":"BP-048","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"An HR analyst can read review data but cannot initiate a particular review transaction. Other members of the same role report the same issue. Which permission should HR check first?","options":["The majority-manager routing group on the last approval","View permission on the report's data source alone","The initiating action on the relevant BP security policy","Access to the review's acknowledgement status list"],"answer":2,"why":"Permission to view stored data is distinct from authorization to start a transaction. Check the policy governing that specific action.","reference":{"title":"Configurable Security Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/security-for-administrators/configurable-security-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"048"}]},{"id":"BP-049","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"An administrator needs to change the order of two steps and then attach an entry condition. Which workflow uses the appropriate definition views?","options":["Use the template editor for both changes","Edit the definition for order, then use the step's related actions in View Definition for the condition","Set an effective date on the rule to change step order automatically","Use Maintain Step Conditions to reorder the steps as well"],"answer":1,"why":"Order is part of the workflow definition. Step-level features such as conditions are maintained through the relevant step's related actions.","reference":{"title":"Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/hcm-core-for-administrators/business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"049"}]},{"id":"BP-050","module":"T","domain":2,"topic":"Manager routing, conditions and definitions","stem":"HR wants a review follow-up to appear three days after a prior step, regardless of worker eligibility. What control should it change?","options":["Maintain Advanced Routing","Maintain Step Conditions with a subject exclusion","Maintain Step Delay","Maintain Step Label Override"],"answer":2,"why":"This is a timing requirement. A routing restriction changes recipients; a label changes only what the assignee sees.","reference":{"title":"Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/hcm-core-for-administrators/business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"050"}]},{"id":"BP-051","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"A matrix lead and a former manager should comment on goals and accomplishments during one annual review. Neither should replace the primary evaluator. Which subprocess should HR include?","options":["Get Additional Reviewers for competencies","A consolidated approval for the two managers","Complete Self Evaluation for Performance Review","Get Additional Manager Evaluation for Performance Review"],"answer":3,"why":"Additional manager evaluations collect comments across enabled sections. Multi-rater competency reviews have a narrower purpose.","reference":{"title":"Concept: Additional Manager Evaluations","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/performance-reviews/additional-manager-evaluations/jai1423170003644.html"},"sample":0,"memberships":[{"collection":"bp200","label":"051"}]},{"id":"BP-052","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"A manager wants peers and direct reports to rate the employee's competencies by reviewer type. They should not comment on unrelated goal sections. Which design fits?","options":["Ad Hoc Approve on the manager evaluation","Get Additional Reviewers under Start Performance Review","Provide Employee Review Comments after the evaluation","Get Additional Manager Evaluation with names hidden"],"answer":1,"why":"Multi-rater input is collected against competencies and can be grouped by reviewer type. Adding approval would record agreement rather than competency ratings.","reference":{"title":"Concept: Get Additional Reviewers for Competencies","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/common-employee-review-setup/uer1532425723978.html"},"sample":0,"memberships":[{"collection":"bp200","label":"052"}]},{"id":"BP-053","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"The primary manager wants three named project leaders to act concurrently as additional managers on one evaluation. What limit must the design respect?","options":["One additional manager per review section","Two total managers, including the primary manager","One primary manager plus at most two additional managers","Three additional managers if their comments are anonymous"],"answer":2,"why":"The additional-manager prompt supports two extra contributors. Multiple positions or comments settings do not increase that limit.","reference":{"title":"Concept: Additional Manager Evaluations","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/performance-reviews/additional-manager-evaluations/jai1423170003644.html"},"sample":0,"memberships":[{"collection":"bp200","label":"053"}]},{"id":"BP-054","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"The workflow asks for additional managers, but a newly created template does not enable their evaluations. Which setup should the administrator check?","options":["Mark the manager evaluation as the completion step","Use the template's competency reviewer types as additional managers","Display Additional Manager Names as the only template setting","Enable Additional Manager Evaluations for All Sections on the template"],"answer":3,"why":"The feature needs both template enablement and correctly configured Get/Complete processes and policies. Display settings by themselves only govern visibility.","reference":{"title":"Enable Additional Manager Evaluations","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/performance-reviews/additional-manager-evaluations/jai1423787848890.html"},"sample":0,"memberships":[{"collection":"bp200","label":"054"}]},{"id":"BP-055","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"HR sees a successful Get Additional Manager Evaluation event. Support needs the child event on which the invited lead actually writes comments. Which one should they open?","options":["Complete Additional Reviewer Evaluation for Performance Review","Provide Manager Review Comments","Complete Manager Evaluation for Performance Review","Complete Additional Manager Evaluation for Performance Review"],"answer":3,"why":"The Get process selects additional managers. Its Complete Additional Manager Evaluation subprocess carries each contributor's evaluation work.","reference":{"title":"Concept: Additional Manager Evaluations","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/performance-reviews/additional-manager-evaluations/jai1423170003644.html"},"sample":0,"memberships":[{"collection":"bp200","label":"055"}]},{"id":"BP-056","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"Two additional managers must be able to read each other's submitted comments. The primary manager's comments must remain unavailable to them. Which configuration fits?","options":["Enable Display Additional Manager Comments","Use the multi-rater competency average report","Enable Display Additional Manager Names only","Give the additional managers the primary manager's evaluation task"],"answer":0,"why":"The comments option shares submitted additional-manager comments with peers. Workday keeps the primary manager's comments out of their view.","reference":{"title":"Enable Additional Manager Evaluations","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/performance-reviews/additional-manager-evaluations/jai1423787848890.html"},"sample":0,"memberships":[{"collection":"bp200","label":"056"}]},{"id":"BP-057","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"Additional managers' comments should remain visible, but author names should display as Anonymous. Which template choice meets that requirement?","options":["Disable all additional manager evaluations","Clear Display Additional Manager Comments only","Clear Display Additional Manager Names","Make every contributor a confidential feedback provider"],"answer":2,"why":"The names flag controls attribution. The comments visibility flag and general feedback privacy controls serve other purposes.","reference":{"title":"Enable Additional Manager Evaluations","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/performance-reviews/additional-manager-evaluations/jai1423787848890.html"},"sample":0,"memberships":[{"collection":"bp200","label":"057"}]},{"id":"BP-059","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"An additional manager needs to add an accomplishment and delete an outdated goal, with supported sections and permissions enabled. Which statement fits the delivered feature?","options":["Adding an accomplishment is supported only through multi-rater input","Both operations are supported in those sections","Only the primary manager can change an accomplishment","The manager can comment but can never add or delete an item"],"answer":1,"why":"Accomplishments and goals support item additions and deletions for additional managers. Item-comment support has a separate list of sections.","reference":{"title":"Concept: Additional Manager Evaluations","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/performance-reviews/additional-manager-evaluations/jai1423170003644.html"},"sample":0,"memberships":[{"collection":"bp200","label":"059"}]},{"id":"BP-062","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"A department wants a quarterly peer competency exercise with no parent event. It proposes launching Get Additional Reviewers as a stand-alone BP. What is the supported design?","options":["Launch Complete Additional Reviewer Evaluation as an organization-wide parent","Include it as a subprocess of a performance review or development plan","Attach it to any review category, including disciplinary actions","Launch the Get process directly after configuring a reviewer type"],"answer":1,"why":"The multi-rater Get process requires a supported parent. A reviewer type classifies contributors but does not make the process stand-alone.","reference":{"title":"Concept: Get Additional Reviewers for Competencies","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/common-employee-review-setup/uer1532425723978.html"},"sample":0,"memberships":[{"collection":"bp200","label":"062"}]},{"id":"BP-063","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"A development-plan pilot uses peers and direct reports. In one organization employees should choose the contributors, and in another managers should choose them. What controls this difference?","options":["Who is configured to initiate the reviewer-selection subprocess","Whether reviewer types are configured as peers or direct reports","Which role owns the manager evaluation after the reviewers submit","Which person authored the competency section on the template"],"answer":0,"why":"The configured selection step can assign the choice of reviewers and types to either the employee or the manager.","reference":{"title":"Concept: Get Additional Reviewers for Competencies","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/common-employee-review-setup/uer1532425723978.html"},"sample":0,"memberships":[{"collection":"bp200","label":"063"}]},{"id":"BP-065","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"Additional reviewers receive and rate competencies correctly. The design also calls for written remarks on each competency, but the comment field is missing. What should be reviewed?","options":["The manager acknowledgement status descriptions","The HR approval chain exit condition","Item Comments configuration on the employee review template","Display Additional Manager Names"],"answer":2,"why":"For competency reviewers, item comments depend on the template's comment setting. Additional-manager visibility belongs to a different feature.","reference":{"title":"Concept: Get Additional Reviewers for Competencies","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/common-employee-review-setup/uer1532425723978.html"},"sample":0,"memberships":[{"collection":"bp200","label":"065"}]},{"id":"BP-066","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"The primary manager sees a competency rating line but needs the individual peer comments that informed it. Which approach uses the existing evaluation?","options":["Drill into additional reviewer details for that competency in the manager evaluation","Replace the competency rating scale with a feedback questionnaire","Open the employee acknowledgement status history","Start a second Get Additional Manager Evaluation event"],"answer":0,"why":"The manager evaluation exposes the detail behind a competency's additional-reviewer input. A new solicitation is unnecessary.","reference":{"title":"Concept: Get Additional Reviewers for Competencies","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/common-employee-review-setup/uer1532425723978.html"},"sample":0,"memberships":[{"collection":"bp200","label":"066"}]},{"id":"BP-067","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"An analyst needs numerical averages separately for peer and direct-report competency ratings. Which reporting design preserves that distinction?","options":["Group acknowledgement statuses by each review's end date","Average the primary managers' overall ratings by supervisory organization","Use Average Rating by Additional Reviewer Type on the Review Component business object","Use the count of submitted additional manager comments as a denominator for overall ratings"],"answer":2,"why":"The reporting field retains reviewer type while calculating numeric competency averages. An overall review score loses both dimensions.","reference":{"title":"Concept: Get Additional Reviewers for Competencies","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/common-employee-review-setup/uer1532425723978.html"},"sample":0,"memberships":[{"collection":"bp200","label":"067"}]},{"id":"BP-068","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"A manager needs written responses to two project-specific questions from coworkers. Competency ratings and a second manager evaluation are outside scope. What should the performance workflow invoke?","options":["Get Additional Manager Evaluation","Get Feedback from Review","Complete Questionnaire for the employee's own review task","Get Additional Reviewers"],"answer":1,"why":"The feedback subprocess solicits responses to questions from selected workers. The multi-rater subprocess collects competency evaluations.","reference":{"title":"Concept: The Employee Review Process","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/thh1532439326282.html?toc=7.7.1.3"},"sample":0,"memberships":[{"collection":"bp200","label":"068"}]},{"id":"BP-069","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"The template's historical feedback date range excludes March. The manager requests feedback during the active review in March. With a Feedback section configured, what should the manager expect?","options":["The feedback is excluded unless the filter is widened","The review-requested feedback can appear despite the historical date filter","The feedback appears only if a peer also submits a competency rating","The template must first extend the historical dates through the review period"],"answer":1,"why":"Feedback requested from within the review is included independently of the dates used to filter historical feedback.","reference":{"title":"Concept: The Employee Review Process","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/thh1532439326282.html?toc=7.7.1.3"},"sample":0,"memberships":[{"collection":"bp200","label":"069"}]},{"id":"BP-070","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"A worker tries to solicit feedback on themself from inside their own performance review. Which response accurately describes the in-review restriction?","options":["Use a supported manager-led in-review request for feedback on that worker","Move self-evaluation earlier to unlock the request","Enable employee acknowledgement to unlock self-request","Make the worker an additional manager on their own review"],"answer":0,"why":"Employees cannot request feedback on themselves within a review. An out-of-review feedback workflow is a separate context.","reference":{"title":"Concept: The Employee Review Process","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/thh1532439326282.html?toc=7.7.1.3"},"sample":0,"memberships":[{"collection":"bp200","label":"070"}]},{"id":"BP-071","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"A manager invited a contingent coworker with no Workday account to give feedback. The prompt accepted the selection, but delivery failed. What best explains the failure?","options":["All contingent workers are forbidden from giving feedback","Selecting a worker does not guarantee that the worker has an account to complete the request","Only transaction-relative additional reviewers receive feedback tasks","Review feedback can be delivered only after the manager evaluation is submitted"],"answer":1,"why":"The contributor must be able to access Workday even when the selection prompt permits the invitation.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"071"}]},{"id":"BP-072","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"A PIP sponsor wants to add peer competency ratings by enabling the same Get Additional Reviewers step used in annual reviews. Which review of the design is correct?","options":["Enable it on the PIP by copying the annual review template","Route Get Feedback from Review on the PIP to unlock multi-rater ratings","Use that subprocess on performance reviews or development plans, where it is supported","Enable it on the PIP by adding a peer reviewer type"],"answer":2,"why":"The restriction is tied to the parent process type. Copying sections or adding reviewer types does not extend its availability.","reference":{"title":"Concept: The Employee Review Process","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/thh1532439326282.html?toc=7.7.1.3"},"sample":0,"memberships":[{"collection":"bp200","label":"072"}]},{"id":"BP-073","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"HR wants an employee to record that they have read a performance evaluation and the manager to record the discussion afterward. Which two steps serve that purpose?","options":["Provide Employee Review Comments and Provide Manager Review Comments","Complete Self Evaluation and Get Additional Reviewers","Assess Potential and Set Review Content","Get Feedback from Review and Complete Additional Manager Evaluation"],"answer":0,"why":"The two acknowledgement steps capture a selected status and comments. They can be included within the manager evaluation subprocess.","reference":{"title":"Maintain Employee Review Acknowledgement Statuses","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/common-employee-review-setup/dan1370797570829.html"},"sample":0,"memberships":[{"collection":"bp200","label":"073"}]},{"id":"BP-074","module":"T","domain":2,"topic":"Additional reviewers, managers and feedback","stem":"Managers see a disciplinary acknowledgement status intended only for employees. HR needs to keep it available for employees on that review category. Which setting should change?","options":["Restrict the status to the manager comments action for that category","Inactivate the status for the tenant","Remove the status from the review category for employees and managers alike","Limit the status to the employee comments action and appropriate review category"],"answer":3,"why":"Status availability can be scoped by both review category and action step. Inactivation would remove it for the intended users too.","reference":{"title":"Maintain Employee Review Acknowledgement Statuses","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/common-employee-review-setup/dan1370797570829.html"},"sample":0,"memberships":[{"collection":"bp200","label":"074"}]},{"id":"BP-076","module":"T","domain":2,"topic":"Performance review stages and actions","stem":"The review type called Midyear Check-In was accidentally defined under Individual Development Plan. HR needs the performance-review BP and its manager pull-forward behavior. Which change addresses the underlying mismatch?","options":["Add the manager's performance-review security group to the development-plan template","Move the development plan's manager step immediately after the employee step only","Use a review type in the Performance Review category and its corresponding template","Rename the existing development-plan type Performance Review"],"answer":2,"why":"A tenant-defined review type belongs to a delivered category. A display-name or step-order change cannot turn a development-plan event into a performance review.","reference":{"title":"Define Employee Review Types","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/common-employee-review-setup/dan1370796683112.html"},"sample":0,"memberships":[{"collection":"bp200","label":"076"}]},{"id":"BP-077","module":"T","domain":2,"topic":"Performance review stages and actions","stem":"A manager wants one employee formally enrolled in a plan to remediate documented performance deficiencies. The employee should not self-start the plan. Which transaction fits?","options":["Start My Development Plan","Start Performance Review for Organization","Start Performance Improvement Plan for Employee","Start Talent Review for Worker"],"answer":2,"why":"The improvement-plan process is initiated for a specific employee. A development plan supports a different purpose and different launch options.","reference":{"title":"Concept: The Employee Review Process","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/thh1532439326282.html?toc=7.7.1.3"},"sample":0,"memberships":[{"collection":"bp200","label":"077"}]},{"id":"BP-078","module":"T","domain":2,"topic":"Performance review stages and actions","stem":"Two improvement plans are stalled at different steps. HR is authorized to advance PIP transactions and has verified that the outstanding work may be bypassed. Which tool is appropriate?","options":["Mass Advance Business Process","Manual Send Back on the completed performance review","Mass Rescind Business Processes","My Team's Performance Reviews using manager pull-forward"],"answer":0,"why":"Administrative mass advance is available for PIP processes. Manager pull-forward on the team performance review report serves a different review category and purpose.","reference":{"title":"Steps: Manage Performance Improvement Plans","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/performance-improvement-plans/dan1370796582485.html"},"sample":0,"memberships":[{"collection":"bp200","label":"078"}]},{"id":"BP-079","module":"T","domain":2,"topic":"Performance review stages and actions","stem":"HR launches a performance review for the Sales organization using a template whose employee eligibility rule matches only Engineering. No Sales worker meets the rule. What should happen?","options":["Sales reviews are created and held at initiation until the rule is changed","Every Engineering worker is included automatically","Every Sales worker qualifies because the launch overrides the rule","No Sales employee review is generated"],"answer":3,"why":"The launch supplies the candidate population and the template rule filters individual employees within it.","reference":{"title":"FAQ: Employee Reviews","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/ukj1502810467544.html"},"sample":0,"memberships":[{"collection":"bp200","label":"079"}]},{"id":"BP-080","module":"T","domain":2,"topic":"Performance review stages and actions","stem":"A worker already has a review in progress. A second proposed review has identical start and end dates and the same section types. Both reviews must run concurrently. Which change addresses the documented constraint?","options":["Use a different period or a new template with different section types","Change only the name displayed on the second template","Route the second review to a different HR partner","Change only the initiating administrator"],"answer":0,"why":"The conflict involves the worker, review dates, and section types. A label or assignee change leaves those conditions intact.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"080"}]},{"id":"BP-082","module":"T","domain":2,"topic":"Performance review stages and actions","stem":"At the beginning of the year, employees and managers must agree on the goals they will evaluate later. The design currently jumps from launch to evaluation. Which subprocess should be considered?","options":["Provide Employee Review Comments","Set Review Content","Update Performance Review Ratings for Manager Evaluation","Get Additional Manager Evaluation"],"answer":1,"why":"Set Content gives participants a place to establish review content early in the cycle. Acknowledgement occurs after evaluation.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"082"}]},{"id":"BP-083","module":"T","domain":2,"topic":"Performance review stages and actions","stem":"Employees and managers maintain goals throughout the year. HR wants to eliminate a redundant content-setting task and still evaluate those goals. Which design is appropriate?","options":["Omit Set Content and remove the Goals section","Keep Set Content but route it to an empty security group","Configure the review to load goals and omit the unnecessary Set Content step","Replace the Goals section with a manager acknowledgement"],"answer":2,"why":"Ongoing goals can load into the review when the template is configured accordingly. Empty routing would leave a workflow problem.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"083"}]},{"id":"BP-084","module":"T","domain":2,"topic":"Performance review stages and actions","stem":"During Set Content, a manager wants to replace a standard evaluation question with one written for their team. What is the proper configuration boundary?","options":["Define the question on the template before use","Retitle an acknowledgement status to change the question","Edit the question from the employee's Set Content Inbox item","Replace it from an ad hoc approval on the parent"],"answer":0,"why":"Review questions are defined on the template. Setting transaction content is different from editing the review design.","reference":{"title":"Concept: The Employee Review Process","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/thh1532439326282.html?toc=7.7.1.3"},"sample":0,"memberships":[{"collection":"bp200","label":"084"}]},{"id":"BP-085","module":"T","domain":2,"topic":"Performance review stages and actions","stem":"A manager has rights to the review but cannot pull an existing goal into Set Content manually. The goal is not already in the review. Which setting should HR check?","options":["Pull goals from the previous review only when the review periods match","Allow User to Add Existing Goals Manually on the template","Change the cascading worker's Manage Goals definition to include a Review Goal step","Load Content from Previous Review without enabling manual selection"],"answer":1,"why":"The template controls manual selection of existing goals. A new review or a different approver would not enable that prompt.","reference":{"title":"Start Employee Reviews","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/dan1370796677653.html?toc=7.7.1"},"sample":0,"memberships":[{"collection":"bp200","label":"085"}]},{"id":"BP-086","module":"T","domain":2,"topic":"Performance review stages and actions","stem":"A development item was added to the worker profile after the review launched. The manager wants it included in this review. Which action fits?","options":["Add it as a submitted additional manager comment","Select Use Existing Development Item and choose the new item","Restart the parent review because no post-launch item can be selected","Change the period end date to trigger a second automatic launch"],"answer":1,"why":"Items added after launch can be selected individually. Items pulled automatically at launch follow different removal rules.","reference":{"title":"Start Employee Reviews","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/dan1370796677653.html?toc=7.7.1"},"sample":0,"membership
