 depends on mappings. Leaving the mapping tab blank deliberately starts workers unplotted.","reference":{"title":"talent.pdf, PDF p. 220","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q191"}]},{"id":"T300-192","module":"T","domain":2,"topic":"Calibration","stem":"A manager must be prevented from submitting while workers remain unplotted. Which validation setting meets that requirement?","options":["Error for unplotted workers","Warning for unplotted workers","A due date earlier than the calibration launch","Unplotted Help Text only"],"answer":0,"why":"An error blocks submission until corrected. A warning informs the manager but permits proceeding.","reference":{"title":"talent.pdf, PDF p. 219-220","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q192"}]},{"id":"T300-193","module":"T","domain":2,"topic":"Calibration","stem":"The nBox has target percentages, but managers can submit distributions outside those targets without any notice. What is missing?","options":["An earlier due date on the review template","A different rating scale on each axis","Target Percentage Population validation configured as a warning or error","A second nBox with identical target percentages"],"answer":2,"why":"Targets alone are recommendations. The validation setting determines whether departures produce a warning or error.","reference":{"title":"talent.pdf, PDF p. 220","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q193"}]},{"id":"T300-194","module":"T","domain":2,"topic":"Calibration","stem":"A program sets Restrict Organization Level View to 1. For a manager with a role at only one level, which population is displayed?","options":["Direct reports and workers one level below","All descendants in the organization","Only workers one level above the manager","Only direct reports"],"answer":0,"why":"A value of 1 includes direct reports plus the next level below; zero would show all workers in the organization.","reference":{"title":"talent.pdf, PDF p. 219","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q194"}]},{"id":"T300-195","module":"T","domain":2,"topic":"Calibration","stem":"A program enables potential-assessment updates during calibration and also uses Potential as an nBox axis. Where should a participant adjust that axis value?","options":["In the calibration program's due-date field","Only on the original talent review template","Only in a separate Assess Potential event after closing calibration","By changing placement in the nBox rather than editing Potential in the list"],"answer":3,"why":"When Potential is an axis, its value follows nBox placement. Other enabled assessment attributes can be maintained in the list view.","reference":{"title":"talent.pdf, PDF p. 219,225","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q195"}]},{"id":"T300-196","module":"T","domain":3,"topic":"Talent review workflow","stem":"HR needs a new hire’s talent profile update to start during onboarding without a separate manual launch. Which configuration best fits?","options":["Include the talent review as a subprocess in Onboarding","Start the talent review only after the manager manually acknowledges the onboarding event","Add Start Performance Review to the worker’s development plan","Send the employee a static link to a talent card as the only process step"],"answer":0,"why":"Embedding the talent review lets onboarding initiate the profile workflow. A link or pool membership does not launch that event.","reference":{"title":"Populating Worker Talent Data","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/populating-worker-talent-data.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q196"},{"collection":"talent150","label":"A44"}]},{"id":"T300-197","module":"T","domain":3,"topic":"Talent review workflow","stem":"Workers must update their profiles, managers must review the changes, and HR approval is needed only for a designated population. What should the administrator configure?","options":["Three talent pools whose names identify the desired approval order","The worker and manager steps in Talent Review plus a conditional HR approval","A Feedback section and three approval labels on a performance template","An unconditional HR approval followed by hiding the section for other workers"],"answer":1,"why":"The business process controls sequence, conditions, and recipients. Hiding a field does not prevent an unconditional approval from routing.","reference":{"title":"talent.pdf, PDF p. 111,119","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q197"},{"collection":"talent150","label":"B21"}]},{"id":"T300-198","module":"T","domain":3,"topic":"Talent review workflow","stem":"HR wants only new hires in Japan eligible for a specific talent review template. What design controls template eligibility before submission?","options":["Restrict the report used to monitor reviews after the launch","Change the template’s Welcome Back instructions to state the eligibility","Hide all template sections from other workers after their reviews launch","Create a talent review rule for that population and apply it to the template"],"answer":3,"why":"A population rule filters eligible workers. Instructions or hidden content do not prevent an ineligible launch.","reference":{"title":"talent.pdf, PDF p. 111-112","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q198"},{"collection":"talent150","label":"C25"}]},{"id":"T300-199","module":"T","domain":3,"topic":"Talent review workflow","stem":"A supervisory organization has 25 workers. Four already have talent reviews in progress. All 25 otherwise meet the template rules. What happens when the organization review launches?","options":["The eligible 21 can start and the four with active reviews are excluded","Only the four active reviews are restarted with the new template","All 25 start after Workday automatically rescinds the earlier four","All 25 start, leaving four workers with parallel active talent reviews"],"answer":0,"why":"A worker may have one talent review in progress. Individual ineligibility does not prevent the eligible organization members from starting.","reference":{"title":"talent.pdf, PDF p. 114","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q199"},{"collection":"talent150","label":"A06"}]},{"id":"T300-200","module":"T","domain":3,"topic":"Talent review workflow","stem":"A project group spans five supervisory organizations and needs one group talent review launch. Its roster is deliberately fixed. Which launch population fits?","options":["A static talent pool containing the workers","A required-learning campaign audience","A succession pool for the project lead’s job profile","A dynamic talent pool built from the five organization names"],"answer":0,"why":"A talent review may launch for a static talent pool. General dynamic-pool capabilities do not make a dynamic pool a valid launch target here.","reference":{"title":"talent.pdf, PDF p. 115","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q200"},{"collection":"talent150","label":"A17"}]},{"id":"T300-201","module":"T","domain":3,"topic":"Talent review workflow","stem":"A manager reports an employee qualification is invisible during a talent review. The section is on the template and the manager receives their task. What should be checked next?","options":["The display order of the qualification section on the talent review template","The assigned organization used to launch the review, without checking section permissions","The domain security for the section and the manager’s permitted access","Whether the item was added to an organization goal category"],"answer":2,"why":"The template determines requested sections, while section security determines access. Receiving a task alone does not authorize every data element.","reference":{"title":"talent.pdf, PDF p. 112,123","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q201"},{"collection":"talent150","label":"C33"}]},{"id":"T300-202","module":"T","domain":3,"topic":"Talent review workflow","stem":"Employees want to move through their profile section by section. Managers want to review all sections on a single page. Which distinction fits?","options":["Use Summary Editor for both and split each section into a separate business process approval","Summary Editor for the sequence and Guided Editor for the single page","Guided Editor for the sequential experience and Summary Editor for the single page","Use Guided Editor for both and change the HR approval step to create a single-page manager view"],"answer":2,"why":"The editors present the same talent review through different layouts. Neither requires a different review population.","reference":{"title":"talent.pdf, PDF p. 114","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q202"},{"collection":"talent150","label":"B26"}]},{"id":"T300-203","module":"T","domain":3,"topic":"Talent review workflow","stem":"A competency exists on a worker’s job profile but is missing from the list the employee may select during a talent review. What should the administrator inspect?","options":["The competencies selected on the talent review template","The readiness value on the worker’s succession plan","The latest assessment source precedence only","The overall rating label on the performance review"],"answer":0,"why":"Talent reviews offer the competencies configured on the template. Job-profile association alone does not add that choice to this review.","reference":{"title":"talent.pdf, PDF p. 113","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q203"},{"collection":"talent150","label":"B01"}]},{"id":"T300-204","module":"T","domain":3,"topic":"Talent review workflow","stem":"A talent review is already underway. HR wants to revise the issued template immediately for the next cohort. What constraint applies to the template that was launched?","options":["Workday unlocks it automatically when the first employee opens the review","Workday locks it after launch, so plan a separate configuration for future use","Changing the welcome text always updates all in-progress section data","Removing one member from the target population unlocks the template"],"answer":1,"why":"Launching protects the template used by the active reviews. Changing a population member is not a way to revise an issued form.","reference":{"title":"talent.pdf, PDF p. 113","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q204"},{"collection":"talent150","label":"A01"}]},{"id":"T300-205","module":"T","domain":3,"topic":"Talent review workflow","stem":"The Talent Summary section is present, but it displays no summary data for any reviewer. Other sections work. What template configuration should be checked first?","options":["Whether the welcome page has separate instructions for the manager","Whether the group containing the section uses the guided or summary display","Whether the section was placed first or last in the sequence","At least one summary field is selected for display"],"answer":3,"why":"A Talent Summary section can be empty if none of its fields are selected. Verify the content configuration before changing broader security.","reference":{"title":"talent.pdf, PDF p. 113","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q205"},{"collection":"talent150","label":"C41"}]},{"id":"T300-206","module":"T","domain":3,"topic":"Talent review workflow","stem":"HR manually advances a stalled talent review, then sends it back. Who receives the Update My Talent Profile step in this documented exception path?","options":["Always the original employee assignee","The owner of the worker’s most recent talent pool","The administrator who advanced the review","Always the employee’s manager for majority of event"],"answer":2,"why":"If the review is sent back after manual advancement, the step is assigned to the advancing administrator instead of the original assignee.","reference":{"title":"talent.pdf, PDF p. 115","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q206"},{"collection":"talent150","label":"B23"}],"updated":true},{"id":"T300-207","module":"T","domain":3,"topic":"Talent review workflow","stem":"A manager enters skills and experience details, then plans to send a talent review back to the employee. They assumed everything they typed would stay manager-only. What should HR explain?","options":["Send-back freezes the review and hides both participants' prior changes","All manager input is automatically marked confidential","All manager input is removed before the task routes back","Much of the manager's skills and experience input can be visible after send-back"],"answer":3,"why":"The employee can see much of the manager-entered skills and experience information on a returned review. Evaluate the specific information before returning it.","reference":{"title":"talent.pdf, PDF p. 115","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q207"},{"collection":"bp200","label":"109"}]},{"id":"T300-208","module":"T","domain":3,"topic":"Talent review workflow","stem":"A talent review includes a worker's skills. During the open event, a separate skills transaction cannot update those same data. What explains this behavior?","options":["The talent review locks the included talent information during the event","The skills change requires approval from every member of the talent pool","The talent review starts a separate skills child event that owns all profile edits","Only the most recent performance evaluator may update the skills between launches"],"answer":0,"why":"Locking prevents conflicting edits to information currently under talent review. The restriction is tied to the data and event.","reference":{"title":"talent.pdf, PDF p. 123","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q208"},{"collection":"bp200","label":"110"}]},{"id":"T300-209","module":"T","domain":3,"topic":"Talent review workflow","stem":"An administrator expects an independent skills-and-experience BP approval to fire each time someone edits a skill inside the talent review. Why is that assumption incorrect?","options":["The separate approval fires only when the employee uses the summary editor","The talent review does not launch the stand-alone skills and experience processes","The stand-alone approval runs only for skills rated above target","The approval is replaced by a new calibration event"],"answer":1,"why":"The talent review manages its own edits and controls. Design required approvals on the actual talent review workflow.","reference":{"title":"talent.pdf, PDF p. 123","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q209"},{"collection":"bp200","label":"111"}]},{"id":"T300-210","module":"T","domain":3,"topic":"Talent review workflow","stem":"A skill was removed inside a talent review. The review was then completed and approved. What is the expected worker-profile result?","options":["The removed skill also disappears from the worker profile","The profile changes only after a separate Manage Skills approval","The skill returns automatically from the prelaunch snapshot","The removal appears only on the printed talent card"],"answer":0,"why":"Approved talent review changes flow back to the profile, including removal of a skill or experience.","reference":{"title":"talent.pdf, PDF p. 123","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q210"},{"collection":"bp200","label":"112"}]},{"id":"T300-211","module":"T","domain":3,"topic":"Talent review workflow","stem":"HR proposes duplicating a talent review template so identical sections have different access permissions solely because the template names differ. What configuration actually governs the access?","options":["A separate domain security policy created automatically for every template","The order in which the two templates were created","The template name and the launch transaction title","View and edit permissions on individual Talent Review subdomains"],"answer":3,"why":"Security permissions apply across talent review templates. Duplicating a template does not create independent section security.","reference":{"title":"talent.pdf, PDF p. 123","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q211"},{"collection":"bp200","label":"115"}]},{"id":"T300-212","module":"T","domain":3,"topic":"Talent review workflow","stem":"Contingent workers should participate in a talent review. The template's rule has been updated, but workers still cannot complete their own tasks. Which remaining check is relevant?","options":["Contingent Worker as Self in the Talent Review BP and domain security configuration","The additional manager security policy used for contingent project leads","The review template's section order and selection of a static launch pool","The contingent worker's manager role on the organization initiation alone"],"answer":0,"why":"Eligibility determines who can be included. Self-service BP and domain security determine whether the included contingent workers can participate.","reference":{"title":"talent.pdf, PDF p. 122","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q212"},{"collection":"bp200","label":"116"}]},{"id":"T300-213","module":"T","domain":3,"topic":"Talent review workflow","stem":"A contingent worker completes an eligible talent review and can update skills. Travel Preferences is absent even though the template includes it. Why?","options":["The manager must submit the review first to unlock travel preferences","The worker needs prior-approver status","The review must be launched for a pool rather than an organization","Workday hides that section for contingent workers"],"answer":3,"why":"Several career and mobility sections, including Travel Preferences, are unavailable to contingent workers in talent reviews. Eligibility alone does not expose them.","reference":{"title":"talent.pdf, PDF p. 122","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q213"},{"collection":"bp200","label":"117"}]},{"id":"T300-214","module":"T","domain":3,"topic":"Talent review workflow","stem":"The organization launch for talent reviews completed immediately. Individual workers still have Update Profile tasks, and HR must reverse the entire erroneous organization launch. Which operation is documented?","options":["Rescind only the first eligible worker's individual review","Cancel each Update Profile task and assume the organization launch is reversed","Mass Rescind Business Processes for the completed organization launch","Mass Cancel the completed organization initiation"],"answer":2,"why":"The launch event completes after starting eligible individual reviews. Its status differs from the status of its workers' tasks.","reference":{"title":"talent.pdf, PDF p. 115","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q214"},{"collection":"bp200","label":"119"}]},{"id":"T300-215","module":"T","domain":3,"topic":"Talent review workflow","stem":"An individual talent review shows Successfully Completed. The entire transaction must be reversed for that worker. Which action matches its state?","options":["Rescind the individual's talent review","Send Back from the manager's active evaluation","Remove the worker from the original talent pool only","Cancel the in-progress Update Profile task"],"answer":0,"why":"A completed personal talent review is rescinded. Editing a target list later does not reverse an already completed transaction.","reference":{"title":"talent.pdf, PDF p. 115","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q215"},{"collection":"bp200","label":"121"}]},{"id":"T300-216","module":"T","domain":3,"topic":"Talent review workflow","stem":"A manager needs one report showing each team member's latest talent review status alongside their most recent completed performance rating and potential assessment. Which report fits?","options":["Additional Manager Evaluations","Talent Review Status Summary","Business Process Tasks Not Delegated","Worker Calibration History"],"answer":1,"why":"The summary combines review status and key talent-profile results and lets managers act on reviews awaiting them.","reference":{"title":"talent.pdf, PDF p. 123","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q216"},{"collection":"bp200","label":"124"}]},{"id":"T300-217","module":"T","domain":3,"topic":"Talent review templates","stem":"HR combines Education and Job History with Display as One Section. The Guided Editor changes, but the Summary Editor does not. Is that expected?","options":["Yes; grouping changes the Guided Editor's wizard steps only","No; both editors must show exactly one identical combined panel","No; the grouping applies only to printed talent cards","Yes; but only until the first employee submits"],"answer":0,"why":"Display as One Section combines sections into one guided step and does not affect the Summary Editor.","reference":{"title":"talent.pdf, PDF p. 113","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q217"}]},{"id":"T300-218","module":"T","domain":3,"topic":"Talent review templates","stem":"Managers see section instructions in Guided Editor but not in Summary Editor. Which explanation fits the documented configuration?","options":["Section-level Employee and Manager instructions are for Guided Editor","Instructions disappear whenever a template is locked","Instructions require a calibration program before they appear in Summary Editor","Only employees can see section instructions in either editor"],"answer":0,"why":"These section instructions are specific to Guided Editor; Summary Editor has its own page instructions.","reference":{"title":"talent.pdf, PDF p. 113","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q218"}]},{"id":"T300-219","module":"T","domain":3,"topic":"Talent review templates","stem":"A template has twelve selected competencies. Only eight appear on the talent card. What should the administrator conclude?","options":["All twelve will appear only after the employee's next performance review","The card displays a maximum of eight competencies even though the template can contain more","The template supports only eight, so the last four never entered the review","The card requires one competency category per displayed competency"],"answer":1,"why":"The competency selection on the template and the talent-card display limit are different constraints.","reference":{"title":"talent.pdf, PDF p. 113","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q219"}]},{"id":"T300-220","module":"T","domain":3,"topic":"Talent review templates","stem":"HR needs a detailed narrative exceeding 250 characters without expanding the short summary on the talent card. Which field fits?","options":["Manager Summary with a second rating scale","Talent Summary Details","Employee Talent Summary with an increased tenant limit","Company Statement used as each worker's private narrative"],"answer":1,"why":"Talent Summary Details has no character limit and does not display on talent cards. The short summary fields remain limited to 250 characters.","reference":{"title":"talent.pdf, PDF p. 113,124","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q220"}]},{"id":"T300-221","module":"T","domain":3,"topic":"Talent review templates","stem":"Only one language ability type is active in the tenant. A talent review does not ask the employee to choose an ability type. Why?","options":["The manager's review period determines the ability type","Workday automatically uses the single active type","The worker's job profile supplies an unrelated rating scale","Languages are never selectable during talent reviews"],"answer":1,"why":"A single active language ability type is automatically used for the language proficiency section.","reference":{"title":"talent.pdf, PDF p. 113","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q221"}]},{"id":"T300-222","module":"T","domain":3,"topic":"Talent review templates","stem":"A talent administrator needs to identify who launched reviews from a locked template and on which dates. Where can they drill into that information?","options":["The current list of talent-pool members","The template's Initiations number","The list of inactive feedback questions","Only the worker's current career profile"],"answer":1,"why":"The Initiations link provides details of in-progress talent reviews, including the initiator and initiation date.","reference":{"title":"talent.pdf, PDF p. 113-114","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q222"}]},{"id":"T300-223","module":"T","domain":3,"topic":"Talent review templates","stem":"A template has warnings for missing instructional text but no configuration errors. Can HR launch the review?","options":["No; every instruction field must be populated","No; warnings must first be converted to inactive status","Yes; but only for individual workers, not organizations","Yes; instructional-text warnings do not prevent launch"],"answer":3,"why":"Instructional text is recommended, but these warnings do not block initiation. Configuration errors still need resolution.","reference":{"title":"talent.pdf, PDF p. 124-125","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q223"}]},{"id":"T300-224","module":"T","domain":3,"topic":"Talent cards","stem":"A corporate message should appear only on cards printed for one talent review template. Where should it be configured?","options":["The organization goal description","The worker's Talent Summary Details field","Company Statement on that talent review template","The default feedback template's help text"],"answer":2,"why":"The template's Company Statement is used on event-based talent cards printed for reviews using that template.","reference":{"title":"talent.pdf, PDF p. 112,116","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q224"}]},{"id":"T300-225","module":"T","domain":3,"topic":"Talent cards","stem":"HR needs an event-specific talent card, while a manager wants the worker's latest current talent data. Which pairing is correct?","options":["Event-based card for the review; current card for the latest profile data","Both always display only the most recently completed performance rating","Both require a new talent review before printing","Current card for the review snapshot; event-based card for all current profile changes"],"answer":0,"why":"Current cards reflect talent data as of the current date. Event-based cards reflect a specific Talent Review event.","reference":{"title":"talent.pdf, PDF p. 116","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q225"}]},{"id":"T300-226","module":"T","domain":3,"topic":"Skills and Career Profile","stem":"A worker adds a new tool as free text on their profile. HR cannot find the unrecognized term as a report facet. Which change creates a centrally governed, searchable skill?","options":["Add the skill name as a job-history description only","Add a skill-interest entry without creating the governed skill","Have employees add the same crowdsourced text without maintaining it","Define the organization-specific term as a maintained skill"],"answer":3,"why":"Crowdsourced entries can appear on a profile without becoming recognized search facets. A maintained skill gives the tenant a governed entry.","reference":{"title":"Reference: Skills Terminology","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/skills-and-skills-cloud/skills/reference--types-of-skills.html.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q226"},{"collection":"talent150","label":"B48"}]},{"id":"T300-227","module":"T","domain":3,"topic":"Skills and Career Profile","stem":"A tenant uses automated synonym management. HR wants newly created proprietary maintained skills protected from automatic synonym replacement by default. Which control fits?","options":["Exclude Maintained Skills from Synonym Management by Default","Indicate Primary Skill Search Results as Skills Cloud","Set Tenant Skills as the primary search results but leave synonym handling unchanged","Populate Suggested Skills for Workers"],"answer":0,"why":"The exclusion governs migration of synonymous maintained skills. Search priority, suggestions, and endorsement visibility do not preserve their identity.","reference":{"title":"Populating Worker Talent Data","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/populating-worker-talent-data.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q227"},{"collection":"talent150","label":"C23"}]},{"id":"T300-228","module":"T","domain":3,"topic":"Skills and Career Profile","stem":"Default synonym protection is on, but HR wants one maintained skill replaced by its synonymous Skills Cloud skill. What is the narrowest change?","options":["Remove the skill from suggested skills and retain its synonym exclusion","Disable synonym protection for every maintained skill tenant-wide","Change search priority to Skills Cloud without changing the maintained skill’s exclusion","Clear Exclude from Synonym Management for that skill"],"answer":3,"why":"The skill-level exclusion controls that specific maintained synonym. A tenant-wide change would affect unrelated skills.","reference":{"title":"Populating Worker Talent Data","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/populating-worker-talent-data.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q228"},{"collection":"talent150","label":"C35"}]},{"id":"T300-229","module":"T","domain":3,"topic":"Skills and Career Profile","stem":"Skills Cloud is enabled. Search should list company-maintained terminology first because the organization has a mature internal taxonomy. What should be configured?","options":["Populate suggested skills for workers while retaining the existing search preference","Include tenanted skills in matching but leave the primary results set to Skills Cloud","Tenant Skills as the primary skill search results","Exclude new maintained skills from synonym management without changing search priority"],"answer":2,"why":"The primary-results preference prioritizes tenant or Skills Cloud terms. It changes discovery rather than how a worker is rated.","reference":{"title":"Setup Considerations: Skills Cloud","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/skills-and-skills-cloud/skills-cloud/ilb1557158988004.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q229"},{"collection":"talent150","label":"B47"}]},{"id":"T300-230","module":"T","domain":3,"topic":"Skills and Career Profile","stem":"Workers can search for existing skills but see no suggested skills on their profiles. The organization wants suggestions based on worker data. Which configuration targets the missing feature?","options":["Populate Suggested Skills for Workers in Maintain Skills and Experience Setup","Enable skill endorsements without enabling worker suggestions","Include tenanted skills in matching without enabling worker suggestions","Prioritize Skills Cloud in skill search but leave worker suggestions disabled"],"answer":0,"why":"The worker-suggestions setting enables the background process. The ability to search for skills does not, by itself, enable recommendations.","reference":{"title":"Populating Worker Talent Data","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/populating-worker-talent-data.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q230"},{"collection":"talent150","label":"A32"}]},{"id":"T300-231","module":"T","domain":3,"topic":"Skills and Career Profile","stem":"A manager says a suggested skill proves the employee has demonstrated it. Which distinction should guide the design of their assessment report?","options":["Every maintained skill in the catalog is evidence for each worker","A suggestion is a recommendation, while a rating or endorsement is separately recorded evidence","A suggestion always equals the highest numeric proficiency","An endorsement automatically becomes the job profile’s target proficiency"],"answer":1,"why":"Suggestions identify possible skills. Ratings and endorsements capture separate information about a worker rather than automatically following from a recommendation.","reference":{"title":"Reference: Skills Terminology","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/skills-and-skills-cloud/skills/reference--types-of-skills.html.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q231"},{"collection":"talent150","label":"C11"}]},{"id":"T300-232","module":"T","domain":3,"topic":"Skills and Career Profile","stem":"HR wants workers to maintain skills, experience, and interests from a single page, with the sections arranged in a chosen order. Which setup is appropriate?","options":["Create only a Talent Review template and suppress self-service access","Enable Career Profile, configure its sections, and secure the applicable data","Launch a separate performance review every time a worker edits an interest","Use a succession pool with one column per career-profile field"],"answer":1,"why":"Career Profile consolidates profile tasks and lets the tenant arrange sections. Section configuration still depends on the appropriate security.","reference":{"title":"talent.pdf, PDF p. 108-110","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q232"},{"collection":"talent150","label":"A28"}]},{"id":"T300-233","module":"T","domain":3,"topic":"Skills and Career Profile","stem":"A worker wants to indicate willingness to relocate without changing their current work location or supervisory organization. What should they update?","options":["The location hierarchy used by the talent pool","The organization’s job profile location restrictions","Their relocation preferences in the career profile","The primary location on the position"],"answer":2,"why":"Mobility preference is career data. Changing a staffing or position location would record a different fact.","reference":{"title":"talent.pdf, PDF p. 36-37","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q233"},{"collection":"talent150","label":"A16"}]},{"id":"T300-234","module":"T","domain":3,"topic":"Skills and Career Profile","stem":"Two terms mean the same skill, while two other entries are exact spelling matches. Why distinguish synonyms from duplicates when cleaning profile data?","options":["Duplicates are terms with related meanings, while synonyms must be exact string matches","Synonyms use different terms for equivalent skills, while duplicates are matching entries","Synonyms identify different proficiency levels, while duplicates identify equivalent skill names","Duplicates are different expressions of related skills, while synonyms identify separate rating scales"],"answer":1,"why":"The relationship between the skill terms determines the cleanup. Neither type describes a worker’s proficiency or feedback.","reference":{"title":"Reference: Skills Terminology","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/skills-and-skills-cloud/skills/reference--types-of-skills.html.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q234"},{"collection":"talent150","label":"B19"}]},{"id":"T300-235","module":"T","domain":3,"topic":"Skills and Career Profile","stem":"The Interests section is active on Career Profile, but one employee group cannot update its own interests. Other groups can. What is the most direct security check?","options":["The group’s self-service access for Interests","The order of Interests among the already active sections","The group’s access to view other workers’ career interests only","The eligibility rule on a scheduled talent review template"],"answer":0,"why":"Enabling a section exposes a capability at the tenant level. The applicable self-service domain determines whether the group can use it.","reference":{"title":"talent.pdf, PDF p. 107-110","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q235"},{"collection":"talent150","label":"A25"}]},{"id":"T300-236","module":"T","domain":3,"topic":"Skills and Career Profile","stem":"HR wants to identify critical skills for specific job profiles and build a workforce report. Which inputs are suitable for the critical-skills setup?","options":["All skills entered as goal milestone text","Recognized Skills Cloud or maintained skills","Unrecognized crowdsourced terms only","Only skill endorsements created during calibration"],"answer":1,"why":"Critical skills can be based on recognized Skills Cloud and maintained skills. Unstructured text does not give the report the same governed objects.","reference":{"title":"Reference: Skills Terminology","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/skills-and-skills-cloud/skills/reference--types-of-skills.html.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q236"},{"collection":"talent150","label":"B22"}]},{"id":"T300-237","module":"T","domain":3,"topic":"Skills and Career Profile","stem":"HR enables certification specialties but also needs to collect specialty date fields. Which additional configuration targets the date requirement?","options":["Change the specialty name to include its effective dates","Enable suggested skills without changing certification fields","Configure the dates only on an employee review template","Configure Optional Fields for specialty dates on Manage Certifications"],"answer":3,"why":"Enabling certification specialties and configuring optional specialty dates are separate steps.","reference":{"title":"Steps: Set Up Certifications","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/worker-information/worker-experience/certifications/dan1370797325325.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q237"}]},{"id":"T300-238","module":"T","domain":3,"topic":"Interests and Career Profile","stem":"HR creates a career preference with a business-facing name and an integration-facing identifier. Which field is intended for web-service and integration use?","options":["The worker-specific talent summary","ID on the career preference","The position of the preference in the selection list","The preference description"],"answer":1,"why":"Maintain Career Preferences separates the display information from the ID used by integrations.","reference":{"title":"talent.pdf, PDF p. 35","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q238"}]},{"id":"T300-239","module":"T","domain":3,"topic":"Interests and Career Profile","stem":"A worker tries to edit interests on the profile while those interests are under an active talent review. What should support explain?","options":["Change the review template to Summary Editor to unlock the profile","Start a separate Manage Interests event to overwrite the review's snapshot","Complete the active review before expecting its updated interests on the profile","Remove the manager's access to interests so the worker can edit"],"answer":2,"why":"Interests cannot be updated on the worker profile while an employee or talent review is in progress. Updated information displays after completion.","reference":{"title":"talent.pdf, PDF p. 32","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q239"}]},{"id":"T300-240","module":"T","domain":3,"topic":"Interests and Career Profile","stem":"Employees can see a public job's name and summary, but HR wants qualifications visible only to a narrower group. Which design is supported?","options":["Use Public Job Qualifications: View as the child domain for restricted qualifications access","Grant only Worker Data: Interests to the narrower group","Use the review template's Applies To rule to secure the job catalog","Make the entire job profile private and keep its name in a talent pool"],"answer":0,"why":"The parent public-job domain covers the name and summary; the optional child domain can restrict qualifications separately.","reference":{"title":"talent.pdf, PDF p. 34-35","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q240"}]},{"id":"T300-241","module":"T","domain":3,"topic":"Interests and Career Profile","stem":"A career preference is retired from future selection. Employees who previously chose it must retain valid historical data. What action fits?","options":["Change its ID to the replacement preference's ID","Delete the preference from every worker profile","Inactivate the preference","Change all existing selections to the first active preference"],"answer":2,"why":"Inactivating a career preference removes it from selection lists while retaining validity for existing selections.","reference":{"title":"talent.pdf, PDF p. 35","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q241"}]},{"id":"T300-242","module":"T","domain":3,"topic":"Interests and Career Profile","stem":"HR wants travel preferences expressed as two days per month instead of percentages. Which setup should it use?","options":["Maintain Relocation Areas","Configure Employee Review Rating Scales","Maintain Career Preferences only","Maintain Travel Amounts"],"answer":3,"why":"Travel amounts can be defined using measures such as percentages, days, or weeks, rather than a single fixed format.","reference":{"title":"talent.pdf, PDF p. 36","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q242"}]},{"id":"T300-243","module":"T","domain":3,"topic":"Interests and Career Profile","stem":"An HR partner has access to relocation preference domains but cannot edit the preference transaction. Which additional security should be checked?","options":["Talent Pool: Manage Membership only","The public-job qualifications child domain","Manage Relocation Preferences business process access","Start Performance Review initiation only"],"answer":2,"why":"The relocation task requires security on the Manage Relocation Preferences business process as well as the relevant data access.","reference":{"title":"talent.pdf, PDF p. 37","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q243"}]},{"id":"T300-244","module":"T","domain":3,"topic":"Interests and Career Profile","stem":"HR wants career interests, job profiles, skill interests, travel, and relocation presented through consolidated interests. Which workflow underlies that view?","options":["Assess My Team's Potential","Manage Interests","Get Feedback on Self","Manage Succession Plan"],"answer":1,"why":"The consolidated Interests view uses Manage Interests, secured through the relevant self-service and worker-data interests domains.","reference":{"title":"talent.pdf, PDF p. 38","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q244"}]},{"id":"T300-245","module":"T","domain":3,"topic":"Interests and Career Profile","stem":"Career Profile is enabled for Education. HR expects its initiating action to remain waiting for a separate user step after a profile update. What behavior should it account for?","options":["Career Profile converts the action into an additional-manager evaluation","Career Profile starts an employee performance review instead","Career Profile disables the Manage Education business process entirely","Career Profile automatically completes the corresponding initiating action"],"answer":3,"why":"For supported active sections, Career Profile automatically completes the corresponding initiating actions. This is not a statement that all subsequent configured workflow is removed.","reference":{"title":"talent.pdf, PDF p. 107","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q245"}]},{"id":"T300-246","module":"T","domain":3,"topic":"Interests and Career Profile","stem":"A tenant has opted in to Career Profile, but Skills remains absent while other sections show. What should the administrator inspect next?","options":["Whether every worker belongs to a shared talent pool","Whether Skills is active in Configure Career Profile and appropriately secured","Whether a talent review template is currently locked","Whether a performance review template includes a Skills section"],"answer":1,"why":"Opting in enables the feature, while section activation, order, and domain security control the actual experience.","reference":{"title":"talent.pdf, PDF p. 108-109","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q246"}]},{"id":"T300-247","module":"T","domain":3,"topic":"Talent pools","stem":"A cohort should be hand-picked and then stay fixed even when members change roles. Authorized talent partners should manage it collaboratively. Which membership method fits?","options":["Private membership with a report-based refresh","A succession pool that recalculates nightly from job titles","Static membership in a shared talent pool","Dynamic membership from a saved worker search"],"answer":2,"why":"A static roster changes through manual membership actions. Sharing is a separate access decision from whether the roster recalculates.","reference":{"title":"talent.pdf, PDF p. 309-312","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q247"},{"collection":"talent150","label":"C30"}]},{"id":"T300-248","module":"T","domain":3,"topic":"Talent pools","stem":"An authorized pool owner needs the workforce meeting a certification criterion to stay current automatically. What should provide the pool’s membership?","options":["A saved-search result copied once into a static pool","A manually curated static pool with the same criteria in its description","A succession pool with the certification recorded as readiness","A saved search that defines a dynamic talent pool"],"answer":3,"why":"A dynamic pool derives membership from search criteria. A one-time selection captures only the workers who matched at that moment.","reference":{"title":"talent.pdf, PDF p. 310","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q248"},{"collection":"talent150","label":"A27"}]},{"id":"T300-249","module":"T","domain":3,"topic":"Talent pools","stem":"A restricted pool contains employees from five organizations. A manager should see only their own employees, while the talent administrator needs the full list. Which approach fits?","options":["Convert to an open pool and remove organization prompts from the report","Use a restricted pool but give the administrator the same constrained worker scope as each manager","Use an open pool and assign the administrator a role, leaving managers with unrestricted member visibility","Keep restricted view for managers and configure appropriate administrator access to the pool"],"answer":3,"why":"Restricted membership visibility and administrator access can be configured separately. A display filter cannot replace those permissions.","reference":{"title":"talent.pdf, PDF p. 315-316","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q249"},{"collection":"talent150","label":"B14"}]},{"id":"T300-250","module":"T","domain":3,"topic":"Talent pools","stem":"A certification search returned 37 workers, but the talent partner wants only 12 of them in a static development pool. Which action has the correct scope?","options":["Add the certification to the pool name and rerun the report","Select the 12 search results and use Add to Pool","Save the entire search and make it the pool’s dynamic membership","Select all 37 and change the pool to restricted visibility"],"answer":1,"why":"A static pool accepts selected workers. Restricted view affects visibility, not the roster, and the full saved search would include all 37.","reference":{"title":"talent.pdf, PDF p. 310-311","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q250"},{"collection":"talent150","label":"B09"}]},{"id":"T300-251","module":"T","domain":3,"topic":"Talent pools","stem":"The roster must be curated manually and visible in full to authorized pool collaborators across organizations. It should not be limited to each manager’s own team. Which pairing best fits?","options":["Open and dynamic","Restricted and static","Private and static","Open and static"],"answer":3,"why":"Static describes manual membership. Open avoids the restricted-view constraint while ordinary role and security requirements still apply.","reference":{"title":"talent.pdf, PDF p. 309-313","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q251"},{"collection":"talent150","label":"A19"}]},{"id":"T300-252","module":"T","domain":3,"topic":"Talent pools","stem":"A user wants to take a pool-wide action but exclude one employee from that action. The action applies to all current members and the roster is manually editable. What should the owner do first?","options":["Keep the roster unchanged and remove the employee from the report that originally identified members","Leave the employee in the pool and move them to the bottom of the member list","Hide the worker from the manager’s report and keep the roster unchanged","Adjust the static pool’s membership or use a separately scoped pool"],"answer":3,"why":"Pool-wide actions operate on the membership set. Sorting or hiding a row does not exclude the person from that set.","reference":{"title":"talent.pdf, PDF p. 312","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q252"},{"collection":"talent150","label":"A10"}]},{"id":"T300-253","module":"T","domain":3,"topic":"Talent pools","stem":"A previously used talent pool is marked inactive. An administrator tries to add new members and run a pool-wide action. Which behavior should they expect?","options":["Adding members is allowed but all members become private","Actions remain available if the worker list was last updated manually","The pool automatically converts to a succession pool on first use","Membership changes and actions are unavailable while the pool is inactive"],"answer":3,"why":"An inactive pool cannot accept membership changes or pool actions. Static versus dynamic does not remove that restriction.","reference":{"title":"talent.pdf, PDF p. 308","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q253"},{"collection":"talent150","label":"A41"}]},{"id":"T300-254","module":"T","domain":3,"topic":"Talent pools","stem":"A manager can see all their own organization’s workers on general reports, but cannot open a particular talent pool. Which assumption should be revisited?","options":["Anyone who can run Find Workers automatically owns all pools containing the workers","A restricted pool can be opened only if every member reports to the viewing manager","A static pool can be opened only by users who added at least one member","Worker access does not by itself supply the required role and security on that pool"],"answer":3,"why":"Access to workers and access to a specific talent pool are separate. Verify the relevant talent-pool permissions and role.","reference":{"title":"talent.pdf, PDF p. 312-313","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q254"},{"collection":"talent150","label":"B33"}]},{"id":"T300-255","module":"T","domain":3,"topic":"Talent pools","stem":"A team wants Add to Pool on a custom search report that already returns employees. Which report configuration enables adding selected results to a static pool?","options":["Include the Add to Pool mass action on the Advanced tab of a suitable worker-based search report","Add a pool prompt without enabling mass actions on the selected workers","Change the report’s title to Talent Pools and retain its existing actions","Save the search as dynamic membership and assume the selected static pool will be updated"],"answer":0,"why":"The mass action makes selected results actionable. A descriptive field or matrix layout does not supply membership updates.","reference":{"title":"talent.pdf, PDF p. 310-311","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q255"},{"collection":"talent150","label":"B20"}]},{"id":"T300-256","module":"T","domain":3,"topic":"Talent pools","stem":"A talent partner wants a personal, manually maintained list they do not share. Later, a department asks for a collaborative list visible to multiple authorized roles. Which distinction drives the redesign?","options":["Dynamic versus static membership, independently of every access setting","Private versus shared access, independently of static membership","Talent pool versus succession plan, based solely on the number of owners","Talent review versus performance review, based solely on the worker count"],"answer":1,"why":"The change concerns who can use the list. Both lists can remain manually populated while their access models differ.","reference":{"title":"talent.pdf, PDF p. 313-314","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q256"},{"collection":"talent150","label":"B29"}]},{"id":"T300-257","module":"T","domain":3,"topic":"Talent pools","stem":"HR wants one fixed, manually maintained pool of 6,000 workers. What documented constraint affects this design?","options":["Static pools support up to 5,000 members","There is no static-pool limit if members come from a custom report","Static pools support up to 50,000 members","The limit is 5,000 only for restricted pools"],"answer":0,"why":"The static membership limit is 5,000. Dynamic pools have a different limit but would not preserve manual fixed membership.","reference":{"title":"talent.pdf, PDF p. 310","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q257"}]},{"id":"T300-258","module":"T","domain":3,"topic":"Talent pools","stem":"A dynamic pool owner can access the pool role but cannot act on a saved search using a restricted certification facet. What requirement should be checked?","options":["The number of managers represented in the pool","Permission to change the pool from dynamic to static on every use","Whether the saved search contains exactly one organization","Access to every facet in the associated saved search"],"answer":3,"why":"To view or act on a dynamic pool, the user needs access to all facets in its saved search.","reference":{"title":"talent.pdf, PDF p. 310","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q258"}]},{"id":"T300-259","module":"T","domain":3,"topic":"Talent pools","stem":"A dynamic pool is based on a saved search that would return 48,000 workers. Which capacity statement is documented?","options":["Dynamic pools support up to 50,000 members","Dynamic pools have a 10,000-member limit whenever a custom report is used","Dynamic pools have the same 5,000-member limit as static pools","Dynamic pools have no documented maximum"],"answer":0,"why":"The dynamic-pool maximum is 50,000, compared with 5,000 for static pools.","reference":{"title":"talent.pdf, PDF p. 310","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q259"}]},{"id":"T300-260","module":"T","domain":3,"topic":"Talent pools","stem":"HR has curated members in a spreadsheet and needs to update a static pool through an inbound EIB. Which service is identified for the template?","options":["Put Competency Category","Put Talent Pool","Get Feedback Questions","Get Employee Reviews"],"answer":1,"why":"The reference describes creating an EIB spreadsheet from the Put Talent Pool web service for talent-pool membership updates.","reference":{"title":"talent.pdf, PDF p. 311","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q260"}]},{"id":"T300-261","module":"T","domain":3,"topic":"Talent pools","stem":"A talent partner wants selected members of a dynamic pool added to an existing static development pool. What is a supported route?","options":["Open the dynamic pool's Members tab and use the tag icon to select the static pool","Change the dynamic pool's saved search to the static pool name","Change every selected worker's supervisory organization","Copy the dynamic pool's name into the static pool description"],"answer":0,"why":"The Members tab provides tagging into one or more static talent pools without changing the source pool's dynamic logic.","reference":{"title":"talent.pdf, PDF p. 311","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q261"}]},{"id":"T300-262","module":"T","domain":3,"topic":"Talent pools","stem":"A pool contains workers from three organizations with different applicable approval chains. A pool-wide action starts. What workflow design should the administrator expect?","options":["The pool creator's organization definition always overrides all worker definitions","One common manager chain is forced on every worker","The action runs for only the first organization alphabetically","Parallel individual processes can follow different chains for each member"],"answer":3,"why":"Pool actions generally initiate individual business processes in parallel, allowing worker-specific management or approval routing.","reference":{"title":"talent.pdf, PDF p. 312","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q262"}]},{"id":"T300-263","module":"T","domain":3,"topic":"Talent pools","stem":"A nonmonetary award is given to a static talent pool. How does its process differ from the usual pool-wide action pattern?","options":["The award remains in progress until every member accepts it","A single process runs for the whole pool and completes automatically unless tailored","The award can run only from a dynamic talent pool","A separate approval-only process always runs for every worker"],"answer":1,"why":"This award is the documented exception to individual parallel pool-member processes. The process can be tailored, for example with an approval.","reference":{"title":"talent.pdf, PDF p. 312","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q263"}]},{"id":"T300-264","module":"T","domain":3,"topic":"Talent pool security","stem":"A private talent pool creator expects to see selected workers outside their supervisory organization. Which scope is documented for private pools?","options":["They display all workers with the same skill regardless of organization","They display all tenant workers once Private Talent Pool: Create is granted","They display every worker accessible to any shared-pool administrator","They display workers in the creator's supervisory organization"],"answer":3,"why":"Private pools are personal to the creator and display workers in that creator's supervisory organization, with the required domain access.","reference":{"title":"talent.pdf, PDF p. 313-314","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q264"}]},{"id":"T300-265","module":"T","domain":3,"topic":"Talent pool security","stem":"A former private-pool owner has lost their pool role but needs to delete the private pool they created. Which narrowly scoped domain is designed for that case?","options":["Worker Data: Succession Plan - Any alone","Talent Pool: Manage Membership alone","Set Up: Employee Reviews","Private Talent Pool (Limited Owner Access)"],"answer":3,"why":"Limited Owner Access supports this former-creator case and limited maintenance; it is not general full access to all private pools.","reference":{"title":"talent.pdf, PDF p. 313-315","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q265"}]},{"id":"T300-266","module":"T","domain":3,"topic":"Talent pool security","stem":"An administrator needs full membership visibility on a restricted pool. Their existing role is unconstrained and cannot be added to Talent Pool: Restricted View. Which pattern does the reference illustrate?","options":["Remove all managers' access to the pool","Create an appropriate constrained role-based group and assign the pool access","Use an unconstrained group on the restricted-view domain without changing its type","Change only the administrator's report filter to All Workers"],"answer":1,"why":"The example uses a constrained role-based security group to provide the administrator the required scope on restricted-pool membership.","reference":{"title":"talent.pdf, PDF p. 315-316","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q266"}]},{"id":"T300-267","module":"T","domain":3,"topic":"Talent data removal","stem":"A worker is removed from a static talent pool by the termination workflow. The termination is later rescinded. What happens to the removed membership?","options":["It is automatically restored in every pool","It is restored when the pool creator next opens the report","It is not automatically restored","It is restored only if the pool is restricted"],"answer":2,"why":"Rescinding termination does not put the worker back into talent pools, succession pools, or succession plans removed by that workflow.","reference":{"title":"talent.pdf, PDF p. 318-319","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q267"}]},{"id":"T300-268","module":"T","domain":3,"topic":"Talent matrix","stem":"A manager opens a delivered talent matrix report and wants to drag a worker to a different box. Which alternative is supported?","options":["Grant Modify on the delivered report's row label","Change the box's help text to move the selected worker","Change the report's sort order to assign a new potential value","Use calibration or configure manual placement through Assess Potential"],"answer":3,"why":"Delivered talent matrix reports derive placement from data and do not support drag-and-drop adjustment. Calibration and manual placement are separate approaches.","reference":{"title":"talent.pdf, PDF p. 303","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q268"}]},{"id":"T300-269","module":"T","domain":3,"topic":"Talent matrix","stem":"An nBox configuration cannot be saved because one defined source rating is not mapped, even though no worker currently has it. Why?","options":["The nBox can contain only three values per axis","Every defined source value must be mapped, including unused values","Only the most frequently used value needs a mapping","The rating must be assigned to at least one worker before it can be mapped"],"answer":1,"why":"Unused defined source values still require row or column mappings before the nBox definition can be saved.","reference":{"title":"talent.pdf, PDF p. 302-303","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q269"}]},{"id":"T300-270","module":"T","domain":3,"topic":"Talent matrix","stem":"A worker has manual Talent Matrix Placement. Calibration completes, but that manual placement has not changed. Which event updates it in the documented model?","options":["Completion of any goal approval","Saving the nBox report's column labels","Completion of any feedback request","Completion of Assess Potential"],"answer":3,"why":"Manual matrix placement updates through Assess Potential; completing calibration does not automatically update it.","reference":{"title":"talent.pdf, PDF p. 301-302","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q270"}]},{"id":"T300-271","module":"T","domain":4,"topic":"Succession planning","stem":"The CFO wants to identify key positions with no documented replacement plan before adding candidates. Which report provides the starting population?","options":["Find Positions Without Succession Plan","A list of existing plans filtered to those with no candidates","Talent Pools filtered by restricted view","Find Workers filtered to High Potential"],"answer":0,"why":"The gap is a position with no plan, so the starting report must return positions. A list of promising workers does not identify uncovered roles.","reference":{"title":"talent.pdf, PDF p. 281,286","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q271"},{"collection":"talent150","label":"A30"}]},{"id":"T300-272","module":"T","domain":4,"topic":"Succession planning","stem":"A plan exists for a critical position. An administrator can find a candidate but cannot add them without choosing another value. Which setup is a prerequisite?","options":["Define and select a readiness value for the candidate","Record the candidate’s relocation preference as mandatory","Assign the candidate a calibrated overall rating","Create a private talent pool owned by the candidate"],"answer":0,"why":"Readiness is required when adding candidates to a succession plan. Potential or performance may inform the decision but cannot replace that selection.","reference":{"title":"talent.pdf, PDF p. 274","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q272"},{"collection":"talent150","label":"B08"}]},{"id":"T300-273","module":"T","domain":4,"topic":"Succession planning","stem":"A candidate has exceptional long-term potential but needs two years of experience before filling a specific director position. How should the plan reflect this?","options":["Keep the potential assessment and set readiness for the director position separately","Use only the current performance rating and omit readiness","Lower potential solely because immediate readiness is low","Mark the candidate ready now because potential is high"],"answer":0,"why":"Potential concerns future growth. Readiness concerns how soon the candidate can perform a particular role.","reference":{"title":"talent.pdf, PDF p. 273-274","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q273"},{"collection":"talent150","label":"C04"}]},{"id":"T300-274","module":"T","domain":4,"topic":"Succession planning","stem":"A manager believes an employee could advance two organizational levels, but is unlikely to leave. Which attributes capture these two judgments separately?","options":["Readiness and retention assessment","Achievable level and retention assessment","Achievable level and impact of loss","Potential and impact of loss"],"answer":1,"why":"Achievable level describes the expected scope of advancement. Retention addresses the likelihood of keeping the employee.","reference":{"title":"talent.pdf, PDF p. 277-278","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q274"},{"collection":"talent150","label":"C49"}]},{"id":"T300-275","module":"T","domain":4,"topic":"Succession planning","stem":"Two employees have similar likelihoods of leaving, but one person’s departure would cause a much larger interruption. Which attribute captures that distinction?","options":["Retention risk","Readiness","Potential","Impact of loss"],"answer":3,"why":"Likelihood and consequence answer different questions. Impact of loss captures the effect of departure even when likelihood is unchanged.","reference":{"title":"talent.pdf, PDF p. 277","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q275"},{"collection":"talent150","label":"B15"}]},{"id":"T300-276","module":"T","domain":4,"topic":"Succession planning","stem":"In a position-management organization, the incumbent leaves but the position remains open. What happens to the succession plan attached to that position?","options":["It can persist with the position until the position closes","It necessarily converts into a job-profile succession pool","It always moves with the departing employee","It is lost whenever the position is unoccupied"],"answer":0,"why":"Position management preserves the position independently of its occupant. A vacancy alone does not end that position’s plan.","reference":{"title":"talent.pdf, PDF p. 273","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q276"},{"collection":"talent150","label":"A36"}]},{"id":"T300-277","module":"T","domain":4,"topic":"Succession planning","stem":"In a job-management organization a worker leaves, and the position’s old succession plan no longer persists with it. What tool can help restore a separated plan to a position?","options":["Find Positions Without Succession Plan without moving the separated plan","Move Succession Plan","Create Private Talent Pool","Start Potential Assessment"],"answer":1,"why":"Move Succession Plan can restore a separated plan. Job-management turnover does not preserve the position-plan association in the same way as position management.","reference":{"title":"talent.pdf, PDF p. 273,282","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q277"},{"collection":"talent150","label":"B02"}]},{"id":"T300-278","module":"T","domain":4,"topic":"Succession planning","stem":"A hospital wants a bench of candidates for a recurring nurse-manager job profile across locations. A separate executive succession effort targets one specific chief nursing officer position. Which pairing fits?","options":["Separate position-based succession plans for each job-profile label only","A single succession pool tied to the executive position for both efforts","Succession plan for the job profile and succession pool for the executive position","Succession pool for nurse managers and succession plan for the executive position"],"answer":3,"why":"Succession pools are job-profile based. A succession plan tracks candidates and readiness for an identified position.","reference":{"title":"talent.pdf, PDF p. 272-273","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q278"},{"collection":"talent150","label":"A11"}]},{"id":"T300-279","module":"T","domain":4,"topic":"Succession planning","stem":"HR wants potential successors automatically discovered by certification, then reviewed before they are added to a position’s plan. Which approach supports that workflow?","options":["Expect the succession plan to populate itself automatically from the position’s skills","Rely on an open talent pool’s name to nominate all eligible people","Use a dynamic talent pool to source candidates, then add candidates to the plan","Create a succession pool and assume its roster synchronizes automatically to the plan"],"answer":2,"why":"A dynamic talent pool can generate a candidate population. Succession plans and succession pools do not themselves auto-populate from skill matches.","reference":{"title":"talent.pdf, PDF p. 272,274","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q279"},{"collection":"talent150","label":"B16"}]},{"id":"T300-280","module":"T","domain":4,"topic":"Succession planning","stem":"Managers have nominated workers for job profiles during potential assessment. Which method helps a talent administrator review these people before placing them in succession plans?","options":["Use the Nominations facet on Find Workers","Select only employees currently marked as a top successor in a position’s plan","Use the Readiness field in an existing plan to find people who have never been added","Filter a succession pool by membership date and assume every member was nominated"],"answer":0,"why":"With tracking enabled, Find Workers can surface nominees explicitly. A nomination is a sourcing signal rather than automatic placement on a plan.","reference":{"title":"talent.pdf, PDF p. 274","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q280"},{"collection":"talent150","label":"A45"}]},{"id":"T300-281","module":"T","domain":4,"topic":"Succession planning","stem":"A critical position already has a plan. An external prospect should be considered discreetly alongside internal candidates. What option should HR evaluate?","options":["Convert the external individual into an employee solely to add them","Add the prospect as an external reviewer and convert their rating to plan readiness","Add an external or confidential candidate using the succession candidate functionality","Record the prospect as a competency on the position’s job profile"],"answer":2,"why":"Succession supports external and confidential candidates. A worker performance record is not a prerequisite for that sourcing route.","reference":{"title":"talent.pdf, PDF p. 283","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q281"},{"collection":"talent150","label":"A47"}]},{"id":"T300-282","module":"T","domain":4,"topic":"Succession planning","stem":"A group of department heads maintains a job-profile succession pool. They want it to update automatically whenever worker skills change, as a dynamic talent pool would. What should be clarified?","options":["Selecting a readiness value turns a static succession pool into a dynamic one","All succession pools refresh from the job profile as soon as skills change","Succession pool membership is populated manually, while a dynamic talent pool can supply a changing search population","Only restricted succession pools can update without manual selection"],"answer":2,"why":"The two pool types serve different purposes and have different membership mechanisms. Use the dynamic search as a sourcing aid.","reference"
