-comment help text to standardize responses"],"answer":1,"why":"A locked template preserves the prescribed questions. Reviewer types classify competency evaluators; acknowledgement records that a review has been seen.","reference":{"title":"Feedback Management","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/feedback-management.html"},"sample":0,"memberships":[{"collection":"bp200","label":"197"}]},{"id":"BP-198","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"The team wants to compare potential across direct reports in one transaction. A test run is denied, and HR later finds no updated potential values on the workers. Which interpretation fits?","options":["Assess My Team's Potential updates workers when submitted successfully; denial leaves their records unchanged","Submission of the denied assessment commits the potential values but suppresses notices","A denied team assessment updates the worker records only after the next profile review","Each worker is updated when first displayed, even if the event is denied"],"answer":0,"why":"The team assessment can update multiple worker records. A denied event does not commit those proposed potential assessments.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"198"}]},{"id":"BP-199","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"A child organization inherited its parent's review flow until it created its own definition. HR now needs a variation for one exception group inside that same child. Which design is most targeted?","options":["Create a second ordinary organization-specific version of the same BP for the same child","Change the parent definition and assume it overrides the child's local definition","Make the child's definition effective earlier so both ordinary definitions become available","Use a condition to vary the relevant step within the child's definition"],"answer":3,"why":"A child can override inherited workflow, but it cannot hold two ordinary organization-specific versions of the same BP. Conditional behavior handles a localized exception.","reference":{"title":"Concept: Business Processes and Organizations","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/dan1370797198109.html"},"sample":0,"memberships":[{"collection":"bp200","label":"199"}]},{"id":"BP-200","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"Two review cleanups are requested. Cohort A has unfinished events that must end; cohort B has pending steps that should go to a replacement approver and still be completed. Which pair of operations matches?","options":["Reassign Business Process Step for A and Cancel To Do for B","Cancel Business Process for A and Reassign Business Process Step for B","Advance Business Process for A and Rescind Business Process for B","Rescind Business Process for A and Advance Business Process for B"],"answer":1,"why":"Ending an unfinished event is a transaction-level cancellation. Reassignment changes the step owner and preserves the requirement for someone to act.","reference":{"title":"Setup Considerations: Mass Operations on Business Processes","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/fet1554324204143.html"},"sample":0,"memberships":[{"collection":"bp200","label":"200"}]}],"collections":{"new300":"Talent - new reference bank (300)","learning150":"Learning - original bank (150)","talent150":"Talent - original bank (150)","bp200":"Talent - business process scenarios (200)"},"domains":{"L":["Learning components and course offerings","Learner enrollments","Learner completions and reports","Trainer security and learning media"],"T":["Goals and workers' competencies","Performance review processes and templates","Talent attributes, processes and pools","Talent pipelines"]},"weights":{"L":[40,35,15,10],"T":[30,35,25,10]}}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('bankdata').textContent),QUESTIONS=DATA.questions,QMAP=new Map(QUESTIONS.map(q=>[q.id,q]));
const KEY='workday-learning-talent-study-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={home:'M3 10 12 3l9 7v11H3Z M9 21v-8h6v8',learn:'M3 4h7l2 2 2-2h7v15h-7l-2 2-2-2H3Z M12 6v15',exam:'M5 4h14v17H5Z M9 4V2h6v2 M8 10h8 M8 14h8',bank:'M3 3h7v7H3Z M14 3h7v7h-7Z M3 14h7v7H3Z M14 14h7v7h-7Z',refs:'M4 3h6v18H4Z M14 3l5-1 3 18-5 1Z',progress:'M3 21h18 M6 17v-5 M12 17V7 M18 17V3'};
const ico=id=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="${icons[id]||icons.bank}"/></svg>`;
const navs=[['home','Overview'],['learn','Learning mode'],['exam','Exam mode'],['bank','Question bank'],['refs','Reference notes'],['progress','Your progress']];
let storageOK=true, toastTimer;
function emptyState(){return {version:1,module:'T',stats:{},bookmarks:[],history:[],session:null};}
function safeSession(x){
 if(!x||!Array.isArray(x.ids))return null;const ids=x.ids.filter(id=>QMAP.has(id));if(!ids.length||ids.length!==x.ids.length||new Set(ids).size!==ids.length)return null;

function bindBank(){for(const k of ['collection','domain','topic','status']){const el=document.getElementById('f'+k);el.value=filters[k];el.addEventListener('change',()=>{filters[k]=el.value;bankPage=0;renderBank();});}document.getElementById('fshow').onchange=e=>{filters.show=e.target.checked;renderBank();};document.getElementById('search').oninput=e=>{filters.query=e.target.value;bankPage=0;renderBank();};renderBank();}
function renderBank(){const all=matches(),pages=Math.max(1,Math.ceil(all.length/20));bankPage=Math.min(bankPage,pages-1);document.getElementById('banklist').innerHTML=`<div class="row between"><p class="small muted">${all.length} unique questions · page ${bankPage+1} of ${pages}</p>${button('Clear filters','clearfilter','small')}</div>${all.length?all.slice(bankPage*20,bankPage*20+20).map(q=>`<article class="bank-card"><div class="row between"><span class="badge">${esc(q.id)} · ${esc(q.topic)}</span>${markButton(q.id)}</div><h3>${esc(q.stem)}</h3>${filters.show?q.options.map((opt,i)=>`<div class="answer-line ${i===q.answer?'correct':''}">${'ABCD'[i]}. ${esc(opt)}${i===q.answer?' <span class="badge green">Correct</span>':''}</div>`).join('')+`<div class="explain"><b>Why:</b> ${esc(q.why)}</div>${refHTML(q)}`:'<p class="small muted">Answers hidden. Practice this question to test yourself.</p>'}<div class="row between" style="margin-top:16px"><div>${origin(q)}</div>${button('Practice','single','small',`data-id="${q.id}"`)}</div></article>`).join(''):'<div class="panel empty">No questions match these filters. Try a different topic or clear the filters.</div>'}<div class="row between">${button('← Previous','bankprev','',bankPage===0?'disabled':'')}<span class="small muted">${bankPage+1} / ${pages}</span>${button('Next →','banknext','',bankPage===pages-1?'disabled':'')}</div>`;}
function references(){const topics=[...new Set(pool().map(q=>q.topic))].sort();if(referenceTopic&&!topics.includes(referenceTopic))referenceTopic='';if(referenceTopic){const qs=pool().filter(q=>q.topic===referenceTopic);return head(esc(referenceTopic),'Review the reasoning, then apply it in practice.',button('All topics','reftopics',''))+`<div class="panel"><div class="row between"><p class="small muted">${qs.length} source-linked study notes</p>${button('Practice this topic','practicetopic','primary')}</div>${qs.map(q=>`<details><summary>${esc(q.stem)}</summary><p><b>Key decision:</b> ${esc(q.options[q.answer])}</p><p>${esc(q.why)}</p>${refHTML(q)}<div class="row" style="margin-top:10px">${origin(q)}</div></details>`).join('')}</div>`;}return head('Reference notes','Topic-based explanations from your question banks, with source references.')+`<div class="panel"><p class="small muted">These notes summarize the decisions tested in the questions. They are not a replacement for the full course manuals. Page references identify your attached talent.pdf; the original manual is not bundled with the app.</p></div><div class="topiclist">${topics.map(t=>`<button class="topicbutton" data-action="reftopic" data-topic="${esc(t)}"><b>${esc(t)}</b><p class="small muted">${pool().filter(q=>q.topic===t).length} notes · open topic →</p></button>`).join('')}</div>`;}
function progress(){const qs=pool(),s=statsFor(qs);return head('Your progress','Saved in this browser. Export a backup to move between devices or addresses.')+`<div class="grid stats"><div class="stat"><small>Questions practiced</small><b>${s.tried}</b><small>of ${qs.length}</small></div><div class="stat"><small>Checked answers</small><b>${s.attempts}</b><small>including repeat practice</small></div><div class="stat"><small>Answer accuracy</small><b>${s.attempts?s.accuracy+'%':'—'}</b><small>across checked answers</small></div><div class="stat"><small>Needs another look</small><b>${qs.filter(q=>state.stats[q.id]?.lastCorrect===false).length}</b><small>last answer incorrect</small></div></div><div class="row" style="margin:20px 0">${button('Practice missed','missed','primary')}${button('Practice bookmarks','saved','')}${button('Export progress','export','')}${button('Import progress','import','')}${button('Reset progress','reset','danger')}</div><section class="panel"><h2>Coverage by domain</h2><div class="tablewrap"><table><thead><tr><th>Domain</th><th>Practiced</th><th>Accuracy</th></tr></thead><tbody>${DATA.domains[state.module].map((title,i)=>{const g=qs.filter(q=>q.domain===i+1),st=statsFor(g);return `<tr><td>${esc(title)}</td><td>${st.tried}/${g.length}</td><td>${st.attempts?st.accuracy+'%':'—'}</td></tr>`;}).join('')}</tbody></table></div></section><section class="panel"><h2>Session history</h2>${state.history.filter(s=>s.module===state.module).length?state.history.map((s,i)=>({s,i})).filter(x=>x.s.module===state.module).reverse().map(({s,i})=>{const c=s.ids.filter(id=>s.answers[id]===QMAP.get(id).answer).length;return `<div class="domain-row row between"><div><b class="small">${s.mode==='exam'?'Exam':'Learning'} · ${new Date(s.finished).toLocaleString()}</b><p class="small muted">${c}/${s.ids.length} correct · ${Math.round(c/s.ids.length*100)}%</p></div>${button('View results','history','small',`data-index="${i}"`)}</div>`;}).join(''):'<p class="muted small">Completed sessions will appear here.</p>'}</section><p class="footer-note">The app stores up to 60 completed sessions. Bookmarks and question-level progress remain available independently of the session history.</p>`;}
function tick(){const s=state.session;if(!s||s.mode!=='exam'||!s.deadline)return;const left=Math.max(0,Math.ceil((s.deadline-Date.now())/1000)),el=document.getElementById('timer');if(el){el.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`;el.classList.toggle('urgent',left<300);}if(left===0)finish(true);}
function download(name,content,type='application/json'){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const ORIGINAL_HTML='<!doctype html>\n'+document.documentElement.outerHTML;
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav){navigate(b.dataset.nav);return;}const a=b.dataset.action;if(!a)return;const s=active(),q=s?QMAP.get(s.ids[s.index]):null;
 if(a==='nav'){navigate(b.dataset.page);return;}if(a==='module'){state.module=b.dataset.module;filters={query:'',domain:'',topic:'',collection:'',status:'',show:true};referenceTopic='';save();navigate('home');return;}
 if(a==='resume'){if(state.session){review=null;state.module=state.session.module;page='session';render();}return;}
 if(a==='exit'){save();navigate('home');return;}
 if(a==='domain'){preset={domain:b.dataset.domain};navigate('learn');return;}
 if(a==='collection'){filters={query:'',domain:'',topic:'',collection:b.dataset.collection,status:'',show:true};bankPage=0;navigate('bank');return;}
 if(a==='bookmark'){bookmark(b.dataset.id);if(page==='bank')renderBank();else render();return;}
 if(a==='pick'&&s&&!review&&!s.checked[q.id]){s.answers[q.id]=Number(b.dataset.value);save();render();return;}
 if(a==='check'&&s&&!s.checked[q.id]&&Object.hasOwn(s.answers,q.id)){record(q.id,s.answers[q.id]);s.checked[q.id]=true;save();render();return;}
 if(a==='flag'&&s&&!review){const i=s.flags.indexOf(q.id);if(i<0)s.flags.push(q.id);else s.flags.splice(i,1);save();render();return;}
 if(['next','previous','jump'].includes(a)&&s){s.index=a==='jump'?Number(b.dataset.index):s.index+(a==='next'?1:-1);s.index=Math.max(0,Math.min(s.ids.length-1,s.index));if(!review)save();render();window.scrollTo(0,0);return;}
 if(a==='submit'){finish();return;}if(a==='backresults'){page='result';render();return;}if(a==='reviewall'||a==='reviewjump'){review=review||state.history.at(-1);review.index=a==='reviewjump'?Number(b.dataset.index):0;page='session';render();window.scrollTo(0,0);return;}
 if(a==='practicemissed'){const ids=review.ids.filter(id=>review.answers[id]!==QMAP.get(id).answer);if(ids.length)start(ids);return;}
 if(a==='history'){review=state.history[Number(b.dataset.index)];page='result';render();return;}
 if(a==='single'){start([b.dataset.id]);return;}if(a==='practicefilter'){const ids=matches().map(q=>q.id);if(ids.length)start(shuffle(ids));else toast('No questions match the current filters.');return;}
 if(a==='banknext'||a==='bankprev'){bankPage+=a==='banknext'?1:-1;renderBank();window.scrollTo(0,0);return;}
 if(a==='clearfilter'){filters={query:'',domain:'',topic:'',collection:'',status:'',show:true};bankPage=0;render();return;}
 if(a==='reftopic'){referenceTopic=b.dataset.topic;render();window.scrollTo(0,0);return;}if(a==='reftopics'){referenceTopic='';render();return;}if(a==='practicetopic'){start(shuffle(pool().filter(q=>q.topic===referenceTopic).map(q=>q.id)));return;}
 if(a==='missed'||a==='saved'){const ids=pool().filter(q=>a==='missed'?state.stats[q.id]?.lastCorrect===false:state.bookmarks.includes(q.id)).map(q=>q.id);if(ids.length)start(shuffle(ids));else toast(a==='saved'?'Bookmark a question first.':'No missed questions yet.');return;}
 if(a==='export'){download('study-lab-progress.json',JSON.stringify(state,null,2));return;}if(a==='import'){document.getElementById('importfile').click();return;}
 if(a==='reset'){if(confirm('Reset all Learning and Talent progress, bookmarks, sessions and history in this browser? Export a backup first if you want to keep it.')){state=emptyState();save();navigate('home');toast('Progress reset.');}return;}
 if(a==='downloadhtml'){download('index.html',ORIGINAL_HTML,'text/html');return;}
});
document.getElementById('module').addEventListener('change',e=>{state.module=e.target.value;filters={query:'',domain:'',topic:'',collection:'',status:'',show:true};referenceTopic='';save();navigate('home');});
document.getElementById('importfile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>12000000)throw Error('The backup is too large.');const imported=sanitize(JSON.parse(await f.text()));if(confirm('Replace the progress in this browser with this backup?')){state=imported;save();navigate('home');toast('Progress imported.');}}catch(err){toast('Import failed: '+err.message);}e.target.value='';});
window.addEventListener('beforeunload',save);setInterval(tick,1000);render();
</script></body></html>
