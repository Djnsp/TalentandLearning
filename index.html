<script id="bankdata" type="application/json">{"version":"2026.11.17","questions":[{"id":"T300-001","module":"T","domain":1,"topic":"Goal configuration","stem":"A worker may edit a goal but cannot enter milestones, while a colleague can. The workflow routes correctly for both. What should the administrator inspect first?","options":["The order of goal-template sections and their sorting rules","The review period dates on the annual performance template","Individual goal field settings and their security-group restrictions","The goal’s completion-status mapping and its review eligibility"],"answer":2,"why":"Goal setup can hide or restrict fields by security group. A properly routed task does not establish that every field is editable.","reference":{"title":"talent.pdf, PDF p. 6,20-22","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q001"},{"collection":"talent150","label":"C10"}]},{"id":"T300-002","module":"T","domain":1,"topic":"Goal configuration","stem":"An organization wants a quarterly objective, and each analyst should be able to connect a personal goal to it. What combination models the relationship?","options":["Create individual copies through Cascade Goals without enabling alignment","Create the organization goal and enable Organization Alignment on individual goals","Create the organization goal and enable only individual goal Weight","Create the organization goal and enable only individual goal Category"],"answer":1,"why":"Alignment links an individual contribution to a real organization goal. Matching labels or dates does not establish that relationship.","reference":{"title":"talent.pdf, PDF p. 6,14","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q002"},{"collection":"talent150","label":"A48"}]},{"id":"T300-003","module":"T","domain":1,"topic":"Goal configuration","stem":"A regional organization wants its goal to support a goal three levels above it. Today the selector offers only its immediate parent’s goals. What must be enabled?","options":["A new goal period for each management level","Individual goal category filtering","Organization goal alignment through the hierarchy","Private-by-default organization goals"],"answer":2,"why":"Full-hierarchy alignment extends the eligible parent goals beyond one level. Privacy and time periods do not expand the hierarchy.","reference":{"title":"talent.pdf, PDF p. 8","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q003"},{"collection":"talent150","label":"B50"}]},{"id":"T300-004","module":"T","domain":1,"topic":"Goal configuration","stem":"An administrator is trying to enable automatic percent complete for organization goals. Which underlying fields are prerequisites?","options":["Milestones, Actual, and Target","Percent Complete, Status, and Support","Weight, Category, and Due Date","Organization Alignment, Private, and Goal Period"],"answer":1,"why":"Those three individual-goal fields must be exposed. Automatic calculation also requires Organization Alignment and Enable Percent Complete in organization goal setup.","reference":{"title":"talent.pdf, PDF p. 8-9","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q004"},{"collection":"talent150","label":"B35"}]},{"id":"T300-005","module":"T","domain":1,"topic":"Goal configuration","stem":"A delivery goal has four interim checkpoints. HR wants each checkpoint to keep its own date and status without creating four independent worker goals. Which field should be enabled?","options":["Goal categories","Development items","Milestones","Goal periods"],"answer":2,"why":"Milestones record intermediate progress within one goal. Periods and payout bands organize or evaluate goals at other levels.","reference":{"title":"talent.pdf, PDF p. 21","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q005"},{"collection":"talent150","label":"A33"}]},{"id":"T300-006","module":"T","domain":1,"topic":"Goal configuration","stem":"Individual goals are grouped into Safety and Quality on My Goals, but everyone currently sees one default section. Which setup changes how existing goals are displayed?","options":["Configure goal sections only on the annual employee review template","Create separate completion statuses named Safety and Quality","Create goal template rules and associate them with sections in the goal template","Create two organization goals and cascade both to every worker"],"answer":2,"why":"Template rules place matching goals into display sections. A review launch or a second goal changes the underlying work instead.","reference":{"title":"talent.pdf, PDF p. 10","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q006"},{"collection":"talent150","label":"A29"}]},{"id":"T300-007","module":"T","domain":1,"topic":"Goal configuration","stem":"A company introduces a status named Deferred. It must behave consistently when previous-review goals are loaded. What matters besides the display name?","options":["Its position in the list of goal categories","The payout band assigned to the goal period","The number of workers who use the label","Its mapping to a Workday goal completion status"],"answer":3,"why":"Loading logic uses the delivered status mapping. A custom label alone does not tell Workday how to treat the goal.","reference":{"title":"talent.pdf, PDF p. 9","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q007"},{"collection":"talent150","label":"C07"}]},{"id":"T300-008","module":"T","domain":1,"topic":"Goal configuration","stem":"A worker’s goals matter differently to their overall review. Managers should capture each goal’s relative contribution before the review launches. What should be enabled on goals?","options":["Section weights on the review template only","Numeric goal weights","Organization goal alignment percentages","Goal completion percentages"],"answer":1,"why":"Individual goal weights can feed the review. A due date or period sets timing rather than relative contribution.","reference":{"title":"talent.pdf, PDF p. 21","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q008"},{"collection":"talent150","label":"C44"}]},{"id":"T300-009","module":"T","domain":1,"topic":"Goal configuration","stem":"HR wants one organization goal for a cost center rather than a supervisory organization. Which redesign fits the documented organization-goal model?","options":["Create it for any organization type after assigning a goal period","Create it for the cost center and use Organization Alignment to change its owner","Create the goal for the appropriate supervisory organization","Create it for a talent pool and convert the pool into its owning organization"],"answer":2,"why":"Organization goals are associated with supervisory organizations. Alignment does not change the supported owner type.","reference":{"title":"talent.pdf, PDF p. 2","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q009"}]},{"id":"T300-010","module":"T","domain":1,"topic":"Goal configuration","stem":"A worker has a primary job in Sales and an additional job in Operations. They cannot see Operations organization goals through the standard worker view. What explains this?","options":["Organization-goal access follows the worker's primary position","Organization goals follow the worker's highest management level across positions","Organization goals use the position with the latest start date","Organization goals combine all positions unless the worker has a review in progress"],"answer":0,"why":"The documented visibility is tied to the primary position, not a union of concurrent assignments.","reference":{"title":"talent.pdf, PDF p. 2","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q010"}]},{"id":"T300-011","module":"T","domain":1,"topic":"Goal configuration","stem":"An administrator enables manual percent complete on organization goals and exposes Status, Support, and Percent Complete for individuals. Automatic calculation is still unavailable. Which prerequisite is missing?","options":["Configure a goal payout band for the organization goal","Require milestones on every supporting goal","Enable Organization Alignment in organization goal setup","Require a numeric weight on each individual goal"],"answer":2,"why":"Automatic organization progress also requires Organization Alignment and Enable Percent Complete. Exposing the individual fields alone is insufficient.","reference":{"title":"talent.pdf, PDF p. 8-9","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q011"}]},{"id":"T300-012","module":"T","domain":1,"topic":"Goal configuration","stem":"Three approved supporting goals contribute 100%, 50%, and no status. A fourth goal at 100% is awaiting approval. Automatic organization progress is enabled. Which treatment is correct?","options":["Include all four and treat the goal without status as 100%","Exclude both the pending goal and the goal without status","Exclude the pending goal and treat the goal without status as 0%","Include the pending goal and treat the goal without status as 0%"],"answer":2,"why":"Pending approval goals are excluded. A contributing goal without a status is treated as zero, rather than omitted.","reference":{"title":"talent.pdf, PDF p. 8-9","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q012"}]},{"id":"T300-013","module":"T","domain":1,"topic":"Goal configuration","stem":"Two approved individual goals support an organization goal at 20% and 80%. Their weights are 90 and 10. HR expects the organization percentage to favor the first goal. What should be clarified?","options":["Weights apply only when both goals use the same due date","Weights apply only after a manager opens a performance review","Weights apply when the organization goal has no parent alignment","Individual goal weights do not weight organization-goal completion"],"answer":3,"why":"The organization completion calculation does not use the relative individual goal weights used in reviews.","reference":{"title":"talent.pdf, PDF p. 2-3","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q013"}]},{"id":"T300-014","module":"T","domain":1,"topic":"Goal configuration","stem":"Goal due dates are required in the user interface, but an integration still loads goals without them. Which additional control directly enforces the requirement through the web service?","options":["Enforce Required in Web Service","Enable Percent Complete on organization goals","Lock Goals Associated with In Progress Reviews","Allow Ordering of Goals in Reviews"],"answer":0,"why":"Requiring the field in the interface and enforcing required fields through web services are separate setup choices.","reference":{"title":"talent.pdf, PDF p. 6","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q014"}]},{"id":"T300-015","module":"T","domain":1,"topic":"Goal configuration","stem":"A worker belongs to two groups. One group hides a goal field; the other leaves it visible and optional. What is the effective visibility?","options":["The field becomes required","The worker receives a separate version for each group","The field remains visible","The hidden setting wins whenever any group hides it"],"answer":2,"why":"A field is hidden only when all applicable group settings hide it.","reference":{"title":"talent.pdf, PDF p. 20","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q015"}]},{"id":"T300-016","module":"T","domain":1,"topic":"Goal configuration","stem":"A worker belongs to a group that hides a goal field and another that requires it. What should the administrator expect?","options":["The field is visible and required","The field is hidden and its requirement is ignored","The field is visible but optional","The worker must choose which group governs the transaction"],"answer":0,"why":"A required setting takes precedence over hiding, and any applicable required setting makes the field required.","reference":{"title":"talent.pdf, PDF p. 20","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q016"}]},{"id":"T300-017","module":"T","domain":1,"topic":"Goal configuration","stem":"HR enables both locking goals associated with in-progress reviews and allowing deletion of goals associated with reviews. A worker tries to delete a goal in an active review. What is the expected result?","options":["The active-review lock prevents deletion; the deletion option applies to completed-review goals","The deletion option overrides the active-review lock","Deletion is allowed if the goal has no rating yet","Deletion is allowed after self-evaluation even while the review remains open"],"answer":0,"why":"With both settings selected, the lock protects in-progress review goals. The deletion setting does not override it.","reference":{"title":"talent.pdf, PDF p. 7","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q017"}]},{"id":"T300-018","module":"T","domain":1,"topic":"Goal configuration","stem":"Users can reorder goals during self-evaluation after a new setup option is enabled. The My Goals report still uses its existing order. What is the correct explanation?","options":["The new order is applied to My Goals only after employee acknowledgment","The ordering option requires the My Goals report to use the review's rating scale","Review goal ordering does not control My Goals report ordering","The new order is applied to My Goals only after calibration"],"answer":2,"why":"Allow Ordering of Goals in Reviews affects supported review tasks, not the ordering on My Goals.","reference":{"title":"talent.pdf, PDF p. 7","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q018"}]},{"id":"T300-019","module":"T","domain":1,"topic":"Goal configuration","stem":"HR maps twelve active goal statuses and wants all statuses available in Track My Goals worklets. Which design limit must it address?","options":["Limit every status label to eleven characters","Create a second goal template for the twelfth status","Define eleven completion percentages for each status","Limit active statuses to eleven for those worklets"],"answer":3,"why":"The reference specifies a maximum of eleven active statuses for the Track My Goals worklets.","reference":{"title":"talent.pdf, PDF p. 9","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q019"}]},{"id":"T300-020","module":"T","domain":1,"topic":"Goal configuration","stem":"A new goal status should contribute 60% to automatic organization-goal completion. Which configuration determines that contribution?","options":["Set the goal period's progress to 60","Set the goal category's weight to 60","Set the supporting goal's review section weight to 60","Map the status to the appropriate percent complete"],"answer":3,"why":"The status-to-percent mapping supplies the progress value used in automatic organization completion.","reference":{"title":"talent.pdf, PDF p. 9","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q020"}]},{"id":"T300-021","module":"T","domain":1,"topic":"Goal configuration","stem":"An individual goal matches both the Safety and Compliance rules in the ad hoc goal template. What should a tester expect on the goal display?","options":["Only the first matching section can show it","Only the last matching section can show it","It is excluded from both and placed in the default section","It can appear in both matching sections"],"answer":3,"why":"Ad hoc goal-template display permits a goal in multiple matching sections. Review goal loading uses different section-assignment rules.","reference":{"title":"talent.pdf, PDF p. 10","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q021"}]},{"id":"T300-022","module":"T","domain":1,"topic":"Goal configuration","stem":"All goals match named sections in the ad hoc goal template. What happens to the empty default section compared with other empty sections?","options":["The default section is hidden; other configured sections remain visible","Every empty section remains visible","Only the default section remains visible","Every empty section is hidden"],"answer":0,"why":"The default section is hidden when empty. Other configured sections display even without matching goals.","reference":{"title":"talent.pdf, PDF p. 10","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q022"}]},{"id":"T300-023","module":"T","domain":1,"topic":"Goal configuration","stem":"HR changes a rule on the tenant's individual goal template. When does it affect the existing goals' display?","options":["The revised template applies immediately to individual goals","Only newly created goals use the revision","Only goals in the next performance cycle use it","Existing goals require a new Cascade Goals event"],"answer":0,"why":"There is one ad hoc individual goal template, and its edits immediately change the display of individual goals.","reference":{"title":"talent.pdf, PDF p. 10","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q023"}]},{"id":"T300-024","module":"T","domain":1,"topic":"Goal configuration","stem":"A worker changes a goal inside an in-progress review. A goal report still shows the earlier approved content. Which explanation is most likely?","options":["Goal reports always use the original goal and never completed review updates","The report requires every goal to be associated with a talent pool","Goal report fields exclude changes still inside in-progress reviews","Only the worker's manager can see the revised content in any report"],"answer":2,"why":"The documented goal reporting behavior uses completed review changes, rather than draft changes in an active review.","reference":{"title":"talent.pdf, PDF p. 10","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q024"}]},{"id":"T300-025","module":"T","domain":1,"topic":"Goal configuration","stem":"The tenant hides Track By on goals but leaves Actual, Maximum, Minimum, and Target exposed. Which correction follows the documented dependency?","options":["Hide the related measurement fields as well","Make the measurement fields required instead","Move the measurement fields into the goal description","Enable organization alignment to replace Track By"],"answer":0,"why":"Hiding Track By requires hiding its related measurement fields: Actual, Maximum, Minimum, and Target.","reference":{"title":"talent.pdf, PDF p. 21-22","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q025"}]},{"id":"T300-026","module":"T","domain":1,"topic":"Goal configuration","stem":"A goal weight of 12.5 is rejected while 12 is accepted. Which constraint explains the behavior?","options":["Goal weights must equal the goal's percent complete","Every goal weight must be a percentage between 1 and 10","Weights are permitted only on completed goals","Goal weights must be whole numbers greater than or equal to zero"],"answer":3,"why":"The goal weight field accepts nonnegative whole numbers, so a decimal weight is invalid.","reference":{"title":"talent.pdf, PDF p. 21","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q026"}]},{"id":"T300-027","module":"T","domain":1,"topic":"Goal configuration","stem":"HR wants new organization goals to begin as private, while retaining the ability to select another visibility when creating a goal. Which setup addresses the default?","options":["Default organization goals to private","Lock individual goals associated with reviews","Hide Organization Alignment on all worker goals","Require a private goal category on all reviews"],"answer":0,"why":"The organization-goal privacy default controls the initial selection. It is separate from individual goal locks and field visibility.","reference":{"title":"talent.pdf, PDF p. 8","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q027"}]},{"id":"T300-028","module":"T","domain":1,"topic":"Goal configuration","stem":"An individual goal supports a regional organization goal. HR also wants the same alignment field to connect it directly to a second organization goal. What limitation applies?","options":["An individual goal can align to one organization goal per milestone","An individual goal can align to all ancestor goals independently","An individual goal can align to only one organization goal","An individual goal can align to two organization goals if their weights total 100"],"answer":2,"why":"The direct relationship is to one organization goal. Broader organizational alignment is modeled through the organization-goal hierarchy.","reference":{"title":"talent.pdf, PDF p. 2-3","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q028"}]},{"id":"T300-029","module":"T","domain":1,"topic":"Goal cascading","stem":"Only cascaded, editable goals should require a worker review step. Individually created goals should bypass it. How can one Manage Goals definition implement the difference?","options":["Put an unconditional worker review step on Cascade Goals only","Create another goal category and make all goals in it read-only","Require one HR approval for the entire supervisory organization","Put a condition using cascaded-goal and editability fields on the review step"],"answer":3,"why":"An entry condition on the per-worker process can distinguish how the goal originated and whether it is editable.","reference":{"title":"talent.pdf, PDF p. 16-17,23","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q029"},{"collection":"talent150","label":"B28"}]},{"id":"T300-030","module":"T","domain":1,"topic":"Goal cascading","stem":"A manager assigns a goal to eight employees in one submission. How many employee-level Manage Goals subprocesses should the administrator expect?","options":["Eight, initiated by one Cascade Goals event","One, shared among all eight employees","Two, one for the manager and one for the population","None until the employees start a performance review"],"answer":0,"why":"Cascade Goals starts a Manage Goals subprocess for each assigned employee. That is where worker-specific workflow runs.","reference":{"title":"talent.pdf, PDF p. 16-17","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q030"},{"collection":"talent150","label":"C20"}]},{"id":"T300-031","module":"T","domain":1,"topic":"Goal cascading","stem":"A cascade reaches two supervisory organizations. One employee receives an approval and another does not. Both have the same goal text. Which setup can explain the difference?","options":["Different review period start dates on their next annual reviews","Different names on the parent Cascade Goals event","Different applicable Manage Goals definitions for the employees’ organizations","Different organization goal descriptions shown in the catalog"],"answer":2,"why":"The employee-level definition can vary with supervisory organization. Identical content need not produce identical routing.","reference":{"title":"talent.pdf, PDF p. 23","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q031"},{"collection":"talent150","label":"A20"}]},{"id":"T300-032","module":"T","domain":1,"topic":"Goal cascading","stem":"HR wants each member of a cross-functional development pool to receive the same goal, even though the members report to different managers. Which target is best?","options":["Only a succession pool sharing the project name","Only the organization associated with the copied goal","The talent pool in Add Goal to Employees","Only the pool owner's supervisory organization"],"answer":2,"why":"The cascade can target the pool membership directly. The owner’s organization may include nonmembers or omit actual members.","reference":{"title":"talent.pdf, PDF p. 16","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q032"},{"collection":"talent150","label":"B43"}]},{"id":"T300-033","module":"T","domain":1,"topic":"Goal cascading","stem":"Employees must receive the same target wording and must not personalize the goal after distribution. Which design preserves that requirement?","options":["Cascade copies of the goal and restrict editing","Add the goal to a pool description and hide the pool members","Cascade editable copies and lock the annual review template","Publish one organization goal and assume personal copies are created"],"answer":0,"why":"Cascading creates individual copies. Edit restrictions on the distributed goal protect its wording outside the review.","reference":{"title":"talent.pdf, PDF p. 16-17","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q033"},{"collection":"talent150","label":"B25"}]},{"id":"T300-034","module":"T","domain":1,"topic":"Goal cascading","stem":"A manager wants to reuse an existing goal and assign it only to four named employees across two teams. What is the most precise route?","options":["Publish a private organization goal for the larger team","Copy the existing goal in Add Goal to Employees and select those employees","Cascade to both organizations and archive all unintended copies later","Copy the review template and change the overall rating scale"],"answer":1,"why":"The cascade supports both reusing a goal and selecting individual recipients. Organization-wide distribution would create extra records.","reference":{"title":"talent.pdf, PDF p. 16-18","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q034"},{"collection":"talent150","label":"B31"}]},{"id":"T300-035","module":"T","domain":1,"topic":"Goal cascading","stem":"A worker aligned a personal goal to the company goal. Their teammates received no new goals. What action would distribute individual copies to them?","options":["Select a higher goal weight on the worker’s goal","Make the organization goal visible throughout the hierarchy without initiating a cascade","Cascade the goal to the selected employees or organization","Change the alignment to a different goal period"],"answer":2,"why":"Alignment expresses support for an objective. Distribution requires the separate cascade action.","reference":{"title":"talent.pdf, PDF p. 16-17","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q035"},{"collection":"talent150","label":"A05"}]},{"id":"T300-036","module":"T","domain":1,"topic":"Goal cascading","stem":"A talent partner can edit individual employee goals but cannot start distribution of one goal to an entire pool. Which security change should be evaluated first?","options":["Add an approval step to each employee’s Manage Goals subprocess","Authorize the appropriate group to initiate Cascade Goals","Make every goal field editable for the talent partner","Add the partner as a reviewer on the employee review template"],"answer":1,"why":"The parent distribution event has its own initiating permission. Editing an individual goal or approving the resulting child event does not authorize the cascade.","reference":{"title":"talent.pdf, PDF p. 16-17","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q036"},{"collection":"talent150","label":"A03"}]},{"id":"T300-037","module":"T","domain":1,"topic":"Goal cascading","stem":"A manager wants to send one existing goal unchanged to three more employees. Which task is the most direct fit?","options":["Edit Goals for Organization","Mass Archive Goals","Add Additional Employees to Goal","Maintain Goal Setup"],"answer":2,"why":"The additional-employees task distributes an existing goal unchanged. Editing it or distributing multiple goals uses Add Goal to Employees.","reference":{"title":"talent.pdf, PDF p. 18","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q037"}]},{"id":"T300-038","module":"T","domain":1,"topic":"Goal cascading","stem":"A manager wants to distribute two existing goals after changing their wording. Which route is appropriate?","options":["Add Additional Employees to Goal","Update Goal Periods","Add Goal to Employees","Edit Organization Goals without cascading"],"answer":2,"why":"Add Goal to Employees supports changing content or working with more than one goal; the additional-employees task is for one unchanged goal.","reference":{"title":"talent.pdf, PDF p. 18","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q038"}]},{"id":"T300-039","module":"T","domain":1,"topic":"Goal lifecycle","stem":"An employee saved a performance review for later with a goal included in it. They now try to archive that goal. Why is it blocked?","options":["Saving for later changes the goal to a completed review record","Goals must be unaligned from every organization goal before archiving","Only goals with milestones can be archived","The goal remains associated with an in-progress review"],"answer":3,"why":"A saved-for-later review is still in progress. Its goal association blocks archiving until the relevant event is resolved.","reference":{"title":"talent.pdf, PDF p. 19","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q039"}]},{"id":"T300-040","module":"T","domain":1,"topic":"Goal lifecycle","stem":"A mass archive selects 800 goals, including goals in unsubmitted transactions. Some selected goals remain active. What should the administrator investigate?","options":["Whether all remaining goals belong to different review categories","Whether all remaining goals have nonzero weights","Unsubmitted or in-progress events that caused those goals to be skipped","Whether the archive task always stops at 500 goals"],"answer":2,"why":"Mass archiving skips goals involved in unsubmitted or in-progress events. Complete or cancel those events before attempting to archive the goals.","reference":{"title":"talent.pdf, PDF p. 19-20","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q040"}]},{"id":"T300-041","module":"T","domain":1,"topic":"Goal lifecycle","stem":"A mass goal archive finishes without routing the normal Manage Goals approvals for each worker. Is this expected?","options":["Yes; the background archive completes Manage Goals and skips its other steps","No; every archive must wait for a completed annual review","Yes; but only if every selected worker is the initiator","No; the archive can only initiate an approval task"],"answer":0,"why":"The mass archive background process automatically completes the associated Manage Goals processing rather than following its ordinary approval steps.","reference":{"title":"talent.pdf, PDF p. 20","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q041"}]},{"id":"T300-042","module":"T","domain":1,"topic":"Goal lifecycle","stem":"HR needs a one-time archive next Saturday. Which scheduling choice matches that requirement?","options":["Run Once in the Future","A daily archive that must be stopped after the first run","A goal period end date without scheduling an archive","A recurring review launch with the same due date"],"answer":0,"why":"Mass Archive Goals supports immediate execution or a single future run. A goal period date does not itself trigger archiving.","reference":{"title":"talent.pdf, PDF p. 20","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q042"}]},{"id":"T300-043","module":"T","domain":1,"topic":"Competency framework","stem":"HR has a class named Technical and a category named Data Quality. Where should a new competency be connected to appear under Technical?","options":["Assign it directly to Technical and leave its category empty","Make Data Quality a rating level and attach the class to the worker","Make Technical a behavior on the competency’s proficiency scale","Assign it to Data Quality and associate that category with Technical"],"answer":3,"why":"A class groups categories; competencies link to a class through a category.","reference":{"title":"Competency Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/competency-framework.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q043"},{"collection":"talent150","label":"B11"}]},{"id":"T300-044","module":"T","domain":1,"topic":"Competency framework","stem":"A category cannot be deleted although its parent class was removed. Which dependency should the administrator inspect?","options":["Whether the category’s label was also used on a proficiency scale","Competencies still assigned to the category","Whether one worker’s latest assessment is higher than the job target","The order of that category in the competency-precedence ranking"],"answer":1,"why":"A category with assigned competencies cannot be deleted.","reference":{"title":"Competency Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/competency-framework.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q044"},{"collection":"talent150","label":"C46"}]},{"id":"T300-045","module":"T","domain":1,"topic":"Competency framework","stem":"Leadership wants common competency names but different behavioral examples for supervisors and executives. What is the best setup?","options":["Use goal payout bands to describe the two roles","Change the competency source-precedence list by reviewer","Create one category for every worker and one global behavior","Use level-based behaviors by management level on the same competency"],"answer":3,"why":"Level-based behaviors can vary by management level.","reference":{"title":"Competency Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/competency-framework.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q045"},{"collection":"talent150","label":"A43"}]},{"id":"T300-046","module":"T","domain":1,"topic":"Competency framework","stem":"Expected behaviors differ by compensation grade, while the competency description is identical for everyone. Which settings fit?","options":["Define a common behavior and use compensation grade only as the rating source","Make behaviors apply to all levels and change only source precedence","Keep the description common and define behaviors by compensation grade","Define different competency names for each grade and keep all behaviors common"],"answer":2,"why":"Description and behavior settings can vary independently.","reference":{"title":"Competency Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/competency-framework.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q046"},{"collection":"talent150","label":"A18"}]},{"id":"T300-047","module":"T","domain":1,"topic":"Competency framework","stem":"A proficiency scale is already in use. HR wants to change the numeric meaning of its levels for future evaluations. What approach preserves historic interpretation?","options":["Create a new scale for the revised values","Move the associated competencies to a different category","Change only the display name and expect numeric values to follow","Edit the numeric values of the in-use scale directly"],"answer":0,"why":"A new scale preserves the existing scale and its historical numerical meaning.","reference":{"title":"Create Proficiency Rating Scales","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/worker-information/worker-experience/competencies/jai1406075289216.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q047"},{"collection":"talent150","label":"A34"}]},{"id":"T300-048","module":"T","domain":1,"topic":"Competency framework","stem":"The same competency has target 2 at job family, 3 at management level, and 4 at job profile. There is no position-specific target. Which target applies?","options":["The most recently entered of the three","4 from the job profile","2 from job family","3 from management level"],"answer":1,"why":"For the same competency, the more specific job-profile target overrides the management-level and family targets. This is job hierarchy, not assessment recency.","reference":{"title":"Concept: Job Family or Management Level Competencies","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/worker-information/worker-experience/competencies/tre1458771546111.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q048"},{"collection":"talent150","label":"C37"}]},{"id":"T300-049","module":"T","domain":1,"topic":"Competency framework","stem":"A job profile sets target 4 for Negotiation, but one position sets target 3 for that competency. The employee’s latest self-assessment is 2. Which value is the job target?","options":["3 from the position","2 from the employee assessment","The average of 3 and 4","4 from the job profile"],"answer":0,"why":"The position overrides the job-profile target. An assessed level describes the employee’s demonstrated proficiency and is a separate value.","reference":{"title":"Concept: Job Family or Management Level Competencies","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/worker-information/worker-experience/competencies/tre1458771546111.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q049"},{"collection":"talent150","label":"A23"}]},{"id":"T300-050","module":"T","domain":1,"topic":"Competency framework","stem":"A talent review records proficiency 3. Later the employee records 4. The tenant gives talent reviews higher source precedence. Which level should the profile use for that competency?","options":["4 because it was entered later","The numeric mean of the two entries","3 from the talent review","4 because it is the higher value"],"answer":2,"why":"Source precedence decides which assessed proficiency appears when the competency has multiple sources. Recency is the fallback when no list exists.","reference":{"title":"Concept: Competency Precedence","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/worker-information/worker-experience/competencies/bkn1630020779065.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q050"},{"collection":"talent150","label":"C16"}]},{"id":"T300-051","module":"T","domain":1,"topic":"Competency framework","stem":"Two assessments of the same competency exist and the tenant has no source-precedence list. Which occurrence does Workday use for the displayed proficiency?","options":["The most senior assessor’s entry","The highest assessment","The first value entered for the job profile","The most recent update"],"answer":3,"why":"Without configured precedence, recency selects the assessment. The target attached to a job is a separate comparison.","reference":{"title":"Concept: Competency Precedence","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/worker-information/worker-experience/competencies/bkn1630020779065.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q051"},{"collection":"talent150","label":"B12"}]},{"id":"T300-052","module":"T","domain":1,"topic":"Competency framework","stem":"A manager wants to evaluate behaviors on a defined proficiency scale in the annual review. Which review section is designed to use that scale?","options":["Questions","Overall","Competencies","Goals"],"answer":2,"why":"Proficiency scales evaluate competency behaviors. Other review sections can use ordinary rating scales but do not serve the same proficiency purpose.","reference":{"title":"talent.pdf, PDF p. 131-132,163","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q052"},{"collection":"talent150","label":"A42"}]},{"id":"T300-053","module":"T","domain":1,"topic":"Competency framework","stem":"A competency belongs to the job family but does not appear on the position as an explicit override. What should an analyst check before creating a duplicate competency?","options":["Whether the latest assessment’s source is above the job family on the precedence list","Whether the worker inherits the existing competency through the job structure","Whether the employee’s most recent rating equals the target proficiency","Whether moving the competency into a class would create a position-specific target"],"answer":1,"why":"Competencies can flow from the job structure. A missing explicit position entry does not, by itself, mean the competency is absent.","reference":{"title":"Concept: Job Family or Management Level Competencies","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/worker-information/worker-experience/competencies/tre1458771546111.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q053"},{"collection":"talent150","label":"B32"}]},{"id":"T300-054","module":"T","domain":1,"topic":"Competency framework","stem":"A designer assumes every competency needs both a category and class to be created. The client only wants a small library of named competencies to start. Which configuration is valid?","options":["Create a category and class before every competency can be saved","Create the competency without building the optional classification hierarchy","Assign the competency directly to a class without a category","Use a job-profile requirement in place of the competency definition"],"answer":1,"why":"The category/class hierarchy is optional.","reference":{"title":"Competency Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/competency-framework.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q054"},{"collection":"talent150","label":"C22"}]},{"id":"T300-055","module":"T","domain":1,"topic":"Competency framework","stem":"The delivered Talent Matrix for performance over time by competency must use a different competency. Which restriction should the designer account for?","options":["Only one competency per tenant can be designated for that matrix","A separate competency must be designated for each reviewer","Every competency in one class must be designated together","The designation applies only to the most recent review template"],"answer":0,"why":"Only one competency can be designated for this delivered matrix.","reference":{"title":"Competency Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/competency-framework.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q055"},{"collection":"talent150","label":"B07"}]},{"id":"T300-056","module":"T","domain":1,"topic":"Competency framework","stem":"A source-priority change alters proficiency displayed on worker profiles. An analyst expects it to reorder ordinary competency rating-scale results as well. What is the documented scope?","options":["Precedence applies only to ordinary rating-scale results","Precedence overrides the target on the worker's position","Competency precedence applies to proficiency levels, not ordinary rating-scale results","Precedence converts every rating scale into a proficiency scale"],"answer":2,"why":"Source precedence selects assessed proficiency. It does not govern ordinary rating-scale results.","reference":{"title":"Concept: Competency Precedence","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/worker-information/worker-experience/competencies/bkn1630020779065.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q056"}]},{"id":"T300-057","module":"T","domain":1,"topic":"Competency framework","stem":"A competency target is 2 for the job family and 4 for management level, with no job-profile or position override. What target should comparison use?","options":["The most recently entered target regardless of source","2 from job family","3 as the mean of both targets","4 from management level"],"answer":3,"why":"Management-level targets override job-family targets for the same competency.","reference":{"title":"Concept: Job Family or Management Level Competencies","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/worker-information/worker-experience/competencies/tre1458771546111.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q057"}]},{"id":"T300-058","module":"T","domain":1,"topic":"Competency framework","stem":"HR creates proficiency levels with adjacent numeric ranges that overlap at 2.5. What should be corrected before using the scale for calculated ratings?","options":["Keep the overlap and order the preferred label first","Remove numerical values and keep only range labels","Create a competency class for each overlapping level","Use ranges without overlap or gaps"],"answer":3,"why":"Calculated-rating ranges must be contiguous and nonoverlapping so a result has an unambiguous rating.","reference":{"title":"Create Proficiency Rating Scales","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/worker-information/worker-experience/competencies/jai1406075289216.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q058"}]},{"id":"T300-059","module":"T","domain":1,"topic":"Competency framework","stem":"A proficiency scale includes Not Applicable. HR wants it displayed as a choice without lowering a calculated result. How should it be treated?","options":["Map Not Applicable to the worker's target level","Give Not Applicable a numeric zero and count it normally","Exclude Not Applicable from rating calculations","Map Not Applicable to the lowest demonstrated proficiency"],"answer":2,"why":"The nonapplicable choice should not contribute to the calculation as if it were an assessed proficiency.","reference":{"title":"Create Proficiency Rating Scales","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/worker-information/worker-experience/competencies/jai1406075289216.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q059"}]},{"id":"T300-060","module":"T","domain":1,"topic":"Competency framework","stem":"A new competency is added to a job profile after employees already hold that profile. Their comparison view recognizes the new expectation, but their worker competency records do not yet contain it. What is the next supported step?","options":["Process it through a performance review or add it manually to the worker","Wait for source precedence to copy every target into assessed proficiency","Mark the competency as Used for Talent Matrix to populate all worker records","Change the job family target to force a worker assessment"],"answer":0,"why":"New job-profile competencies do not automatically populate existing workers' competency records.","reference":{"title":"Competency Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/competency-framework.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q060"}]},{"id":"T300-061","module":"T","domain":1,"topic":"Feedback","stem":"A manager wants historical feedback displayed in a review but does not want to send any new requests. What should be configured?","options":["An additional-manager evaluation without a feedback section","A Feedback section on the employee review template with appropriate inclusion settings","A new feedback request for every worker who provided earlier feedback","A Get Feedback from Review step with a blank template only"],"answer":1,"why":"Showing existing feedback is a template-content decision. A request step initiates new outreach.","reference":{"title":"talent.pdf, PDF p. 133,137","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q061"},{"collection":"talent150","label":"B30"}]},{"id":"T300-062","module":"T","domain":1,"topic":"Feedback","stem":"The annual review should show past feedback and also ask peers three standard questions. Which combination meets both requirements?","options":["Configure a Feedback section and a review feedback request step using the feedback template","Add only an employee acknowledgment step containing the three questions","Put question tags on existing feedback and launch no request","Configure only the historical Feedback section and make it required"],"answer":0,"why":"Historical display and soliciting new responses are separate. A structured template supplies the questions when the request runs.","reference":{"title":"talent.pdf, PDF p. 133,241","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q062"},{"collection":"talent150","label":"B36"}]},{"id":"T300-063","module":"T","domain":1,"topic":"Feedback","stem":"HR wants the author of feedback identified to authorized reviewers, but the employee who is the subject should not see the response. Which control addresses the audience?","options":["Anonymity with broad visibility","Lock Template with all recipients selected","Feedback badges with the author’s photo hidden","Confidential feedback and the permissions to view it"],"answer":3,"why":"Confidentiality governs who can view the response. Anonymity governs whether the provider’s identity is displayed.","reference":{"title":"talent.pdf, PDF p. 247","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q063"},{"collection":"talent150","label":"B46"}]},{"id":"T300-064","module":"T","domain":1,"topic":"Feedback","stem":"Feedback should be comparable across sites, but a local manager can add extra questions when requesting it. Which change prevents local edits while preserving the shared template?","options":["Lock the feedback template","Disable the ability to decline feedback","Make the feedback request confidential","Make the question tags mandatory"],"answer":0,"why":"Locking standardizes the question set for each request. Privacy and decline controls do not constrain question editing.","reference":{"title":"talent.pdf, PDF p. 256","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q064"},{"collection":"talent150","label":"A08"}]},{"id":"T300-065","module":"T","domain":1,"topic":"Feedback","stem":"HR needs an organized library of questions and a separate way to relate feedback to Communication as a competency. Which pairing matches the two jobs?","options":["Question tags for the library and talent tags for competency-linked feedback","Feedback badges for both purposes","Talent tags for the library and feedback badges for competency linkage","Competency classes for the question library and question tags for anonymity"],"answer":0,"why":"Question tags organize reusable questions. Configured talent tags connect feedback to talent attributes such as competencies.","reference":{"title":"talent.pdf, PDF p. 241,254","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q065"},{"collection":"talent150","label":"A26"}]},{"id":"T300-066","module":"T","domain":1,"topic":"Feedback","stem":"HR wants recognition badges with tenant-specific names and a way to switch badge availability off. Which tasks serve these two purposes?","options":["Maintain Feedback Setup for both badge definitions and all badge icons","Configure Talent Tags for badge definitions and Configure Employee Review Template for disabling badges","Maintain Feedback Badges for badge definitions and Maintain Feedback Setup for disabling badges","Maintain Question Tags for badge definitions and Get Feedback on Worker for disabling badges"],"answer":2,"why":"Maintain Feedback Badges configures badges using delivered icons. Maintain Feedback Setup can disable their use.","reference":{"title":"talent.pdf, PDF p. 241","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q066"}]},{"id":"T300-067","module":"T","domain":1,"topic":"Feedback","stem":"A manager requested feedback about a direct report and now wants the same questions sent to one more coworker. Where can they extend the existing request?","options":["Feedback Received, using Give Feedback for the new coworker","Feedback Requested, using Ask Others","Feedback Requested, using Cancel and then adding a new recipient to the canceled event","Manage Feedback Questions, adding the new recipient to the library question"],"answer":1,"why":"Ask Others extends an existing question set to more people. Starting another request creates a new solicitation.","reference":{"title":"talent.pdf, PDF p. 243","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q067"},{"collection":"talent150","label":"B03"}]},{"id":"T300-068","module":"T","domain":1,"topic":"Feedback","stem":"A feedback provider should be able to decline a request and explain why. Which tenant setting matters?","options":["The anonymity setting on the review template","The decline option in Maintain Feedback Setup","The option to make the request confidential by default","The expiration date setting for feedback requests"],"answer":1,"why":"Declining is a feedback workflow option. It is independent of anonymity, competency linkage, and ratings.","reference":{"title":"talent.pdf, PDF p. 245","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q068"},{"collection":"talent150","label":"B05"}]},{"id":"T300-069","module":"T","domain":1,"topic":"Feedback","stem":"A manager wants feedback on one employee from three peers. They accidentally request feedback on themselves. Which workflow corrects the subject of the request?","options":["Give Feedback, with the three peers listed as recipients","Get Feedback on Worker, initiated for that employee","Get Feedback on Self, with the employee mentioned in the question text","Provide Employee Review Comments on the employee’s review"],"answer":1,"why":"The event’s subject determines whose feedback is being collected. Mentioning the employee in a question does not change a self-feedback event.","reference":{"title":"talent.pdf, PDF p. 240","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q069"},{"collection":"talent150","label":"A49"}]},{"id":"T300-070","module":"T","domain":1,"topic":"Feedback","stem":"The tenant has standard questions but employees cannot select a prepopulated set for a feedback request. What should the administrator assemble?","options":["An employee review Questions section containing the standard questions","A question tag containing the standard questions, without a template","A competency category containing the standard questions","A feedback template containing the reusable questions"],"answer":3,"why":"Questions are reusable ingredients. A feedback template assembles them into a set available at request time.","reference":{"title":"talent.pdf, PDF p. 254-255","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q070"},{"collection":"talent150","label":"A39"}]},{"id":"T300-071","module":"T","domain":1,"topic":"Feedback","stem":"Employees want a standard five-question template when giving unsolicited recognition. What should the administrator explain about anytime feedback?","options":["Anytime feedback accepts templates only when the recipient has an active review","Give Feedback does not support feedback templates or configured questions","A Feedback on Worker template becomes an anytime template when locked","A Feedback on Self template can be assigned to Give Feedback"],"answer":1,"why":"Structured templates apply to requested feedback. Anytime feedback uses its own free-text experience.","reference":{"title":"talent.pdf, PDF p. 236","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q071"}]},{"id":"T300-072","module":"T","domain":1,"topic":"Feedback","stem":"A worker gives anytime feedback to four recipients at once and cannot choose anonymity or privacy. Which explanation is correct?","options":["Those options are controlled by the annual review template","Those options are unavailable for multiple-recipient anytime feedback","Those options require all recipients to share one manager","Those options become available after the first recipient acknowledges"],"answer":1,"why":"Multiple-recipient anytime feedback does not support private, confidential, or anonymous sharing.","reference":{"title":"talent.pdf, PDF p. 236","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q072"}]},{"id":"T300-073","module":"T","domain":1,"topic":"Feedback","stem":"HR deactivates anonymity today. A manager expects yesterday's anonymous submissions to reveal their authors. What should support explain?","options":["Only feedback in active reviews reveals its authors","All historical submissions display authors at the next report refresh","Historical feedback is deleted when anonymity is deactivated","Existing anonymous submissions retain their anonymity"],"answer":3,"why":"Feedback setup changes affect future events. Deactivation does not expose identities on existing anonymous feedback.","reference":{"title":"talent.pdf, PDF p. 244-245","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q073"}]},{"id":"T300-074","module":"T","domain":1,"topic":"Feedback","stem":"Confidential feedback is disabled for new submissions. What happens to earlier confidential feedback about a worker?","options":["It becomes visible only if its provider is also a manager","It remains confidential and hidden from its subject","It becomes private feedback automatically","It becomes visible to its subject as soon as setup is saved"],"answer":1,"why":"Changing the configuration does not retroactively change existing feedback's confidentiality.","reference":{"title":"talent.pdf, PDF p. 244-247","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q074"}]},{"id":"T300-075","module":"T","domain":1,"topic":"Feedback","stem":"A manager wants one response both confidential and private. Which restriction should the administrator identify?","options":["Confidentiality is available only when the subject is the requester","Confidential and private are compatible only when anonymity is off","The two visibility modes are mutually exclusive, though confidential feedback may also be anonymous","Private and anonymous are always mutually exclusive"],"answer":2,"why":"Private and confidential are different audiences and cannot both apply to one response. Anonymity is a separate identity choice.","reference":{"title":"talent.pdf, PDF p. 247","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q075"}]},{"id":"T300-076","module":"T","domain":1,"topic":"Feedback","stem":"An employee wants peer feedback visible to them but not to their manager under the configured domain policies. Which combination fits?","options":["Confidential self-requested feedback","Confidential role-requested feedback","Private self-requested feedback","Public anonymous anytime feedback"],"answer":2,"why":"Private self-requested feedback supports sharing with the subject while restricting other viewers through private-feedback security.","reference":{"title":"talent.pdf, PDF p. 249-250","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q076"}]},{"id":"T300-077","module":"T","domain":1,"topic":"Feedback","stem":"HR wants feedback providers, rather than requesters, to decide confidentiality on role-requested feedback. Which setup is targeted?","options":["Enable Confidential Feedback for Give Requested Feedback","Anonymous by Default","Default: Get Feedback on Worker is Confidential only","Disable Decline Feedback"],"answer":0,"why":"Provider-controlled confidentiality is configured on Give Requested Feedback. A requester default alone does not delegate that choice.","reference":{"title":"talent.pdf, PDF p. 246-247","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q077"}]},{"id":"T300-078","module":"T","domain":1,"topic":"Feedback","stem":"A selected peer cannot reassign a Give Requested Feedback task, even though the policy displays Reassign Tasks. What is the documented limitation?","options":["Reassignment works only after the peer enters a response","Reassignment of that task is disabled","Reassignment requires converting the request to anytime feedback","Reassignment becomes available if the template is unlocked"],"answer":1,"why":"The reference notes that this action is displayed on the policy but is not supported for the task.","reference":{"title":"talent.pdf, PDF p. 239-240","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q078"}]},{"id":"T300-079","module":"T","domain":1,"topic":"Feedback","stem":"A feedback question's choices have scores 4, -2, and 1. A multi-select response selects the first two. What is the total score?","options":["1","2","4","6"],"answer":1,"why":"Workday sums the integers for selected answers, including negative integers: 4 + (-2) = 2.","reference":{"title":"talent.pdf, PDF p. 254-255","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q079"}]},{"id":"T300-080","module":"T","domain":1,"topic":"Feedback","stem":"An administrator defines a multiple-choice feedback question with 26 unique possible answers. What change is required?","options":["Assign a separate question tag to the extra answer","Convert all answer scores to positive integers","Reduce the possible answers to at most 25","Use exactly two options for every multiple-choice question"],"answer":2,"why":"A multiple-choice feedback question supports 2 to 25 unique possible answers.","reference":{"title":"talent.pdf, PDF p. 254","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q080"}]},{"id":"T300-081","module":"T","domain":1,"topic":"Feedback","stem":"A feedback question is used in a template but HR wants to change its answer type. Which fields are documented as editable while the question is used in a template?","options":["Question Body and answer type only","Question Name and Question Tags only","Scores and answer type only","All attributes until the next feedback event launches"],"answer":1,"why":"Template use restricts editing to the question name and tags. A new question is needed for structural changes.","reference":{"title":"talent.pdf, PDF p. 255","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q081"}]},{"id":"T300-082","module":"T","domain":1,"topic":"Feedback","stem":"A question shows Usage = 0 and Used in Feedback = Yes. Why is Delete unavailable?","options":["Its template must first be changed from locked to unlocked","Its question tags must be deleted before any feedback question can be deleted","Usage must be greater than zero before deletion is allowed","It was used in a prior feedback event even though no current template uses it"],"answer":3,"why":"Historical event use prevents deletion. Zero current template usage does not remove that history.","reference":{"title":"talent.pdf, PDF p. 255","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q082"}]},{"id":"T300-083","module":"T","domain":1,"topic":"Feedback","stem":"A requester edits text in an unlocked translated feedback template. HR expects Workday to refresh all translated versions automatically. What is the actual behavior?","options":["The request is blocked until all translated versions are manually deleted","Only locked templates allow translated questions to be edited","The edited content is not automatically retranslated","The edited content replaces every translation with the requester's language"],"answer":2,"why":"Changes in unlocked templates can create translation inconsistencies because Workday does not retranslate the updated questions.","reference":{"title":"talent.pdf, PDF p. 256","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q083"}]},{"id":"T300-084","module":"T","domain":1,"topic":"Feedback","stem":"A Give Requested Feedback task has both business-process help text and template help text. Which appears first?","options":["Only the help text belonging to the requester's security group","Whichever was updated most recently","Template help text","Business-process help text"],"answer":3,"why":"The business-process help text precedes template help text when both are configured.","reference":{"title":"talent.pdf, PDF p. 256","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q084"}]},{"id":"T300-085","module":"T","domain":1,"topic":"Feedback","stem":"Two feedback template condition rules match the same worker. The first offers Template A; the second offers Template B. Which templates should the requester receive from rule evaluation?","options":["Those assigned to the last matching rule","Only the tenant's unconditional default template","Those assigned to the first matching rule","The union of templates from every matching rule"],"answer":2,"why":"Rules are evaluated in their configured order, and the first matching rule determines the applicable templates.","reference":{"title":"talent.pdf, PDF p. 257","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q085"}]},{"id":"T300-086","module":"T","domain":1,"topic":"Feedback","stem":"A default feedback template is configured, but templates are not required. What can the requester do with the default?","options":["Clear it and add other questions","Clear it only after a manager approves the request","Replace it only with a template assigned by the last matching rule","Use it without ever changing the question set"],"answer":0,"why":"A default supplies an initial choice. Requiring a template is the separate control that removes ad hoc questions.","reference":{"title":"talent.pdf, PDF p. 257","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q086"}]},{"id":"T300-087","module":"T","domain":1,"topic":"Feedback","stem":"A mass feedback operation explicitly specifies Template A. A matching feedback template condition rule specifies Template B. Which configuration takes precedence?","options":["The oldest of the two templates","The template entered on the mass operation","The template with the larger number of questions","The matching condition rule"],"answer":3,"why":"Conditional template rules also take precedence in mass feedback events.","reference":{"title":"talent.pdf, PDF p. 257","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q087"}]},{"id":"T300-088","module":"T","domain":1,"topic":"Feedback","stem":"HR wants every role-requested feedback event to use an approved template and prevent ad hoc questions. Which setup directly addresses this?","options":["Make every existing question tag inactive","Require Feedback Template for the relevant feedback type","Set a default template but leave templates optional","Add a template help-text warning only"],"answer":1,"why":"Requiring a template prevents ad hoc questions. A default alone can be cleared when templates are optional.","reference":{"title":"talent.pdf, PDF p. 257","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q088"}]},{"id":"T300-089","module":"T","domain":1,"topic":"Feedback","stem":"A manager wants a recognition badge on a structured role-requested response. Why is the badge unavailable?","options":["Badges are available only after the requested feedback is anonymous","Badges are supported for anytime feedback only","Badges require an unlocked role-requested template","Badges require the same competency on every requested question"],"answer":1,"why":"The badge feature belongs to Give Feedback, not role-requested or self-requested templates.","reference":{"title":"talent.pdf, PDF p. 239-241","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q089"}]},{"id":"T300-090","module":"T","domain":1,"topic":"Feedback","stem":"An administrator tries to set a maximum of five feedback providers through the requested-feedback setup. What should they clarify?","options":["The maximum is controlled by the feedback question's number of possible answers","The maximum is inherited from the additional-manager evaluation setup","Workday does not provide a setting to limit the number of feedback providers","The maximum must equal the number of template questions"],"answer":2,"why":"The documented requested-feedback limitations include no configurable provider-count limit.","reference":{"title":"talent.pdf, PDF p. 239","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q090"}]},{"id":"T300-091","module":"T","domain":2,"topic":"Review categories","stem":"HR needs quarterly check-ins and annual appraisals, both using Start Performance Review but with different templates. How should they be organized?","options":["Two new delivered review categories with one shared type","A succession plan type for check-ins and a talent pool type for annual reviews","A separate competency class for each template","Two review types in the Performance Review category"],"answer":3,"why":"The category supplies the business process family. Multiple review types within it organize related templates and support conditional workflow.","reference":{"title":"talent.pdf, PDF p. 127-128","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q091"},{"collection":"talent150","label":"A37"}]},{"id":"T300-092","module":"T","domain":2,"topic":"Review categories","stem":"A new annual template does not appear when starting a performance review. It was created under a type belonging to Individual Development Plan. Which design issue explains the lookup?","options":["All performance templates must include both feedback and calibration","The template’s review type ties it to the development-plan initiation path","The template’s Applies To rule is blank and therefore blocks every worker","The template lacks enough Goals sections to qualify as annual"],"answer":1,"why":"The type inherits its category’s initiation process. Renaming a template does not change that association.","reference":{"title":"talent.pdf, PDF p. 127-128","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q092"},{"collection":"talent150","label":"C08"}]},{"id":"T300-093","module":"T","domain":2,"topic":"Review categories","stem":"An employee needs a structured career-growth plan focused on future assignments, without corrective action for current performance. Which review category is most suitable?","options":["Annual Performance Review","Disciplinary Action","Individual Development Plan","Performance Improvement Plan"],"answer":2,"why":"The intended outcome is development planning. A corrective performance plan or disciplinary action would imply a different purpose.","reference":{"title":"talent.pdf, PDF p. 191-192","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q093"},{"collection":"talent150","label":"B41"}]},{"id":"T300-094","module":"T","domain":2,"topic":"Review categories","stem":"A worker is failing an agreed service standard. HR wants a defined period of coaching, measures, and follow-up aimed at improving current performance. Which category best fits?","options":["Talent Review","Disciplinary Action for a documented conduct violation","Individual Development Plan","Performance Improvement Plan"],"answer":3,"why":"The core objective is improving current performance within a defined plan. Career growth and documenting misconduct are separate uses.","reference":{"title":"talent.pdf, PDF p. 197-198","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q094"},{"collection":"talent150","label":"B38"}]},{"id":"T300-095","module":"T","domain":2,"topic":"Review categories","stem":"HR must formally document an attendance-policy violation using a specific reason and action. They do not want an ordinary appraisal. Which pairing fits?","options":["An organizational goal type and Start Disciplinary Action","A Disciplinary Action review type and its disciplinary business process","An Annual Performance Review type and Start Talent Review","A career development type and the performance-calibration process"],"answer":1,"why":"A disciplinary template and event capture the formal action. A reason label on an unrelated template does not change its process.","reference":{"title":"talent.pdf, PDF p. 194-195","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q095"},{"collection":"talent150","label":"C42"}]},{"id":"T300-096","module":"T","domain":2,"topic":"Review categories","stem":"HR wants an embedded Get Feedback step for a performance improvement plan and for an individual development plan. Which design is supported by the review framework?","options":["Use Get Feedback in neither, because it is exclusive to talent reviews","Use Get Feedback in both as long as they share a feedback template","Use Get Feedback in the development plan and choose another supported approach for the improvement plan","Use Get Feedback only in the improvement plan and copy it to the development plan later"],"answer":2,"why":"The review feedback subprocess is available for performance reviews and development plans. Other review categories have different supported steps.","reference":{"title":"talent.pdf, PDF p. 168,241","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q096"},{"collection":"talent150","label":"A40"}]},{"id":"T300-097","module":"T","domain":2,"topic":"Review categories","stem":"A no-longer-needed review type cannot be deleted after a template was assigned to it. What dependency is implicated?","options":["The template’s s
