tart and end dates must match its label","The type’s association with a review template","The type’s rating scales have unequal numbers of levels","Its review sections are displayed in a different order from the delivered layout"],"answer":1,"why":"Assigning a template to a review type restricts deletion. Unrelated talent and goal records are not the dependency described.","reference":{"title":"talent.pdf, PDF p. 127-128","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q097"},{"collection":"talent150","label":"A04"}]},{"id":"T300-098","module":"T","domain":2,"topic":"Review categories","stem":"HR wants employees to initiate their own development plans and performance reviews, but not their own disciplinary actions. Which configuration supports the first two?","options":["Give Employee as Self initiation on every employee-review category","Enable the relevant individual initiation options and self-service BP permissions","Add an employee acknowledgment step to each template","Select a self-requested feedback template on both review types"],"answer":1,"why":"Individual initiation is available for performance reviews and development plans. Eligibility, the initiation option, and security must support the intended use.","reference":{"title":"talent.pdf, PDF p. 127-128","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q098"}]},{"id":"T300-099","module":"T","domain":2,"topic":"Routing and visibility","stem":"A worker changed managers late in a January–December review. HR wants the manager associated with most of the review period to evaluate the worker. The step currently routes to Manager. What should be changed?","options":["Route the evaluation to Manager for Majority of Event and authorize that group","Add the former manager as an additional reviewer for competencies only","Leave Manager as recipient and change the goal date filter","Replace Manager with Matrix Manager on every review step"],"answer":0,"why":"Routing determines who receives the evaluation. The intended group also needs the permissions for its assigned task.","reference":{"title":"talent.pdf, PDF p. 169","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q099"},{"collection":"talent150","label":"C06"}]},{"id":"T300-100","module":"T","domain":2,"topic":"Routing and visibility","stem":"The first manager supervised January–May and the second supervised June–December. The manager at the review midpoint is still the manager at the end. Under majority-of-event routing, who receives the step?","options":["The second manager","The first manager","The manager of the supervisory organization at review initiation only","Both managers as joint primary evaluators"],"answer":0,"why":"The midpoint and end identify the same manager in this scenario. That manager also supervised the longer portion of the review.","reference":{"title":"talent.pdf, PDF p. 169","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q100"},{"collection":"talent150","label":"B37"}]},{"id":"T300-101","module":"T","domain":2,"topic":"Routing and visibility","stem":"A reviewer receives the right Inbox task and sees the evaluation, but an embedded analytical worklet is missing only for that role. What should the administrator check first?","options":["The employee review template's historical feedback date range","The review's section weight calculation method","The role’s access to the worklet and its underlying report data","The additional-reviewer anonymity setting"],"answer":2,"why":"Correct routing does not grant report data access. Test the worklet using the affected security context.","reference":{"title":"talent.pdf, PDF p. 178","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q101"},{"collection":"talent150","label":"A35"}]},{"id":"T300-102","module":"T","domain":2,"topic":"Routing and visibility","stem":"Only annual performance reviews need an HR approval after manager evaluation. Quarterly reviews use the same category. How should the definition distinguish the events?","options":["Add a condition on the HR approval step using review type","Change the routing security group to the annual review’s manager","Create an extra competency section only in the annual template","Make HR approval mandatory in the shared definition for all types"],"answer":0,"why":"The review type distinguishes annual from quarterly within one category. Routing to a different person does not decide whether the step runs.","reference":{"title":"talent.pdf, PDF p. 127-128,178","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q102"},{"collection":"talent150","label":"A46"}]},{"id":"T300-103","module":"T","domain":2,"topic":"Routing and visibility","stem":"An employee should acknowledge the finished review, followed by the manager’s acknowledgment. Where does this sequence belong?","options":["Two calibration participation steps after the review is printed","Two additional-reviewer steps before the primary manager evaluation","Employee and manager review-comment steps in Complete Manager Evaluation","Two feedback requests in Complete Self Evaluation"],"answer":2,"why":"The review-comment steps support acknowledgment of the concluded evaluation. Peer input and self-evaluation occur for different purposes.","reference":{"title":"talent.pdf, PDF p. 180","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q103"},{"collection":"talent150","label":"B39"}]},{"id":"T300-104","module":"T","domain":2,"topic":"Routing and visibility","stem":"A test launch created 18 performance review events, all still in progress. No calibration was launched. They must be stopped before a corrected relaunch. Which operation fits their status?","options":["Mass rescind the in-progress review events","Move their end dates into the past","Rescind the review template definition","Mass cancel the in-progress review events"],"answer":3,"why":"Cancel is the operation for in-progress events. Changing period dates does not reverse an active workflow.","reference":{"title":"Concept: Business Process Management","url":"https://stage.doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/ikj1637605088663.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q104"},{"collection":"talent150","label":"A02"}]},{"id":"T300-105","module":"T","domain":2,"topic":"Routing and visibility","stem":"A test cohort contains nine successfully completed reviews and six in-progress reviews. All events are eligible for the relevant administrative action. How should the team undo both sets?","options":["Rescind all fifteen reviews regardless of status","Rescind the completed reviews and cancel the in-progress reviews","Cancel all fifteen reviews regardless of status","Cancel the completed reviews and rescind the in-progress reviews"],"answer":1,"why":"Completion status determines the reversal mechanism. Partitioning the cohort avoids using an inapplicable action on part of it.","reference":{"title":"Concept: Business Process Management","url":"https://stage.doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/ikj1637605088663.html","note":"Supplemental Workday reference"},"sample":0,"memberships":[{"collection":"new300","label":"Q105"},{"collection":"talent150","label":"A22"}]},{"id":"T300-106","module":"T","domain":2,"topic":"Routing and visibility","stem":"A worker has a home position and a concurrent host-country position. The host manager must handle the applicable manager evaluation even though no transfer occurred. Which setting addresses this?","options":["A different employee review end date","Manager for Majority of Event","A routing modifier for the additional position on the review step","Exclude Initiator with transaction-relative fallback"],"answer":2,"why":"Multiple positions are simultaneous assignments. A position routing modifier selects which position's manager receives a supported step.","reference":{"title":"talent.pdf, PDF p. 176","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q106"},{"collection":"bp200","label":"030"}]},{"id":"T300-107","module":"T","domain":2,"topic":"Routing and visibility","stem":"Primary and additional position managers sit in the same organization. Testing sends the review step to both when a position routing modifier is used. Which explanation is documented?","options":["A second primary position must have been created","The shared organization can cause both managers to receive the step","The majority rule always returns two managers","Additional manager evaluation automatically adds both managers"],"answer":1,"why":"Workday advises against this modifier when the two managers share an organization because it can route to both.","reference":{"title":"talent.pdf, PDF p. 176","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q107"},{"collection":"bp200","label":"031"}]},{"id":"T300-108","module":"T","domain":2,"topic":"Routing and visibility","stem":"Self-evaluation is at initiation. Its child definition contains only Initiation and the manager evaluation immediately follows. The manager needs to take over the in-progress performance review. What should they use?","options":["Complete On Behalf Of from My Team's Performance Reviews","Manual Send Back on a completed review","Correct the self-evaluation from the full process record","Rescind the self-evaluation and relaunch the parent"],"answer":0,"why":"This is the supported manager pull-forward path when both the current step and the sequence meet the requirements.","reference":{"title":"talent.pdf, PDF p. 185","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q108"},{"collection":"bp200","label":"088"}]},{"id":"T300-109","module":"T","domain":2,"topic":"Routing and visibility","stem":"Self-evaluation contains Initiation plus a separate approval. The manager evaluation immediately follows the self-evaluation in the parent. Why is routine manager pull-forward unavailable?","options":["Self-evaluation must have an acknowledgement after Initiation","The manager evaluation must precede self-evaluation","Manager pull-forward always requires completed calibration","The self-evaluation definition must contain only Initiation"],"answer":3,"why":"Parent adjacency is only one prerequisite. The extra approval in the child definition prevents this design from meeting the pull-forward requirements.","reference":{"title":"talent.pdf, PDF p. 185","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q109"},{"collection":"bp200","label":"089"}]},{"id":"T300-110","module":"T","domain":2,"topic":"Routing and visibility","stem":"The annual review is at self-evaluation. A Get Feedback step sits between it and manager evaluation. Why can't the manager use the standard pull-forward into manager evaluation?","options":["The worker has not selected an acknowledgement status","Manager evaluation is not the immediately following step","The manager evaluation has too few sections","No one has supplied feedback yet"],"answer":1,"why":"Manager pull-forward depends on the order of these two evaluations. An intervening feedback step breaks adjacency.","reference":{"title":"talent.pdf, PDF p. 185","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q110"},{"collection":"bp200","label":"090"}]},{"id":"T300-111","module":"T","domain":2,"topic":"Routing and visibility","stem":"A manager starts evaluating an in-progress review and finds the employee's self-assessment incomplete. Self-evaluation was the immediately preceding step. Which action preserves the review and asks the employee to revise?","options":["Correct a completed manager evaluation","Send Back from the manager evaluation","Deny the review","Manual Advance to completion"],"answer":1,"why":"The delivered manager workflow can return the review to the preceding self-evaluation. Denial terminates the process.","reference":{"title":"talent.pdf, PDF p. 185","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q111"},{"collection":"bp200","label":"091"}]},{"id":"T300-112","module":"T","domain":2,"topic":"Routing and visibility","stem":"The manager submitted an evaluation, but the overall review has not reached completion. They discover an important omission. What can they do through the supported manager workflow?","options":["Start a new self-evaluation outside the review","Rescind the completed parent review","Send the review back to the manager evaluation initiation and repeat subsequent steps","Reopen only the employee's acknowledgement while leaving the evaluation final"],"answer":2,"why":"Before overall completion, the manager can revisit their evaluation. Previously entered comments are saved, but subsequent steps and acknowledgement must run again.","reference":{"title":"talent.pdf, PDF p. 186","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q112"},{"collection":"bp200","label":"092"}]},{"id":"T300-113","module":"T","domain":2,"topic":"Routing and visibility","stem":"A completed performance review must be reopened so the manager can revise the evaluation through the workflow. To which step can an authorized administrator manually send the completed review?","options":["Complete Self Evaluation directly","Get Additional Reviewers directly","Set Review Content directly","Complete Manager Evaluation"],"answer":3,"why":"Completed reviews have a specific reopening destination. The broader movement options for in-progress reviews do not apply.","reference":{"title":"talent.pdf, PDF p. 186","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q113"},{"collection":"bp200","label":"093"}]},{"id":"T300-114","module":"T","domain":2,"topic":"Routing and visibility","stem":"A reopened completed review contains previously submitted peer ratings and feedback requests. HR is concerned it will invite all contributors again. What should it expect from Manual Send Back?","options":["The reopened review becomes a new parent event for every contributor","Configured Get Additional Reviewers and Get Feedback from Review steps are skipped","The reviewer selections are cleared and must be made again","All contributors receive the original questions again"],"answer":1,"why":"Reopening to manager evaluation does not repeat these solicitations. Tasks concurrent with manager evaluation are also skipped in this circumstance.","reference":{"title":"talent.pdf, PDF p. 186","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q114"},{"collection":"bp200","label":"094"}]},{"id":"T300-115","module":"T","domain":2,"topic":"Routing and visibility","stem":"A worker signed an acknowledgement before the performance review was sent back. The team wants to know which information survives supported send back or pull forward. What is retained?","options":["Only the rating selected at initiation","Review content and comments, while acknowledgements are removed","Both content and acknowledgements without further action","Acknowledgements only, while comments are cleared"],"answer":1,"why":"The participant can work from existing comments, but must acknowledge the revised review again.","reference":{"title":"talent.pdf, PDF p. 185","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q115"},{"collection":"bp200","label":"095"}]},{"id":"T300-116","module":"T","domain":2,"topic":"Routing and visibility","stem":"A sent-back performance review involves someone who has changed organizations. An action and an approval must be routed again. Which pairing is documented?","options":["Action to the original participant and approval to the current incumbent","Both to the current incumbent","Action to the current incumbent and approval to the original participant","Both to the original participant"],"answer":0,"why":"Workday treats a participant's data-entry action differently from approval authority when assignments have changed.","reference":{"title":"talent.pdf, PDF p. 185","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q116"},{"collection":"bp200","label":"096"}]},{"id":"T300-117","module":"T","domain":2,"topic":"Routing and visibility","stem":"A disciplinary template hides sections from the employee. The BP still assigns the employee a self-evaluation. Why can the employee see the review?","options":["All disciplinary review templates are always fully public","The disciplinary BP's employee participation can override template visibility","A hidden section becomes public when the end date is in the future","The employee's majority manager automatically exposed the sections"],"answer":1,"why":"Employee-facing substeps can expose the review in disciplinary and PIP workflows. Review both template visibility and actual workflow participation.","reference":{"title":"talent.pdf, PDF p. 169","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q117"},{"collection":"bp200","label":"098"}]},{"id":"T300-118","module":"T","domain":2,"topic":"Routing and visibility","stem":"An HR partner must update the reason and dates of a completed disciplinary action without opening a new annual review. Which task targets this correction?","options":["Resume Employee Reviews On Hold","Start Performance Review for Employee","Update Employee Review Dates","Maintain Employee Review Acknowledgement Statuses"],"answer":2,"why":"The targeted update task supports disciplinary reasons and dates. For PIPs, its documented use is changing the dates.","reference":{"title":"talent.pdf, PDF p. 165","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q118"},{"collection":"bp200","label":"100"}]},{"id":"T300-119","module":"T","domain":2,"topic":"Routing and visibility","stem":"A review spans three managers: Ana at its start, Ben at its midpoint, and Cara at its end. The evaluation routes to Manager for Majority of Event. Who is selected by the documented rule?","options":["The manager with the most total days, after counting every assignment","Cara","Ben","Ana"],"answer":3,"why":"When midpoint and end managers differ, the rule uses the manager at the start. It is not a day-by-day comparison across all three assignments.","reference":{"title":"talent.pdf, PDF p. 169","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q119"}]},{"id":"T300-120","module":"T","domain":2,"topic":"Routing and visibility","stem":"An employee has View Completed Only on the review business process. The administrator checks only the workflow completion timestamp when investigating visibility. Which additional date does the reference identify?","options":["The review end date, which is the review's effective date","The self-evaluation submission date","The review start date, which is the review's effective date","The template creation date"],"answer":0,"why":"The review's effective date is its end date. The documented View Completed Only behavior also depends on that date.","reference":{"title":"talent.pdf, PDF p. 169","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q120"}]},{"id":"T300-121","module":"T","domain":2,"topic":"Additional contributors","stem":"A project lead should rate the employee’s competencies as a peer reviewer. A former manager should comment as an additional manager. Which assignment preserves those distinct contributions?","options":["Use requested feedback for both and treat every response as a competency rating","Use additional-manager evaluation for both and rely on section comments to become ratings","Make both people primary managers on the supervisory organization","Use additional-reviewer evaluation for the lead and additional-manager evaluation for the former manager"],"answer":3,"why":"Additional reviewers can rate competencies. Additional managers contribute via a different evaluation path, so their roles are not interchangeable.","reference":{"title":"talent.pdf, PDF p. 151-152,186-187","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q121"},{"collection":"talent150","label":"B13"}]},{"id":"T300-122","module":"T","domain":2,"topic":"Additional contributors","stem":"A template administrator deactivates anonymous feedback and expects multi-rater competency reviewer names to become visible. Which separate behavior matters?","options":["Reviewer names are controlled only by the manager evaluation due date","Reviewers become identified only when their rating differs from the manager rating","Additional reviewers are anonymous by default, independently of the feedback anonymity setting","Multi-rater reviewer names always follow the anytime feedback anonymity setting"],"answer":2,"why":"Additional-reviewer anonymity is a separate review-template configuration from the tenant feedback anonymity setting.","reference":{"title":"talent.pdf, PDF p. 138-139","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q122"}]},{"id":"T300-123","module":"T","domain":2,"topic":"Additional contributors","stem":"An additional manager evaluation remains outstanding when the parent Start Performance Review business process completes. What happens to that outstanding contribution?","options":["It automatically becomes a separate annual performance review","It reopens the primary manager evaluation when finally submitted","Workday cancels the outstanding additional manager evaluation","It remains open indefinitely after parent completion"],"answer":2,"why":"Outstanding additional manager evaluations are canceled after the parent performance review completes.","reference":{"title":"talent.pdf, PDF p. 187-188","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q123"}]},{"id":"T300-124","module":"T","domain":2,"topic":"Additional contributors","stem":"A contingent project lead with an active account is missing from the additional manager selection. Which policy change specifically enables this role?","options":["Grant View Completed Only on the parent review","Change only the multi-rater Complete Additional Reviewer Evaluation policy","Authorize the contingent group on the initiating action of Complete Additional Manager Evaluation for Performance Review","Grant the contingent worker the primary manager's organization role"],"answer":2,"why":"Additional managers and additional competency reviewers use different completion processes. Check the initiating action on the additional-manager policy.","reference":{"title":"talent.pdf, PDF p. 189","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q124"},{"collection":"bp200","label":"058"}]},{"id":"T300-125","module":"T","domain":2,"topic":"Additional contributors","stem":"An additional manager wants to comment on a specific competency and delete a competency from the review. Which outcome fits the documented section capabilities?","options":["Both actions are supported wherever item comments are enabled","Item comments are supported, but competency item deletion is outside the listed add/delete sections","Neither action is available to an additional manager","Deletion is supported, but comments require a multi-rater assignment"],"answer":1,"why":"Competencies accept item comments. The additional-manager sections allowing item additions or deletions include goals and accomplishments, but omit competencies.","reference":{"title":"talent.pdf, PDF p. 187-188","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q125"},{"collection":"bp200","label":"060"}]},{"id":"T300-126","module":"T","domain":2,"topic":"Additional contributors","stem":"A completed additional manager evaluation needs revision while the main review still proceeds. Which report is designed for pulling forward or sending back that contributor's evaluation?","options":["Average Rating by Additional Reviewer Type","Talent Review Status Summary","Additional Manager Evaluations","Worker Calibration History"],"answer":2,"why":"This report manages additional-manager work directly. The manager's main review and the contributor's evaluation are different events.","reference":{"title":"talent.pdf, PDF p. 189","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q126"},{"collection":"bp200","label":"061"}]},{"id":"T300-127","module":"T","domain":2,"topic":"Additional contributors","stem":"Contingent peers can be selected for annual reviews but cannot complete multi-rater input on a development plan. Which policy is the targeted check?","options":["Complete Additional Manager Evaluation for Performance Review","Launch Calibration","Start Talent Review for Organization","Complete Additional Reviewer Evaluation for Development Plans"],"answer":3,"why":"The completion policy is specific to the parent review category. Authorization for performance multi-rater input does not establish authorization for development plans.","reference":{"title":"talent.pdf, PDF p. 156","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q127"},{"collection":"bp200","label":"064"}]},{"id":"T300-128","module":"T","domain":2,"topic":"Review templates","stem":"A client needs two separately labeled goal sections for personal objectives and organization-aligned objectives. What is the template design?","options":["Create two review categories and merge their templates at launch","Use one Feedback section as a second Goals section","Insert the identical delivered Goals section twice and rename the second instance","Create a tenanted Goals section type and use distinct section types on the template"],"answer":3,"why":"Each section type is used once per template. A tenanted Goals type provides a distinct section with supported goal behavior.","reference":{"title":"talent.pdf, PDF p. 129-130","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q128"},{"collection":"talent150","label":"C34"}]},{"id":"T300-129","module":"T","domain":2,"topic":"Review templates","stem":"Two review templates use display labels “Leadership” and “Leadership development,” but they must share carryover content. What must match beyond visible labels?","options":["The name of the employee’s manager","The underlying review section type","The order of the sections on the page","The number of feedback providers"],"answer":1,"why":"Carryover matches eligible content between like section types. A shared-looking label or screen position does not establish that identity.","reference":{"title":"talent.pdf, PDF p. 129,173","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q129"},{"collection":"talent150","label":"A15"}]},{"id":"T300-130","module":"T","domain":2,"topic":"Review templates","stem":"A template has no Applies To criteria. A designer expects only workers in the template creator’s supervisory organization to be eligible. What is the template’s eligibility behavior?","options":["Blank Applies To restricts eligibility to the creator’s direct reports","Blank Applies To prevents any launch until a rule is specified","Blank Applies To leaves all employees eligible at the template level","Blank Applies To restricts eligibility to participants in prior reviews"],"answer":2,"why":"The template eligibility filter is unrestricted when left blank. Launch scope and the initiating user’s security still matter.","reference":{"title":"talent.pdf, PDF p. 130,138","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q130"},{"collection":"talent150","label":"B34"}]},{"id":"T300-131","module":"T","domain":2,"topic":"Review templates","stem":"The same annual period applies to 2,000 employees. Administrators want to avoid inconsistent dates during launch. Which setting directly reduces that risk?","options":["Populate period start and end dates on the template","Set only the scheduled launch date and leave the review period undetermined","Set the review type name to include the year","Use each worker’s most recent goal due date as the common review start"],"answer":0,"why":"Common dates on the template prepopulate the launch. A year in a display label does not supply dates.","reference":{"title":"talent.pdf, PDF p. 138","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q131"},{"collection":"talent150","label":"A09"}]},{"id":"T300-132","module":"T","domain":2,"topic":"Review templates","stem":"A reviewer wants different instructions in the Goals and Questions sections, while keeping a common introduction to the review. Where should section-specific directions go?","options":["Section help text on the individual template sections","The descriptions on the rating scale only","The template's general introductory instructions only","Business-process help text shared by every section"],"answer":0,"why":"Each section can carry its own help text independently of the review introduction and rating definitions.","reference":{"title":"talent.pdf, PDF p. 149-150","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q132"},{"collection":"talent150","label":"A38"}]},{"id":"T300-133","module":"T","domain":2,"topic":"Review templates","stem":"A review uses a dynamic start date for feedback. The review period ends March 31, but the review completes April 15. A selected feedback type is received April 10. What is the relevant end boundary?","options":["The template creation date, regardless of completion","The review completion date, so the April 10 response can fall in the range","The period end date, so all April responses are excluded","The review start date, so no later response is eligible"],"answer":1,"why":"Dynamic Start Date includes feedback from the configured lookback before the review end date through review completion.","reference":{"title":"talent.pdf, PDF p. 137","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q133"}]},{"id":"T300-134","module":"T","domain":2,"topic":"Review templates","stem":"A manager cannot see the Feedback section while performing Set Review Content, though the section is configured and secured. What should the administrator expect?","options":["Feedback is not visible in Set Content; view it during evaluation","Feedback appears in Set Content only if every question is locked","Feedback appears in Set Content only after section weights total 100","Feedback must be moved to the first section before it becomes visible"],"answer":0,"why":"The reference explicitly excludes the Feedback section from Set Content and describes viewing it in evaluation steps.","reference":{"title":"talent.pdf, PDF p. 163-164","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q134"}]},{"id":"T300-135","module":"T","domain":2,"topic":"Review templates","stem":"An acknowledgement option has been retired midway through a review cycle. HR inactivates it and asks how this affects assignees who have not yet acknowledged. What should support tell them?","options":["Only newly created reviews lose the option","Only managers lose it until employee statuses are refreshed","The option is unavailable for in-process and new reviews","It remains until every existing review is completed"],"answer":2,"why":"Inactivation removes the choice from both populations. It can be reactivated if the business later needs it.","reference":{"title":"talent.pdf, PDF p. 153-154","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q135"},{"collection":"bp200","label":"075"}]},{"id":"T300-136","module":"T","domain":2,"topic":"Review templates","stem":"An annual review has launched. HR discovers a typo in a section label and wants to add a new rating scale to the same in-use template. Which change is documented as permissible in this state?","options":["Change the calculation method","Correct the section label","Add a new rated section","Replace the rating scale"],"answer":1,"why":"Once reviews are in progress, permitted template edits are limited to descriptions, help text, and labels. Structural changes need a different plan.","reference":{"title":"talent.pdf, PDF p. 164","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q136"},{"collection":"bp200","label":"081"}]},{"id":"T300-137","module":"T","domain":2,"topic":"Review templates","stem":"A template needs 15 sections, including three distinct goal sections. Which design constraint is encountered first?","options":["There is no section limit once tenanted types are used","Only one goal section of any type is permitted","Only 10 sections are permitted if any are tenanted","The maximum is 14 sections per template"],"answer":3,"why":"Tenanted section types permit repeated functional section families, but they do not remove the total limit of 14 sections.","reference":{"title":"talent.pdf, PDF p. 129-130","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q137"}]},{"id":"T300-138","module":"T","domain":2,"topic":"Review templates","stem":"HR needs a custom second section with Career behavior. Which limitation affects the design?","options":["Tenanted section types are supported for Accomplishments, Competencies, Goals, Questions, and Responsibilities","Career sections become repeatable if the review category is Development Plan","Any delivered section can be duplicated by creating a new display label","Career sections can be duplicated only after the template is used"],"answer":0,"why":"Career is outside the five supported families for tenanted employee-review section types.","reference":{"title":"talent.pdf, PDF p. 129","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q138"}]},{"id":"T300-139","module":"T","domain":2,"topic":"Review templates","stem":"A custom label is set on a goal section within Template A. What is the intended scope of that label?","options":["Only the online review, with print always using the delivered label","Only completed reviews, with in-progress reviews using the delivered label","The section in Template A, including its online and printed review","All goal sections in all templates in the tenant"],"answer":2,"why":"The template-level label applies to that template's section in online and printed forms.","reference":{"title":"talent.pdf, PDF p. 130","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q139"}]},{"id":"T300-140","module":"T","domain":2,"topic":"Review templates","stem":"A template has fixed start and end dates. A launch administrator expects to change them during launch. Which behavior is documented?","options":["Dates defined on the template cannot be edited at launch","Dates are freely editable if the launch population is a talent pool","Only the end date is editable on every launch","The dates automatically roll forward to match the current year"],"answer":0,"why":"Template-defined review dates constrain the launch. The dates do not automatically initiate or complete the review.","reference":{"title":"talent.pdf, PDF p. 138","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q140"}]},{"id":"T300-141","module":"T","domain":2,"topic":"Review templates","stem":"A review template is inactivated during an active cycle. What happens to existing reviews and new selection?","options":["All active reviews are canceled immediately","Existing reviews pause until the template is reactivated","The template remains available for launches that reuse the same period","Existing reviews remain valid, but the template is unavailable for new reviews"],"answer":3,"why":"Inactivation prevents future selection while preserving reviews already using the template.","reference":{"title":"talent.pdf, PDF p. 138","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q141"}]},{"id":"T300-142","module":"T","domain":2,"topic":"Ratings and calculations","stem":"All items use a 1–5 scale. Goals has four ratings of 5, and Competencies has one rating of 1. With item averaging and equal item weights, what is the numeric overall rating before display rounding?","options":["4.2","3.0","4.5","4.0"],"answer":0,"why":"The five items contribute equally, so (5 + 5 + 5 + 5 + 1) ÷ 5 = 4.2. Averaging the two section means would instead give 3.0.","reference":{"title":"talent.pdf, PDF p. 136,206","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q142"},{"collection":"talent150","label":"C19"}]},{"id":"T300-143","module":"T","domain":2,"topic":"Ratings and calculations","stem":"Two equally counted items use different scales. The first is 2 on a 1–3 scale, and the second is 5 on a 1–5 scale. Overall uses 1–5. What does normalized item averaging yield?","options":["3.0","3.5","4.5","4.0"],"answer":3,"why":"The midpoint 2 on the first scale maps to 3 on the overall scale. The average of 3 and 5 is 4.","reference":{"title":"talent.pdf, PDF p. 206","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q143"},{"collection":"talent150","label":"A07"}]},{"id":"T300-144","module":"T","domain":2,"topic":"Ratings and calculations","stem":"Management wants every rated item to have the same influence, even though sections have different item counts. Which setting best delivers that result?","options":["Set every section’s first item as the section summary","Give every section identical weight and average section summaries","Calculated Rating uses Item Averaging on the Overall section","Make every item use the same label and retain manual overall ratings"],"answer":2,"why":"Item averaging counts individual ratings. Giving sections equal influence gives items in shorter sections more influence per item.","reference":{"title":"talent.pdf, PDF p. 136","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q144"},{"collection":"talent150","label":"B06"}]},{"id":"T300-145","module":"T","domain":2,"topic":"Ratings and calculations","stem":"HR wants narratives at individual competency items from managers only. Workers should still be able to complete the rest of their self-evaluations. What should be configured?","options":["Replace all competencies with feedback questions","Remove Complete Self Evaluation from the entire business process","Item Comments permissions for the Competencies section","Restrict the entire review template to the Manager security group"],"answer":2,"why":"The section’s item-comment configuration controls who comments there. Removing self-evaluation would suppress unrelated input as well.","reference":{"title":"talent.pdf, PDF p. 143-144","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q145"},{"collection":"talent150","label":"A50"}]},{"id":"T300-146","module":"T","domain":2,"topic":"Ratings and calculations","stem":"An overall rating must be a numeric value such as 3.75, entered directly rather than chosen from a list. Which configuration fits?","options":["Prompt for Overall Rating with any typed decimal accepted","Item Averaging with the employee selecting the denominator","Calculated Rating with No Overrides","Manual Entry with a value within the rating scale's bounds"],"answer":3,"why":"Manual Entry accepts values with up to two decimal places within the scale. Prompt for Overall Rating selects a defined rating.","reference":{"title":"talent.pdf, PDF p. 135","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q146"}]},{"id":"T300-147","module":"T","domain":2,"topic":"Ratings and calculations","stem":"A review contains narrative-only sections and needs an overall rating chosen from a predefined list. Which option is appropriate?","options":["Calculated Rating uses Item Averaging","Calculated Rating with No Overrides","Prompt for Overall Rating","Calculated Rating uses Section Rating Precision"],"answer":2,"why":"A prompted overall rating does not require rated contributing sections. Calculated options need rating inputs.","reference":{"title":"talent.pdf, PDF p. 135","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q147"}]},{"id":"T300-148","module":"T","domain":2,"topic":"Ratings and calculations","stem":"An administrator wants both item averaging and section rating precision on Overall. What must change?","options":["Use proficiency scales in all sections to combine both","Enable section weights before selecting both","Choose one; the two options are mutually exclusive","Remove the Overall rating scale to unlock both"],"answer":2,"why":"Item averaging and section rating precision are alternative calculation approaches and cannot both be selected.","reference":{"title":"talent.pdf, PDF p. 135-136","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q148"}]},{"id":"T300-149","module":"T","domain":2,"topic":"Ratings and calculations","stem":"Overall uses item averaging. Competencies are rated with a proficiency scale, while goals use a standard rating scale. Why do competency values not contribute as expected?","options":["Competencies contribute only after employee acknowledgment","All competencies are assigned zero weight automatically","Proficiency scales are excluded from item averaging","The scale with fewer rating levels is always excluded"],"answer":2,"why":"For competency items to participate in this calculation, the reference directs the use of a rating scale rather than a proficiency scale.","reference":{"title":"talent.pdf, PDF p. 136","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q149"}]},{"id":"T300-150","module":"T","domain":2,"topic":"Ratings and calculations","stem":"After selecting item averaging, an administrator can no longer configure Section Rated and Section Weight in other sections. Why?","options":["The template must first be assigned to a review type","The fields return when an employee has more than one rated item","Item averaging removes those section-level options","The sections must all be renamed before weights can be edited"],"answer":2,"why":"Item averaging calculates across individual rated items rather than using section summary weights.","reference":{"title":"talent.pdf, PDF p. 136","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q150"}]},{"id":"T300-151","module":"T","domain":2,"topic":"Ratings and calculations","stem":"Two goals have ratings 5 and 2 with unlimited weights 2 and 1. What is their numeric weighted section result before scale mapping?","options":["2.33","7.0","3.5","4.0"],"answer":3,"why":"Divide the weighted sum by total weight: (5 x 2 + 2 x 1) / (2 + 1) = 4.","reference":{"title":"talent.pdf, PDF p. 145,202","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q151"}]},{"id":"T300-152","module":"T","domain":2,"topic":"Ratings and calculations","stem":"Three goals have ratings 4, 3, and 2 with weights 50, 30, and 20 under Weighting Must Total 100. What is the calculated result before mapping?","options":["3.7","3.3","3.0","3.5"],"answer":1,"why":"The weighted result is 4 x 0.50 + 3 x 0.30 + 2 x 0.20 = 3.3.","reference":{"title":"talent.pdf, PDF p. 145,202","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q152"}]},{"id":"T300-153","module":"T","domain":2,"topic":"Ratings and calculations","stem":"Two equally weighted sections calculate to 3.49 and 4.49 on the same 1-5 scale. Their mapped ratings are 3 and 4. What overall numeric value results when section rating precision is enabled?","options":["3.50","3.99","4.00","4.49"],"answer":1,"why":"Precision uses the calculated section values: (3.49 + 4.49) / 2 = 3.99. Without precision, the mapped values would average to 3.50.","reference":{"title":"talent.pdf, PDF p. 135,203-205","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q153"}]},{"id":"T300-154","module":"T","domain":2,"topic":"Ratings and calculations","stem":"Managers want to change each section's weight for individual workers during evaluation. What should the administrator explain?","options":["Section weights are defined on the template, not by each reviewer","Section weights can be changed whenever item averaging is enabled","Section weights can be edited only by additional reviewers","Section weights can be changed only during employee acknowledgment"],"answer":0,"why":"Section weighting is a template configuration. It differs from item-level weighting within eligible sections.","reference":{"title":"talent.pdf, PDF p. 145","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q154"}]},{"id":"T300-155","module":"T","domain":2,"topic":"Ratings and calculations","stem":"HR selects Hide Section Weight but uses an editor other than Guided Experience. What requirement was missed?","options":["Hiding section weights is supported in Guided Experience","All section weights must be equal","The Overall section must use Manual Entry","Every item must be rated with a proficiency scale"],"answer":0,"why":"The hide-weight presentation feature is supported for the Guided Experience with the required rating configuration.","reference":{"title":"talent.pdf, PDF p. 145,202","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q155"}]},{"id":"T300-156","module":"T","domain":2,"topic":"Ratings and calculations","stem":"A rating scale already used in templates needs new labels without changing numeric meanings. Which set of fields is documented as editable?","options":["Display Order, Rating, and Description","Every field if no review is currently in progress","Rating Value, Begin Range, and End Range","Only the scale's numeric endpoints"],"answer":0,"why":"For an in-use rating scale, edits are limited to display order, rating label, and description. Such changes can affect historical display.","reference":{"title":"talent.pdf, PDF p. 147","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q156"}]},{"id":"T300-157","module":"T","domain":2,"topic":"Previous-review content","stem":"A previously completed manager review ended December 31. A new review begins January 1 and should bring forward unfinished goals from that prior review. Which method fits?","options":["Collect new feedback on the prior review","Carryover","Load Relevant Goals from outside reviews only","Consolidate"],"answer":1,"why":"Carryover uses an eligible earlier completed review whose end precedes the new period. Consolidation addresses reviews within the new period.","reference":{"title":"talent.pdf, PDF p. 173","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q157"},{"collection":"talent150","label":"B45"}]},{"id":"T300-158","module":"T","domain":2,"topic":"Previous-review content","stem":"Annual reviews should collect eligible content from completed quarterly reviews whose periods fall within the annual review period. Which option fits?","options":["Carryover from the review before the annual period","Manually add feedback providers from the quarterlies","Consolidate","Load Relevant Goals without previous-review content"],"answer":2,"why":"Consolidation combines qualifying reviews within the receiving period. Carryover selects earlier review content across the period boundary.","reference":{"title":"talent.pdf, PDF p. 174","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q158"},{"collection":"talent150","label":"B49"}]},{"id":"T300-159","module":"T","domain":2,"topic":"Previous-review content","stem":"An old review finished with a goal marked Completed and another marked In Progress. Both are otherwise eligible for goal carryover into the next review. Which transfers under standard goal carryover?","options":["Only the In Progress goal","Only the Completed goal","Neither goal because the review itself is completed","Both goals because the review itself is completed"],"answer":0,"why":"The source review must be complete, but carryover of goal items uses their individual statuses. Unfinished goals qualify.","reference":{"title":"talent.pdf, PDF p. 173","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q159"},{"collection":"talent150","label":"B40"}]},{"id":"T300-160","module":"T","domain":2,"topic":"Previous-review content","stem":"An employee’s review ends December 31 and another begins December 31. An administrator expects carryover from the first review. Which date condition is at issue?","options":["The prior goal due date must equal the new period end","The new review must end before the old review is completed","The two review periods must have identical start dates","The prior review must end before the new review begins"],"answer":3,"why":"Sharing a boundary date is not the same as ending earlier. Check the period relationship as well as completion and section type.","reference":{"title":"talent.pdf, PDF p. 173","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q160"},{"collection":"talent150","label":"C45"}]},{"id":"T300-161","module":"T","domain":2,"topic":"Previous-review content","stem":"Two prior reviews qualify for carryover into a new review. HR expects content combined from both. What does carryover select?","options":["The earliest eligible review with a matching label","Every eligible completed review regardless of category","Every in-progress review with the same manager","The most recent eligible completed review in the same category"],"answer":3,"why":"Carryover selects the most recent eligible completed review. Combining content from qualifying reviews within a period is consolidation.","reference":{"title":"talent.pdf, PDF p. 173","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q161"}]},{"id":"T300-162","module":"T","domain":2,"topic":"Previous-review content","stem":"A competency exists only because it was pulled from the position into an earlier review. It is absent from the explicit template competency list. Why might carryover not transfer it?","options":["The competency must have the same display position in both reviews","Carryover transfers only competencies with a rating above target","Competency carryover applies to template-defined items, not position-pulled competencies","All competencies are excluded from carryover"],"answer":2,"why":"The competency carryover rules distinguish template-defined competencies from those sourced from the position.","reference":{"title":"talent.pdf, PDF p. 173","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q162"}]},{"id":"T300-163","module":"T","domain":2,"topic":"Previous-review content","stem":"A receiving review changes a competency from an ordinary rating scale to a proficiency scale. Which carryover expectation is correct?","options":["Eligible items and comments can transfer, but the incompatible ratings do not","Every old rating transfers if both scales have five labels","The old numeric rating automatically becomes the new target proficiency","Ratings transfer and comments are discarded"],"answer":0,"why":"The source and destination rating method and scale affect rating compatibility. Item or comment transfer does not guarantee rating transfer.","reference":{"title":"talent.pdf, PDF p. 173","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q163"}]},{"id":"T300-164","module":"T","domain":2,"topic":"Previous-review content","stem":"A completed quarterly review starts before the annual review's start date but ends inside the annual period. Will its content qualify for consolidation on dates alone?","options":["No; both source start and end must fall within or equal the receiving period","No; consolidation requires the source period to end before the receiving period starts","Yes; any overlap makes the review eligible","Yes; only the source end date matters"],"answer":0,"why":"Consolidation requires the completed source review's full period to lie within the receiving review period.","reference":{"title":"talent.pdf, PDF p. 174","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q164"}]},{"id":"T300-165","module":"T","domain":2,"topic":"Previous-review content","stem":"A completed goal appears in a qualifying quarterly review. HR wants the annual consolidation to include that goal and its prior goal comments. Which result is documented?","options":["The completed goal may transfer, but its goal comments do not","Neither can transfer because only unfinished goals consolidate","Only its comments transfer because the goal is completed","Both the goal and all goal comments always transfer"],"answer":0,"why":"Consolidation supports completed goals, unlike standard unfinished-goal carryover, but does not bring goal comments forward.","reference":{"title":"talent.pdf, PDF p. 174","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q165"}]},{"id":"T300-166","module":"T","domain":2,"topic":"Previous-review content","stem":"The same goal was updated across several qualifying completed reviews during the year. Which version does consolidation use?","options":["The version with the highest numeric rating","A separate independent copy from every review","The latest version of the goal","The earliest version of the goal"],"answer":2,"why":"Consolidation uses the latest goal version rather than duplicating every historic occurrence.","reference":{"title":"talent.pdf, PDF p. 174","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q166"}]},{"id":"T300-167","module":"T","domain":2,"topic":"Goal loading","stem":"An employee has an eligible goal created outside a review and wants it to appear automatically when content is set. Which option should be used?","options":["Consolidate previous review evaluations only","Load Relevant Goals","Carryover from a previous completed review only","Allow User to Add Existing Goals Manually only"],"answer":1,"why":"Automatic loading of eligible goals created outside the review is distinct from manual selection or transfer of prior-review content.","reference":{"title":"talent.pdf, PDF p. 141,175","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q167"},{"collection":"talent150","label":"A13"}]},{"id":"T300-168","module":"T","domain":2,"topic":"Goal loading","stem":"Some existing goals are eligible but should be pulled in only when their category is Operational. What change targets the selection rule rather than the scoring?","options":["Rename the Goals section Operational without changing the filter","Raise the overall rating threshold for Operational goals","Change the numerical weight of all Operational goals","Filter relevant goals by category or a matching goal template rule"],"answer":3,"why":"The load filter selects which goals enter the section. Weights and rating thresholds apply after content selection.","reference":{"title":"talent.pdf, PDF p. 141,175","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q168"},{"collection":"talent150","label":"B10"}]},{"id":"T300-169","module":"T","domain":2,"topic":"Goal loading","stem":"A goal is associated with another in-progress review. Its due date falls in the new review period, but Load Relevant Goals omits it. Which condition explains this?","options":["Selecting a different category always releases the goal from the active review","Automatic relevant-goal loading excludes goals associated with another in-progress review","A date in range overrides every existing review association","Only an archived goal can be loaded into a second active review"],"answer":1,"why":"The attachment excludes goals in the current or another in-progress review. Do not interpret this as a blanket exclusion of every goal that has ever appeared in a completed review.","reference":{"title":"talent.pdf, PDF p. 175","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q169"},{"collection":"talent150","label":"C14"}],"updated":true},{"id":"T300-170","module":"T","domain":2,"topic":"Goal loading","stem":"A goal has no due date. It was created during the review period, and all other automatic-loading requirements are met. How is its date eligibility determined?","options":["By the goal template’s most recent edit date","By the employee’s hire date within the review period","By the date the manager opens acknowledgment","By its creation date within the review period"],"answer":3,"why":"When a due date is absent, Workday can use the goal’s creation date to determine whether it falls in the period.","reference":{"title":"talent.pdf, PDF p. 175","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q170"},{"collection":"talent150","label":"A14"}]},{"id":"T300-171","module":"T","domain":2,"topic":"Goal loading","stem":"One eligible goal matches two goal sections in an employee review. What determines where automatic loading places it?","options":["It loads into every matching section as on the ad hoc goal display","The section with the later due date always receives it","The order of the goal sections; it loads into only one section","The section with the higher weight always receives it"],"answer":2,"why":"Review loading assigns a goal to one section, resolving multiple matches by section order.","reference":{"title":"talent.pdf, PDF p. 175","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q171"}]},{"id":"T300-172","module":"T","domain":2,"topic":"Goal loading","stem":"A template uses carryover and also Load Relevant Goals with a category filter. HR expects the filter to remove carried-over goals in another category. What is the processing distinction?","options":["Only one of the two loading methods can be enabled","Previous-review content loads first; relevant-goal selection applies to the additional loading step","Relevant goals load first and carryover silently deletes nonmatches","The relevant-goal filter always replaces all carried-over content"],"answer":1,"why":"Carryover or consolidation is processed before loading relevant goals. Do not treat the relevant-goal rule as a global filter on all transferred content.","reference":{"title":"talent.pdf, PDF p. 175","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q172"}]},{"id":"T300-173","module":"T","domain":2,"topic":"Goal loading","stem":"A goal is unarchived and has a due date in the review period, but is mapped to Not Applicable. Will the date alone make it eligible for Load Relevant Goals?","options":["No; only goals created on the first day can load","Yes; but only if the goal has no organization alignment","Yes; all in-period goals load regardless of status","No; Not Applicable goals are excluded"],"answer":3,"why":"Date eligibility is one condition. Status, archive state, and existing in-progress review associations also matter.","reference":{"title":"talent.pdf, PDF p. 175","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q173"}]},{"id":"T300-174","module":"T","domain":2,"topic":"Review printing","stem":"An employee review printout omits the Supporting Documents section, even though the online review shows attachments and section comments. What is the documented behavior?","options":["Print the attached documents separately; that section is excluded from the review PDF","Enable item averaging to include attachments in print","Move Supporting Documents before Overall to include it","Make the section employee-editable to force PDF inclusion"],"answer":0,"why":"The employee-review PDF excludes Supporting Documents. Individual attached documents can be printed separately.","reference":{"title":"talent.pdf, PDF p. 169-170","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q174"}]},{"id":"T300-175","module":"T","domain":2,"topic":"Calibration","stem":"A review template and its linked calibration program have different eligibility rules. They start together. Which rules determine the population in this integrated launch?","options":["The review template’s eligibility rules and dates","The calibration program’s rules in all cases","Only workers plotted before the review started","The intersection of managers who previously calibrated together"],"answer":0,"why":"When the review launches calibration for the same population, review eligibility takes precedence over the calibration rules.","reference":{"title":"talent.pdf, PDF p. 232","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q175"},{"collection":"talent150","label":"A24"}]},{"id":"T300-176","module":"T","domain":2,"topic":"Calibration","stem":"A manager evaluation has finished, but HR does not want managers receiving a review-on-hold task while calibration continues. Which sequence best fits?","options":["Place Await Calibration Completion before the step that updates performance-review ratings","Add employee acknowledgment before the calibration program launches","Send the rating-update task before waiting for calibration","Remove calibration participation and keep the review on hold manually"],"answer":0,"why":"The service step waits for final calibration before the manager’s rating-update task is issued.","reference":{"title":"talent.pdf, PDF p. 231","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q176"},{"collection":"talent150","label":"B24"}]},{"id":"T300-177","module":"T","domain":2,"topic":"Calibration","stem":"Participants are being asked to plot workers before all managers finish their initial evaluations. Where should a gate be placed?","options":["A To Do after the final employee acknowledgment","A To Do before Shared Participation on the calibration process","A service step after calibrated ratings are written back","A To Do on Launch Calibration after participants finish plotting"],"answer":1,"why":"The calibration-side gate allows initial ratings to be ready before participants start plotting.","reference":{"title":"talent.pdf, PDF p. 231","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q177"},{"collection":"talent150","label":"A31"}]},{"id":"T300-178","module":"T","domain":2,"topic":"Calibration","stem":"Calibration ended and the nBox contains revised placements, but managers have no task to reflect the calibrated rating in the review. What should be inspected?","options":["The source-value mappings that controlled initial worker placement","The filters determining which workers enter the calibration population","The participants authorized to plot workers in the calibration nBox","Update Performance Review Ratings for Manager Evaluation in the manager-evaluation process"],"answer":3,"why":"Finishing calibration does not replace the review-side step that exposes the calibrated rating for manager action.","reference":{"title":"talent.pdf, PDF p. 231","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q178"},{"collection":"talent150","label":"B42"}]},{"id":"T300-179","module":"T","domain":2,"topic":"Calibration","stem":"A custom calibration matrix runs as a report, but the calibration Inbox cannot scope it to the appropriate organization node. Which report prompt is essential?","options":["Calibration Node for nBox","Talent Pool Membership","Employee Review Template","Supervisory Organization without the calibration-node context"],"answer":0,"why":"The calibration node prompt supplies the organization context used with the report filters when participants open the task.","reference":{"title":"talent.pdf, PDF p. 214-215","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q179"},{"collection":"talent150","label":"A21"}]},{"id":"T300-180","module":"T","domain":2,"topic":"Calibration","stem":"A new nBox report must read live placements while managers are calibrating. Which data source matches that use?","options":["Employee Review Events without in-progress placement data","Workers for HCM Reporting with only completed review ratings","Completed Worker Calibration Placements only","Indexed In Progress Worker Calibration Placements"],"answer":3,"why":"Calibration requires in-progress placement data. Completed reviews and pool membership cannot supply the live coordinates.","reference":{"title":"talent.pdf, PDF p. 214","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q180"},{"collection":"talent150","label":"C43"}]},{"id":"T300-181","module":"T","domain":2,"topic":"Calibration","stem":"A calibration matrix opens with every worker unplotted although eligible workers are present and ratings exist. What should be inspected first?","options":["The approval group for the final calibration submission","The action that copies final ratings back to the manager evaluation","The help text configured for initially unplotted workers","Calibration value mappings between source ratings and box values"],"answer":3,"why":"Source-value mappings provide the initial placements. Populating the worker list alone does not define their coordinates.","reference":{"title":"talent.pdf, PDF p. 220","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q181"},{"collection":"talent150","label":"B27"}]},{"id":"T300-182","module":"T","domain":2,"topic":"Calibration","stem":"A director sees indirect reports greyed out in an organization-hierarchy calibration. Their direct managers have not plotted and submitted yet. What should happen next?","options":["The director should edit the manager evaluations to override the outstanding lower-level participation","The controller should finalize the placements before lower-level plotting begins","The director should close the entire calibration before editing indirect reports","The lower-level managers plot and submit before the director adjusts those workers"],"answer":3,"why":"Hierarchy participation proceeds upward. Visibility of indirect reports can precede the authority to adjust their placements.","reference":{"title":"talent.pdf, PDF p. 224-225","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q182"},{"collection":"talent150","label":"B18"}]},{"id":"T300-183","module":"T","domain":2,"topic":"Calibration","stem":"The team wants HR partners and managers to participate in an organization’s calibration without each action completing the whole process. Which configuration is appropriate?","options":["A single unconditional approval routed to each employee","A Shared Participation step with participation configured for the intended groups","A feedback request attached to the rating scale","A manager acknowledgment as the first step of the review"],"answer":1,"why":"Shared participation defines who works within calibration. A normal approval does not implement that participation model.","reference":{"title":"talent.pdf, PDF p. 222-223","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q183"},{"collection":"talent150","label":"C29"}]},{"id":"T300-184","module":"T","domain":2,"topic":"Calibration","stem":"A program launched for talent calibration should compare workers on configurable dimensions. A later initiative must write calibrated overall ratings back to performance reviews. Which design addresses the latter specifically?","options":["Export the talent matrix to a feedback template before closing it","Use performance reviews integrated with calibration and the manager-evaluation rating-update step","Create a second talent review without a performance review event","Reuse any stand-alone talent calibration and expect all employee reviews to update"],"answer":1,"why":"Rating writeback relies on an integrated performance-review event and its step. A stand-alone calibration exercise does not supply that review workflow.","reference":{"title":"talent.pdf, PDF p. 231-234","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q184"},{"collection":"talent150","label":"B17"}]},{"id":"T300-185","module":"T","domain":2,"topic":"Calibration","stem":"During calibration, a manager adjusts a rating. The process is configured to skip the review update only when calibrated and overall ratings match. What should happen for this changed rating once calibration is final?","options":["A new performance review must launch to use the change","The employee’s self-rating should be overwritten before manager review","The update step should skip because calibration is complete","The update step should run for the changed rating"],"answer":3,"why":"The entry condition compares ratings. A changed result fails the equality test for skipping and can therefore receive manager follow-up.","reference":{"title":"talent.pdf, PDF p. 231","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q185"},{"collection":"talent150","label":"A12"}]},{"id":"T300-186","module":"T","domain":2,"topic":"Calibration","stem":"All line managers submitted their placements. The controller has not submitted the overall event. The Await Calibration Completion service still shows In Progress. What should the test team conclude?","options":["The wait is consistent with the overall event still being open","The service must be moved to employee self-evaluation","The service should have finished at the first manager submission","Every placement must be reentered as a performance review correction"],"answer":0,"why":"A valid release test submits the entire calibration event. A manager's submission alone is insufficient.","reference":{"title":"talent.pdf, PDF p. 231-234","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q186"},{"collection":"bp200","label":"156"}]},{"id":"T300-187","module":"T","domain":2,"topic":"Calibration","stem":"A manager cannot complete Calibrate Team and wants to delegate the Inbox task. HR has a qualified facilitator available. What is the supported alternative?","options":["Reassign the primary manager evaluation while leaving the calibration detail untouched","Use Facilitate Calibration to act on the manager's behalf","Set an alternate recipient on the original performance review approval only","Delegate Calibrate Team directly through ordinary task delegation"],"answer":1,"why":"Workday does not support delegation of Calibrate Team. Facilitation is the documented way to assist with in-progress calibration.","reference":{"title":"talent.pdf, PDF p. 227-228","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q187"},{"collection":"bp200","label":"167"}]},{"id":"T300-188","module":"T","domain":2,"topic":"Calibration","stem":"A worker is removed ad hoc from combined calibration while their linked performance review is in progress. HR also needs to stop that review. What additional action is required?","options":["Delete the worker's potential value to end the review","Wait for removal to automatically reverse the review","Rescind every review in the same nBox cell","Manually cancel the in-progress review"],"answer":3,"why":"Removing the worker from calibration does not automatically stop their linked in-progress review; the reference requires cancellation.","reference":{"title":"talent.pdf, PDF p. 227","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q188"},{"collection":"bp200","label":"171"}],"updated":true},{"id":"T300-189","module":"T","domain":2,"topic":"Calibration","stem":"The business authorizes releasing held reviews before all calibration work is finished. Which task is designed for that intervention?","options":["Resume Employee Reviews On Hold","Start Performance Review for Organization again","Complete On Behalf Of for the controller's approval","Manual Send Back on every employee self-evaluation"],"answer":0,"why":"The administrator can resume the selected organization's held review events before final calibration completion.","reference":{"title":"talent.pdf, PDF p. 233","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q189"},{"collection":"bp200","label":"173"}]},{"id":"T300-190","module":"T","domain":2,"topic":"Calibration","stem":"A calibration administrator enters a due date and expects the event to close automatically on that date. What is the actual purpose of the date?","options":["It cancels unplotted workers at midnight","It freezes the nBox and completes the controller step","It automatically submits every manager's placements","It can support query alerts; it does not end the event"],"answer":3,"why":"The calibration due date supports notification timing, not automatic process completion.","reference":{"title":"talent.pdf, PDF p. 219-220","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q190"}]},{"id":"T300-191","module":"T","domain":2,"topic":"Calibration","stem":"HR wants a meeting to start with all eligible workers unplotted so facilitators place them during discussion. Which setup supports that?","options":["Set every worker's current rating to Not Applicable","Configure target percentages to zero for every box","Remove all eligibility rules and organizations","Leave Calibration Value Mapping blank"],"answer":3,"why":"Initial placement
