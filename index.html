s":[{"collection":"bp200","label":"086"}]},{"id":"BP-087","module":"T","domain":2,"topic":"Performance review stages and actions","stem":"The Feedback section is on the template. The manager sees no Feedback section during Set Content and reports a routing defect. What should HR check next?","options":["Add an alternate manager to Set Content","Give the employee View Completed Only on the parent","Turn the Set Content step into a feedback request","Look for feedback during evaluation, where it is displayed"],"answer":3,"why":"Feedback is absent from Set Content by design. Its presence in evaluation is the relevant test.","reference":{"title":"Start Employee Reviews","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/dan1370796677653.html?toc=7.7.1"},"sample":0,"memberships":[{"collection":"bp200","label":"087"}]},{"id":"BP-097","module":"T","domain":2,"topic":"Performance review stages and actions","stem":"The PIP team asks for the same manager pull-forward control used in annual reviews. The roles and the order of steps look identical. Which answer should HR give?","options":["PIPs gain it whenever their employee plan step immediately precedes the manager plan","PIPs gain it when Employee as Self has View All on the process","PIPs gain it when the manager can initiate the employee's plan","That employee-review management feature is available for performance reviews only"],"answer":3,"why":"Matching the sequence does not change the category restriction on manager send back and pull forward.","reference":{"title":"Steps: Enable Sending Back or Pulling Forward Performance Reviews","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/performance-reviews/klz1596489762712.html"},"sample":0,"memberships":[{"collection":"bp200","label":"097"}]},{"id":"BP-099","module":"T","domain":2,"topic":"Performance review stages and actions","stem":"A restricted review hides every section from employees, yet they still receive a blank task notification. What would prevent routing this step when no editable sections exist?","options":["Use an Includes Editable Sections condition on the employee step","Set a three-day delay on the employee task","Change only the template's display label","Select View Completed Only for all managers"],"answer":0,"why":"Routing Employee as Self to a step can produce a blank notification. The condition checks whether there is work for that participant.","reference":{"title":"Start Employee Reviews","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/dan1370796677653.html?toc=7.7.1"},"sample":0,"memberships":[{"collection":"bp200","label":"099"}]},{"id":"BP-101","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"HR wants new hires to update their talent profiles as part of onboarding. It needs the formal talent review event and its own workflow. How should it connect the processes?","options":["Launch Start Performance Review with a career section as an onboarding subprocess","Rename an onboarding To Do to Talent Review and leave it unlinked","Use onboarding to trigger an independent skill update instead of a talent review","Include Start Talent Review as a subprocess of Onboarding"],"answer":3,"why":"Launching the supported subprocess creates the talent review transaction. A similarly named To Do would only ask someone to perform work.","reference":{"title":"Populating Worker Talent Data","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/populating-worker-talent-data.html"},"sample":0,"memberships":[{"collection":"bp200","label":"101"}]},{"id":"BP-102","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"An employee should update their career information before the manager reviews it. HR wants to sign off after the manager has completed their part. Which definition and sequence fit?","options":["Assess My Team's Potential followed by an HR To Do","Talent Review with worker profile update, manager work, then HR approval","Start Performance Review with HR approval before employee self-evaluation","Talent Review with HR approval, then manager work, then profile update"],"answer":1,"why":"The talent review can route from employee to manager and add a subsequent HR approval. The sequence matters because HR must see the manager's completed input.","reference":{"title":"Populating Worker Talent Data","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/populating-worker-talent-data.html"},"sample":0,"memberships":[{"collection":"bp200","label":"102"}]},{"id":"BP-103","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"A department launches talent reviews for 32 workers. Four already have one in progress. The other 28 meet the eligibility rule. How many new reviews start?","options":["0","32","28","4"],"answer":2,"why":"Only one talent review may be in progress for a worker. Ineligible members are skipped individually instead of blocking the organization launch.","reference":{"title":"Start Talent Reviews","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-reviews/dan1370796673224.html?toc=7.6.3"},"sample":0,"memberships":[{"collection":"bp200","label":"103"}]},{"id":"BP-104","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"HR wants to launch a talent review directly for a named pool. The target is currently a dynamic pool driven by worker attributes. Which approach is supported for the pool launch?","options":["Select the dynamic pool after applying the same eligibility rule on the review template","Select the dynamic pool directly as long as it is private","Add the dynamic pool's members as approvers on the talent review definition","Use an appropriate static talent pool as the launch population"],"answer":3,"why":"Direct talent-review pool launches support static pools. Pool visibility and approval order do not change the population types the task accepts.","reference":{"title":"Start Talent Reviews","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-reviews/dan1370796673224.html?toc=7.6.3"},"sample":0,"memberships":[{"collection":"bp200","label":"104"}]},{"id":"BP-105","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"HR launches talent reviews for a parent supervisory organization. It wants eligible workers in child organizations included too. Which launch choice should be verified?","options":["Use Default Alternate","Include additional position managers","Display Additional Manager Names","Include subordinate organizations"],"answer":3,"why":"The choice expands the organization population before worker-level eligibility is applied. Manager and delegate settings affect task routing.","reference":{"title":"Start Talent Reviews","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-reviews/dan1370796673224.html?toc=7.6.3"},"sample":0,"memberships":[{"collection":"bp200","label":"105"}]},{"id":"BP-106","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"HR is chasing eight late annual reviews. The coordinator has the cohort and template. They need to know who has the next action on each review. Which report specifically lists that information?","options":["Employee Reviews","Talent Review Status Summary","Average Performance Rating by Supervisory Organization","Employee Review Ratings"],"answer":0,"why":"Employee Reviews lists a review's overall status and the person responsible for its next response. Rating distributions and talent review summaries answer different questions.","reference":{"title":"Concept: Track Employee Reviews","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/dan1370796677324.html"},"sample":0,"memberships":[{"collection":"bp200","label":"106"}]},{"id":"BP-107","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"A worker and manager have both completed their parts of a talent review. Only senior-level cases should now receive HR sign-off. Which configuration meets that policy while preserving the standard flow for others?","options":["Add an HR approval before the worker update with the same entry condition","Grant HR view access to every section and remove the approval step","Limit initiation to senior-level workers and add an unconditional HR approval","Add an HR approval after manager input with an entry condition for senior-level cases"],"answer":3,"why":"The review population stays intact. A condition on the later HR step targets only the cases requiring sign-off after the manager's input.","reference":{"title":"Populating Worker Talent Data","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/populating-worker-talent-data.html"},"sample":0,"memberships":[{"collection":"bp200","label":"107"}]},{"id":"BP-108","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"A manager understands how to approve a talent review but wants the employee to supply missing information while keeping the event alive. Which action fits?","options":["Deny","Rescind","Send Back","Approve now and request an independent worker-profile change afterward"],"answer":2,"why":"Send Back returns work for revision. Deny ends the event, and rescind addresses a completed transaction.","reference":{"title":"Start Talent Reviews","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-reviews/dan1370796673224.html?toc=7.6.3"},"sample":0,"memberships":[{"collection":"bp200","label":"108"}]},{"id":"BP-113","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"The worker's profile contains completed experience records before launch. HR expects a blank talent review so the worker can start over. Which behavior should they anticipate?","options":["Completed profile data is pulled into the review at launch","Historical data is pulled only after the worker submits","Profile data is loaded only if a manager manually advances the event","Only information from the last performance evaluation is pulled in"],"answer":0,"why":"The worker starts with relevant completed profile information. Approval later sends updates in the other direction.","reference":{"title":"FAQ: Talent Reviews","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-reviews/uqx1502723998855.html?toc=7.6.9"},"sample":0,"memberships":[{"collection":"bp200","label":"113"}]},{"id":"BP-114","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"A talent partner can start a review but cannot edit a specific section. Another role can edit that section. Which configuration should HR compare first?","options":["The launch population's review dates","Security policy for the relevant talent review section subdomain","The primary manager's position routing modifier","The order of the feedback template questions"],"answer":1,"why":"BP access can allow the launch while section-level domain permissions still limit what a role can view or edit.","reference":{"title":"Start Talent Reviews","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-reviews/dan1370796673224.html?toc=7.6.3"},"sample":0,"memberships":[{"collection":"bp200","label":"114"}]},{"id":"BP-118","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"An analyst can run a custom review report, but Last Review - Overall Rating and Review - Last Completed are blank for workers within the analyst's authorized reporting scope. Which access combination should be checked?","options":["Template setup access plus permission to initiate only an organization launch","View access to the manager acknowledgement status and to the calibration program","Worker Data: Employee Reviews plus Start Performance Review and Complete Manager Evaluation BP access","The Review Component data source plus HR membership in the worker's talent pool"],"answer":2,"why":"Review reporting can require both domain access and access to the parent and evaluation business processes. Permission to open a report alone is insufficient.","reference":{"title":"Concept: Track Employee Reviews","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/dan1370796677324.html"},"sample":0,"memberships":[{"collection":"bp200","label":"118"}]},{"id":"BP-120","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"Only one worker in a correctly launched talent-review cohort was included by mistake. Their personal talent review is still In Progress. What is the narrowly scoped action?","options":["Cancel that individual's review from their talent cards","Rescind the worker's completed talent review","Manually advance the worker to completion","Rescind the whole organization launch"],"answer":0,"why":"The relevant target is the individual in-progress event. Canceling it preserves the intended reviews for the rest of the cohort.","reference":{"title":"Start Talent Reviews","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-reviews/dan1370796673224.html?toc=7.6.3"},"sample":0,"memberships":[{"collection":"bp200","label":"120"}]},{"id":"BP-122","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"A talent review is stalled. An administrator can view the event but cannot advance it manually. Where must the appropriate permission be granted?","options":["Edit on the applicable talent pool only","The additional manager evaluations domain","Manual Advance on the Talent Review BP security policy","View All on the Start Performance Review policy only"],"answer":2,"why":"Manual Advance is an action on this specific BP policy. Seeing the event or the population does not confer that action.","reference":{"title":"Start Talent Reviews","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-reviews/dan1370796673224.html?toc=7.6.3"},"sample":0,"memberships":[{"collection":"bp200","label":"122"}]},{"id":"BP-123","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"Jules manually advances a talent review. The event later returns to Update My Talent Profile through send-back. Who receives that step in this case?","options":["The worker's midpoint manager","Jules, the administrator who advanced it","The talent pool owner","The original employee in every case"],"answer":1,"why":"The documented send-back behavior after manual advance assigns this step to the advancing administrator. This explains an apparently unexpected task owner.","reference":{"title":"Start Talent Reviews","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-reviews/dan1370796673224.html?toc=7.6.3"},"sample":0,"memberships":[{"collection":"bp200","label":"123"}]},{"id":"BP-125","module":"T","domain":3,"topic":"Talent review transactions and security","stem":"A simultaneous organization talent review and calibration produce a different population from the calibration program's usual stand-alone population. Both configurations are valid. What drives eligibility here?","options":["Only workers in the last performance-review mass launch","The dates and eligibility rules of the talent review template","Everyone assigned the Calibrate Team security group","The calibration program rules alone"],"answer":1,"why":"A combined talent review uses review-template eligibility for its shared population. Stand-alone calibration criteria need not produce the same group.","reference":{"title":"FAQ: Talent Reviews","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-reviews/uqx1502723998855.html?toc=7.6.9"},"sample":0,"memberships":[{"collection":"bp200","label":"125"}]},{"id":"BP-126","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"One annual review was opened for the wrong person and is still in progress. The person who started it wants to stop it completely. Which action fits?","options":["Correct the manager's completed evaluation","Cancel the in-progress performance review","Send the review back to self-evaluation","Rescind the annual template"],"answer":1,"why":"Cancel ends the unfinished review. Send-back keeps it alive, and changing or correcting a rating would not remove the erroneous review.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"126"}]},{"id":"BP-127","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"An HR partner expects to cancel a single in-progress performance review that another administrator started. Under the course manual's individual cancellation rule, who can cancel it?","options":["Any worker configured as an alternate delegate","Any user who can view the current step","The person who started the performance review","Any additional manager named in the review"],"answer":2,"why":"For an individual in-progress performance review, the manual specifies its starter. Bulk administration and rescinding completed events have separate rules.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"127"}]},{"id":"BP-128","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"Fourteen performance review events from a pilot are in progress. Eight more have passed completion. All were initiated in error and must be reversed. How should HR divide the work?","options":["Correct the 14 in-progress events and advance the eight completed ones","Cancel the 14 in-progress events and rescind the eight completed ones","Cancel all 22 because some workers still have tasks","Rescind all 22 because the launch date is past"],"answer":1,"why":"Choose the reversal action from each target event's status. A single pilot launch can produce individual events in different states.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"128"}]},{"id":"BP-129","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"The transaction says Successfully Completed although a follow-up To Do is still awaiting action. HR wants to reverse the whole committed transaction. What should it check for?","options":["Deny on the final To Do as the only parent reversal","Send Back on the initial launch notification","Rescind on the completed event","Cancel on the parent because the To Do is open"],"answer":2,"why":"The designated completion step commits the parent. An outstanding post-completion task does not return the parent to In Progress.","reference":{"title":"Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/hcm-core-for-administrators/business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"129"}]},{"id":"BP-130","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"A completed annual review is valid except for a mistyped manager rating. HR wants to fix the rating with minimum disruption and is authorized to correct it. Which event should it target?","options":["The overall template configuration, changing the scale for subsequent reviews","The Manager Evaluation step in the full process record, using Correct","The employee's Self Evaluation step using Correct","The entire review using Rescind"],"answer":1,"why":"Evaluation content is corrected on the relevant evaluation subprocess. The manager's rating belongs to the manager evaluation.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"130"}]},{"id":"BP-131","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"An authorized analyst can correct a manager's evaluation but cannot correct a transcription error in the employee's self-evaluation. Which additional permission is relevant?","options":["View on the calibration program","Ad Hoc Approve on Complete Manager Evaluation","Correct on Complete Self Evaluation for Performance Review","Rescind on Start Performance Review only"],"answer":2,"why":"Correction is secured on the applicable evaluation BP. Manager and self-evaluation permissions are separately configurable.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"131"}]},{"id":"BP-132","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"An approver denies a supported review subprocess before the parent's completion step. Both levels were still in progress. What happens?","options":["The child is skipped and the parent is marked Successfully Completed","Both return to their initiators for editing","The child and the parent end","Only the child ends and the parent continues automatically"],"answer":2,"why":"Denial before the parent's completion step terminates both. This is more consequential than sending data back for revision.","reference":{"title":"Reference: Actions Available on Business Processes","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/mee1553714361673.html?toc=6.0.11"},"sample":0,"memberships":[{"collection":"bp200","label":"132"}]},{"id":"BP-133","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"On a supported post-completion subprocess, an approver selects Deny. The parent has already passed its completion step. What is the documented effect?","options":["The subprocess ends while the parent continues","The parent and subprocess are both rescinded","The parent returns to its completion approval","All earlier sibling subprocesses are reopened"],"answer":0,"why":"The parent's completion boundary changes denial behavior. A post-completion child denial does not reverse the committed parent.","reference":{"title":"Reference: Actions Available on Business Processes","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/mee1553714361673.html?toc=6.0.11"},"sample":0,"memberships":[{"collection":"bp200","label":"133"}]},{"id":"BP-134","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"An optional child event supports independent cancellation. HR wants to abandon only this outstanding child and keep the rest of the review moving. Which event should it target?","options":["The parent completion step with Deny","The prior completed evaluation with Rescind","The child event itself with Cancel","The overall parent with Cancel"],"answer":2,"why":"For types supporting independent cancellation, canceling the child skips that work. Canceling the overall parent has a wider impact.","reference":{"title":"Concept: Business Process Management","url":"https://stage.doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/ikj1637605088663.html"},"sample":0,"memberships":[{"collection":"bp200","label":"134"}]},{"id":"BP-135","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"An erroneous completed review called other processes as actions. HR plans to rescind the parent and retain the effects of all those called actions. What must it account for?","options":["Rescinding the parent also rescinds processes it called as actions","Only stand-alone processes from the same day are reversed","The parent is hidden but all transactional changes persist","Child actions persist unless their assignees approve the rescind"],"answer":0,"why":"Rescind reverses the completed event and its action-called processes. Inspect the full process record before selecting the target.","reference":{"title":"Reference: Actions Available on Business Processes","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/mee1553714361673.html?toc=6.0.11"},"sample":0,"memberships":[{"collection":"bp200","label":"135"}]},{"id":"BP-136","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"HR has an in-progress parent with some completed child events. It chooses to cancel the whole parent rather than a single child. What should it expect?","options":["The parent is canceled but every child becomes a stand-alone review","Each child returns to its original initiator for approval","Only unfinished children are affected and completed children always remain valid","The parent's subprocesses are skipped and completed subprocesses canceled"],"answer":3,"why":"Canceling the overall process acts across its subprocesses. Selecting a cancelable child independently has a narrower effect.","reference":{"title":"Concept: Business Process Management","url":"https://stage.doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/ikj1637605088663.html"},"sample":0,"memberships":[{"collection":"bp200","label":"136"}]},{"id":"BP-137","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"A reviewer finds a fixable omission. They have both Deny and Send Back, and the requester should revise without restarting the transaction. Which action fits?","options":["Cancel","Send Back","Rescind","Deny"],"answer":1,"why":"Send Back keeps the event available for revision. A denial would end the event and require a new submission.","reference":{"title":"Reference: Actions Available on Business Processes","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/mee1553714361673.html?toc=6.0.11"},"sample":0,"memberships":[{"collection":"bp200","label":"137"}]},{"id":"BP-138","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"A review approval needs an additional authorized HR specialist for this one event. The BP supports ad hoc approval. What other configuration determines who can be added?","options":["The Ad Hoc Approve action on the BP security policy","The specialist's permission to edit a template label","The presence of a prior-approver exclusion on the review","Delegation permission on the initiator’s management chain"],"answer":0,"why":"The selectable users belong to groups authorized for Ad Hoc Approve in the event's context. Merely viewing review data is insufficient.","reference":{"title":"Reference: Actions Available on Business Processes","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/mee1553714361673.html?toc=6.0.11"},"sample":0,"memberships":[{"collection":"bp200","label":"138"}]},{"id":"BP-139","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"An approver can add ad hoc approvers on a normal approval, but the option is absent on a review-related Approval Chain. The same role is acting. Why?","options":["Ad Hoc Approve can be granted on an Action but never on any Approval","A chain accepts ad hoc approvers only if the chain is the declared completion step","Add Approvers is unavailable on Approval Chain and Consolidated Approval Chain steps","The initiator must add all ad hoc approvers before any approval can start"],"answer":2,"why":"Ad hoc approval support depends on step type as well as policy. Permission alone cannot make this option appear on a chain.","reference":{"title":"Reference: Actions Available on Business Processes","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/business-process-framework-concepts/mee1553714361673.html?toc=6.0.11"},"sample":0,"memberships":[{"collection":"bp200","label":"139"}]},{"id":"BP-140","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"An annual cohort must advance despite an unavailable assignee, but the administrator is authorized for a different BP type only. What limits the mass advance?","options":["Whether all reviews use the same template label","The administrator's ability to see every worker's name","Whether the administrator once initiated any annual review","The Manual Advance permissions for the BP types the group is allowed to process"],"answer":3,"why":"Access to launch the task does not authorize every transaction type. The relevant BP policy still governs the events it can process.","reference":{"title":"Concept: Business Process Management","url":"https://stage.doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/ikj1637605088663.html"},"sample":0,"memberships":[{"collection":"bp200","label":"140"}]},{"id":"BP-141","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"A batch of eligible review approvals has parallel steps. HR uses Mass Operation Management to advance one step. No parallel step is marked Do Not Advance. What must HR expect?","options":["The parallel steps also advance","The parent is rescinded and parallel steps are canceled","All parallel steps remain awaiting action until manually selected","Only the step with the earliest due date advances"],"answer":0,"why":"Mass advancement can propagate to parallel steps. The Do Not Advance setting is material when a step needs separate treatment.","reference":{"title":"Setup Considerations: Mass Operations on Business Processes","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/fet1554324204143.html"},"sample":0,"memberships":[{"collection":"bp200","label":"141"}]},{"id":"BP-142","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"A recurring cleanup must cancel hundreds of stale review events and have a designated group review the scope before execution. Which approach is documented for that volume and control?","options":["Use Mass Rescind for every transaction with an outstanding task","Use Mass Operation Management with a filtered input report and review step","Use the legacy mass advance task with a review date filter","Run the legacy Mass Cancel task without a date filter each week"],"answer":1,"why":"Mass Operation Management supports scheduled cancellation and review of the target set. Workday recommends it for higher cancellation volumes.","reference":{"title":"Setup Considerations: Mass Operations on Business Processes","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/fet1554324204143.html"},"sample":0,"memberships":[{"collection":"bp200","label":"142"}]},{"id":"BP-143","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"A custom report drives a mass cancellation of review events. It already filters on event type and cycle. What eligibility filter is required for the Cancel Business Process operation?","options":["Reassignable Step equals True","Rescindable equals True","Cancelable To Do equals True","Cancelable equals True"],"answer":3,"why":"The required flag must match the operation and object. Cancelable To Do targets tasks, while Cancelable identifies eligible process events.","reference":{"title":"Set Up Mass Operations","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/ala1416509465951.html"},"sample":0,"memberships":[{"collection":"bp200","label":"143"}]},{"id":"BP-144","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"A mass rescind is intended for completed test reviews only. Which pairing belongs in the operation design?","options":["Manually Advanceable equals True and an Approval Chain","Cancelable equals True and an optional notification","Reassignable Step equals True and a To Do","Rescindable equals True and a required Review step"],"answer":3,"why":"The rescind operation requires eligible events and a review step because the reversal cannot be undone.","reference":{"title":"Set Up Mass Operations","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/ala1416509465951.html"},"sample":0,"memberships":[{"collection":"bp200","label":"144"}]},{"id":"BP-145","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"A business owner wants to reassign outstanding review steps from a departing partner, including unassigned tasks in the defined group. Which field filters a mass reassignment input report?","options":["Reassignable Step","Cancelable To Do","Rescindable","Manually Advanceable"],"answer":0,"why":"The filter targets eligible step instances. Status and awaiting-person criteria can further narrow the reassignment population.","reference":{"title":"Setup Considerations: Mass Operations on Business Processes","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/fet1554324204143.html"},"sample":0,"memberships":[{"collection":"bp200","label":"145"}]},{"id":"BP-146","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"A proposed mass operation exceeds the documented instance limit for its type. HR assumes the first allowed number of review events will process. What should it expect?","options":["Automatic processing of the oldest review events first","An error with none of the returned instances processed","A partial batch ending at the limit","Automatic execution in multiple smaller batches"],"answer":1,"why":"Workday checks the returned instance count and rejects an oversized result. Narrow the report scope before running it.","reference":{"title":"Setup Considerations: Mass Operations on Business Processes","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/fet1554324204143.html"},"sample":0,"memberships":[{"collection":"bp200","label":"146"}]},{"id":"BP-147","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"HR filters the legacy Mass Advance Business Process task on screen, then plans to click Select All. It needs only one subset of a large review population. What is the safer supported approach?","options":["Use Mass Operation Management with a report that returns only the intended subset","Change the displayed sort order to group rows by template and click Select All","Sort by manager name and click Select All","Assume Select All applies only to the visibly filtered rows"],"answer":0,"why":"On the legacy task, Select All can include all items despite an applied filter. A restrictive input report defines the actual high-volume scope.","reference":{"title":"Concept: Business Process Management","url":"https://stage.doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/ikj1637605088663.html"},"sample":0,"memberships":[{"collection":"bp200","label":"147"}]},{"id":"BP-148","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"The wrong review was canceled and the owner asks to undo the cancellation. They still need a valid review. What should HR communicate?","options":["Correct on the original acknowledgement reactivates the parent","The cancellation cannot be undone; submit a new event and complete its steps","Reassign the last completed step to reactivate the event","Undo Cancel restores the entire original routing history as active work"],"answer":1,"why":"A cancellation leaves an audit trail but is not reversible. Restarting requires a new submission.","reference":{"title":"Concept: Business Process Management","url":"https://stage.doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/ikj1637605088663.html"},"sample":0,"memberships":[{"collection":"bp200","label":"148"}]},{"id":"BP-149","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"A pilot used a template with the wrong scoring configuration. It is already in use. HR still needs a correctly scored future cohort and an auditable plan for the pilot. Which approach is sound?","options":["Change the in-use rating scale and assume all existing scores recalculate","Edit only the section label to replace the underlying scale","Mass advance the pilot to unlock its formula and apply it retroactively","Prepare a correctly configured template for future launches and resolve pilot events according to status"],"answer":3,"why":"An in-use template has limited editable fields. Treat the design of future reviews and the transaction status of the pilot as separate decisions.","reference":{"title":"Start Employee Reviews","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/employee-review-process/dan1370796677653.html?toc=7.7.1"},"sample":0,"memberships":[{"collection":"bp200","label":"149"}]},{"id":"BP-150","module":"T","domain":2,"topic":"Transaction corrections and mass operations","stem":"An analyst wants an efficient input report for a mass review reversal. The proposed report includes every business process ever run. Which data source and scope best fit?","options":["Worker Calibration History with only the review end date","Review Component with only the competency reviewer type","Talent Pool Membership with only the population's owner","Business Process Transactions with BP type, transaction status, and a date range"],"answer":3,"why":"The transaction data source supports process-level mass operations. Type, status, and dates narrow the returned events and improve performance.","reference":{"title":"Set Up Mass Operations","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/manage-business-processes/ala1416509465951.html"},"sample":0,"memberships":[{"collection":"bp200","label":"150"}]},{"id":"BP-151","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"A sponsor wants one workflow that launches a performance review and calibrates the same cohort, using the reviews' manager ratings. How should the administrator launch it?","options":["Select the calibration program on Start Performance Review for Organization","Select a development-plan template and add a calibrated-rating label","Start two unrelated events with matching program names","Start talent reviews for individual workers after calibration ends"],"answer":0,"why":"The integrated organization launch starts calibration alongside the performance reviews and links the ratings and population.","reference":{"title":"Concept: Employee Reviews with Calibration","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/reviews-with-calibration/jai1395701231093.html"},"sample":0,"memberships":[{"collection":"bp200","label":"151"}]},{"id":"BP-152","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"Managers are being asked to plot employees before they have entered initial performance ratings. Which change provides the intended checkpoint on the calibration side?","options":["Place an employee acknowledgement after the controller submits","Place Await Calibration Completion before manager evaluation initiation","Put a step delay after Shared Participation","Put a To Do marked Hold for Review before Shared Participation on Launch Calibration"],"answer":3,"why":"The hold on Launch Calibration lets the designated reviewer confirm manager evaluations are ready before participants begin plotting.","reference":{"title":"Steps: Set Up Reviews with Calibration","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/reviews-with-calibration/zqe1532445263320.html"},"sample":0,"memberships":[{"collection":"bp200","label":"152"}]},{"id":"BP-153","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"HR owns a calibration readiness checkpoint for several divisions. The assigned group can see ratings for only one division. Which change addresses the checkpoint?","options":["Replace the checkpoint with a notification to each area's manager","Assign a group with access to all included employees and the relevant rating field","Grant a group access to the program definition while limiting visibility of worker ratings","Assign the To Do to a group with access only to the first manager's team"],"answer":1,"why":"The group checking readiness must be able to evaluate the whole covered population and its rating information.","reference":{"title":"Steps: Set Up Reviews with Calibration","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/reviews-with-calibration/zqe1532445263320.html"},"sample":0,"memberships":[{"collection":"bp200","label":"153"}]},{"id":"BP-154","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"HR wants to pause manager rating updates during calibration without sending managers an unusable on-hold task. Which sequence fits the manager evaluation BP?","options":["Await Calibration Completion service, followed by the rating-update Action","Employee acknowledgement, followed by a calibration To Do","Shared Participation, followed by employee acknowledgement","Rating-update Action, followed by Await Calibration Completion"],"answer":0,"why":"The optional service waits before creating the actionable update task. Reversing the steps defeats that Inbox requirement.","reference":{"title":"Steps: Set Up Reviews with Calibration","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/reviews-with-calibration/zqe1532445263320.html"},"sample":0,"memberships":[{"collection":"bp200","label":"154"}]},{"id":"BP-155","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"A department uses the same manager evaluation definition for reviews with and without calibration. What happens to the configured Await Calibration Completion service on an uncalibrated review?","options":["It puts every review on hold until the next calibration cycle","It starts a new calibration program for that employee","It converts the review to a talent review","It executes only when the review includes calibration"],"answer":3,"why":"The service is conditional on a calibration-linked review. Sharing the definition need not block ordinary reviews.","reference":{"title":"Steps: Set Up Reviews with Calibration","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/reviews-with-calibration/zqe1532445263320.html"},"sample":0,"memberships":[{"collection":"bp200","label":"155"}]},{"id":"BP-157","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"The calibrated rating is available, but HR wants managers to act only when it differs from the overall review rating. What should it configure?","options":["An entry condition on Update Performance Review Ratings using the relevant rating fields","A validation that blocks every manager who submits an unchanged rating","An exclusion for managers who approved the original rating","An exit condition on the controller's approval chain comparing the ratings"],"answer":0,"why":"A field comparison can skip this specific step when ratings match. A routing restriction would evaluate people instead of rating values.","reference":{"title":"Concept: Employee Reviews with Calibration","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/reviews-with-calibration/jai1395701231093.html"},"sample":0,"memberships":[{"collection":"bp200","label":"157"}]},{"id":"BP-158","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"The worker is included in calibration, but it belongs to a different event than this performance review. Why should HR avoid using that other event's result on the update step?","options":["A worker can never appear in any other calibration cycle","The update step's entry logic checks the linked calibration event","Only the employee can move a rating between events","The numeric scales must have different lengths"],"answer":1,"why":"Matching the worker is insufficient. The update is tied to the calibration linked to the review.","reference":{"title":"Concept: Employee Reviews with Calibration","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/reviews-with-calibration/jai1395701231093.html"},"sample":0,"memberships":[{"collection":"bp200","label":"158"}]},{"id":"BP-159","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"A manager receives Update Performance Review Ratings for Manager Evaluation and wants to send the review back from that exact step. Which action differs from ordinary manager evaluation?","options":["Entering the manager evaluation is prohibited after calibration","Send Back is unavailable on the rating-update step","Viewing the calibrated rating is unavailable","Submitting is unavailable on the rating-update step"],"answer":1,"why":"The update step supports the usual manager evaluation actions with a specific exception for Send Back.","reference":{"title":"Concept: Employee Reviews with Calibration","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/reviews-with-calibration/jai1395701231093.html"},"sample":0,"memberships":[{"collection":"bp200","label":"159"}]},{"id":"BP-160","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"The manager can see a calibrated review rating in Additional Details. A standard performance review printout does not show that same calibrated field. What explains the discrepancy?","options":["The manager has selected the wrong event solely because the field is absent in print","The calibration event must automatically have been rescinded","Only a repeat calibration submission makes the field printable","The calibrated review rating is omitted from the standard performance review printout"],"answer":3,"why":"The documented print behavior differs from the manager evaluation display. The missing field alone does not imply failed writeback.","reference":{"title":"Concept: Employee Reviews with Calibration","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/reviews-with-calibration/jai1395701231093.html"},"sample":0,"memberships":[{"collection":"bp200","label":"160"}]},{"id":"BP-161","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"A program should initialize placements from the manager's current overall review rating and potential assessed in this performance cycle. Which default fields match?","options":["Rating - Overall for Reviews with Calibration and Potential - Performance Review with Calibration","Calibrated Rating - Manager and Talent Matrix Review Rating after completion","Rating - Most Recent and Potential - Talent Review with Calibration","The employee acknowledgement status and a static pool's membership count"],"answer":0,"why":"The review-linked defaults carry the current performance cycle's inputs. A talent review's potential source refers to a different linked process.","reference":{"title":"Steps: Set Up Reviews with Calibration","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/reviews-with-calibration/zqe1532445263320.html"},"sample":0,"memberships":[{"collection":"bp200","label":"161"}]},{"id":"BP-162","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"The performance calibration program expects a potential rating from this review. Which additional workflow setup supplies that input?","options":["Use potential from a separate talent review as the input for every performance cycle","Route the potential assessment after manager evaluation and initialize from the prior rating","Add Assess Potential before manager evaluation and assign it to a manager group","Put Assess Potential after the controller submits the completed calibration"],"answer":2,"why":"The assessment must be performed in the review before its value is needed for calibration. A question or reviewer type does not supply the assessment.","reference":{"title":"Steps: Set Up Reviews with Calibration","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/reviews-with-calibration/zqe1532445263320.html"},"sample":0,"memberships":[{"collection":"bp200","label":"162"}]},{"id":"BP-163","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"A designer proposes an ordinary headcount report as the working nBox for in-progress placements. Which report data source is required for a calibration nBox?","options":["Worker Calibration History","Review Component","Indexed In Progress Worker Calibration Placements","Business Process Transactions"],"answer":2,"why":"The working nBox uses current placement records. Historical calibration reporting is designed for a different stage of the process.","reference":{"title":"Setup Considerations: Calibration nBox Reports","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/nng1576014395677.html"},"sample":0,"memberships":[{"collection":"bp200","label":"163"}]},{"id":"BP-164","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"A regional leadership cycle should skip first-line managers as initial calibration participants and begin with their managers. What setting addresses that routing requirement?","options":["Manager for Majority of Event on the employee review","Exclude Initiator on every performance approval","Autocomplete First Participant on the calibration program","Relative to the transaction on the employee acknowledgement"],"answer":2,"why":"The program can autocomplete the initial participant. This changes the calibration hierarchy's starting point without changing the review evaluator.","reference":{"title":"Calibration","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/calibration.html"},"sample":0,"memberships":[{"collection":"bp200","label":"164"}]},{"id":"BP-165","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"Several managers work on a calibration, but one manager's contribution should not advance the entire launch event. Which type of step supports that model?","options":["A service that autocompletes every participant's work","A single sequenced approval for every contributor","Shared Participation","Consolidated Approval by a single manager"],"answer":2,"why":"Shared Participation lets authorized people work in a common event without each individual action moving the parent process forward.","reference":{"title":"Calibration","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/calibration.html"},"sample":0,"memberships":[{"collection":"bp200","label":"165"}]},{"id":"BP-166","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"A consultant copies a calibration definition containing Shared Participation, then later replaces that step with an Approval. What happens to its participant configuration?","options":["It is copied with the definition but deleted when the step type is changed","It survives both operations and controls the new Approval","It is never copied but is recreated when an Approval is selected","It is converted to the alternate group on the new Approval"],"answer":0,"why":"Copy and conversion have different effects. Changing away from Shared Participation removes its participation configuration.","reference":{"title":"Calibration","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/calibration.html"},"sample":0,"memberships":[{"collection":"bp200","label":"166"}]},{"id":"BP-168","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"An HR partner has View All on Launch Calibration and an appropriate organizational role, but cannot access Facilitate Calibration. Which permission should HR verify?","options":["Correct on Complete Self Evaluation for Performance Review","Modify on the calibration nBox report definition alone","View Completed Only on the performance review's manager evaluation","View and Modify on the Facilitate Calibration domain"],"answer":3,"why":"Facilitation requires both the BP permission and domain permissions. The organizational role alone is insufficient.","reference":{"title":"Concept: Calibration Facilitation","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/tre1453502525869.html"},"sample":0,"memberships":[{"collection":"bp200","label":"168"}]},{"id":"BP-169","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"An authorized facilitator sees an active event for East but cannot select another active event for West. They hold roles only in East. What explains the list?","options":["Only events for which the user initiated the parent performance reviews are shown","Only in-progress events containing an organization where the facilitator holds a role are displayed","Facilitators see all active events once they have any role anywhere","Event visibility is determined by the manager selected at the performance review midpoint"],"answer":1,"why":"The event prompt respects the facilitator's organizational context. An event can be active and still outside their scope.","reference":{"title":"Concept: Calibration Facilitation","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/tre1453502525869.html"},"sample":0,"memberships":[{"collection":"bp200","label":"169"}]},{"id":"BP-170","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"A newly hired worker should join an in-progress combined review and calibration. Which process supports adding the worker and creating their review?","options":["Add the worker only to the review's historical nBox report","Create a new acknowledgement status for the worker","Use Manage Calibration to add the worker","Use Mass Rescind Business Processes on the affected division"],"answer":2,"why":"Manage Calibration handles supported staffing changes. Adding a worker to this combined event creates the associated review.","reference":{"title":"Calibration","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/calibration.html"},"sample":0,"memberships":[{"collection":"bp200","label":"170"}]},{"id":"BP-172","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"A participant role changed during an active calibration. The controller sees the affected event under Manage Calibration. To whom can the controller reassign it?","options":["Only the worker who launched the original performance review","Any employee from the calibrated population","Any former additional reviewer for the subject","A user in the security group specified in the participation configuration"],"answer":3,"why":"Participant reassignment follows the security group configured for that detail step. The eligible pool is not tenant-wide.","reference":{"title":"Calibration","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/calibration.html"},"sample":0,"memberships":[{"collection":"bp200","label":"172"}]},{"id":"BP-174","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"An administrator ran Resume Employee Reviews On Hold for the correct organization initiation. How should they check whether the background work has progressed?","options":["Wait for a new worker profile skill to appear","Open only the talent pool's membership report","Run Process Monitor","Check the feedback template's change history"],"answer":2,"why":"The resume task starts a background process. Process Monitor shows its execution status.","reference":{"title":"Resume Reviews on Hold","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/reviews-with-calibration/jai1395863884195.html"},"sample":0,"memberships":[{"collection":"bp200","label":"174"}]},{"id":"BP-175","module":"T","domain":2,"topic":"Calibration routing and rating updates","stem":"Participants finish plotting. After the controller submits, a Talent analyst needs the final potential rating on the worker. Which mapping should the analyst use?","options":["Calibration: Potential maps only to the additional reviewer average","Calibration: Potential maps to Potential","Calibration: Potential maps to the manager's overall performance rating","Calibration: Potential maps to the acknowledgement status"],"answer":1,"why":"Completion writes final calibration values. Potential is distinct from talent-based performance, which maps to the Talent Matrix Review Rating.","reference":{"title":"Concept: Calibration Results","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/tre1454628964830.html"},"sample":0,"memberships":[{"collection":"bp200","label":"175"}]},{"id":"BP-176","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"A director distributes three goals to nine eligible workers in one Add Goal to Employees submission. No worker appears twice. Which event structure should the analyst find?","options":["One Cascade Goals parent and nine Manage Goals children, each containing three goals","Nine Cascade Goals parents and one Manage Goals child for each goal","One Cascade Goals parent and 27 Manage Goals children, one per goal per worker","Three Cascade Goals parents and nine Manage Goals children shared by them"],"answer":0,"why":"A cascade submission creates one parent. Each selected worker receives a child transaction containing the goals assigned to that worker.","reference":{"title":"Cascade Goal to Employees","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/goals/dan1370796587654.html"},"sample":0,"memberships":[{"collection":"bp200","label":"176"}]},{"id":"BP-177","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"Two employees receive the same cascaded goal. Only one is asked to review it. Their supervisory organizations use different Manage Goals definitions. What is the first thing to compare?","options":["The rating scale on each employee's next performance review","The order in which the employees were selected at launch","The single parent Cascade Goals initiation step duplicated for each recipient","The Review Goal step and conditions in each worker's Manage Goals definition"],"answer":3,"why":"The cascade starts a separate Manage Goals process for each worker. Different child definitions can produce different routing from the same parent.","reference":{"title":"FAQ: Individual Goals","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/goals/syt1498114684039.html"},"sample":0,"memberships":[{"collection":"bp200","label":"177"}]},{"id":"BP-178","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"Employees must review cascaded goals they can edit. Self-created goals and noneditable cascades should bypass this particular task. Which configuration fits?","options":["Review Goal on Manage Goals to Employee as Self, conditioned only on editability","Review Goal on Cascade Goals to the initiator, conditioned only on editable goals","Review Goal on Manage Goals to Employee as Self, conditioned on cascaded and editable goals","Approval on Manage Goals to the manager, conditioned only on cascaded goals"],"answer":2,"why":"The recipient task belongs on Manage Goals. Both goal origin and editability matter because each condition alone admits cases the requirement excludes.","reference":{"title":"FAQ: Individual Goals","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/goals/syt1498114684039.html"},"sample":0,"memberships":[{"collection":"bp200","label":"178"}]},{"id":"BP-179","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"HR wants an email when a cascaded goal reaches a particular worker-level workflow step, but no email for an ordinary self-created goal. Where should the notification logic live?","options":["On the next talent review launch for the employee","On the employee review acknowledgement with an editable-goal condition","On the relevant Manage Goals workflow step with a cascaded-goal condition","On the Cascade Goals initiation without a condition"],"answer":2,"why":"Worker-level steps and notifications execute in Manage Goals. The cascaded-goal field distinguishes how the goal originated.","reference":{"title":"FAQ: Individual Goals","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/goals/syt1498114684039.html"},"sample":0,"memberships":[{"collection":"bp200","label":"179"}]},{"id":"BP-180","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"A worker received a new goal, but history shows that their Manage Goals child completed immediately. The correct child definition contains no additional workflow steps. Which diagnosis fits?","options":["A manager must have manually advanced it","The parent did not actually launch the child","Automatic child completion is expected after initiation","The goal was silently converted into a talent review"],"answer":2,"why":"An empty post-initiation workflow can complete automatically. An absent Inbox task is consistent with the recorded child event.","reference":{"title":"FAQ: Individual Goals","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/goals/syt1498114684039.html"},"sample":0,"memberships":[{"collection":"bp200","label":"180"}]},{"id":"BP-181","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"A new team must receive one previously cascaded goal exactly as it was issued. HR wants to check prior recipients before distributing it. Which approach is most direct?","options":["Start an annual performance review to copy the old goal","Use Add Additional Employees to Goal and inspect the Assigned To count","Rescind the initial cascade and relaunch both populations","Edit the old workers' Manage Goals events and swap in the new team"],"answer":1,"why":"The redistribution task reuses a single unchanged goal and exposes the prior assignees. Original recipients can keep their assignments.","reference":{"title":"Add Additional Employees to Goal","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/goals/dan1370796588024.html"},"sample":0,"memberships":[{"collection":"bp200","label":"181"}]},{"id":"BP-182","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"HR needs to revise previously issued goal wording before distributing the goal to another group. Which task supports that requirement?","options":["Add Goal to Employees","Add Additional Employees to Goal without changing its inputs","Correct the new employees' uncreated Manage Goals children","Rescind the existing recipients' reviews"],"answer":0,"why":"The additional-employees task is for one unchanged previously cascaded goal. Editing before distributing calls for Add Goal to Employees.","reference":{"title":"Add Additional Employees to Goal","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/goals/dan1370796588024.html"},"sample":0,"memberships":[{"collection":"bp200","label":"182"}]},{"id":"BP-183","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"Two colleagues receive editable copies of a cascaded objective. One changes their own goal. What should happen to the other colleague's copy?","options":["It is updated only when the two employees belong to the same supervisory organization","It adopts the new wording after the original cascade parent is corrected automatically","It changes when the first worker's manager approves","It retains its own values"],"answer":3,"why":"Each worker receives an independent individual goal. Editing a recipient's copy does not synchronize other workers' transactions.","reference":{"title":"Cascade Goal to Employees","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/goals/dan1370796587654.html"},"sample":0,"memberships":[{"collection":"bp200","label":"183"}]},{"id":"BP-184","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"A leader wants to cascade a goal that supports a private organization goal to workers outside that organization's hierarchy. What restriction applies?","options":["A private organization goal can be cascaded anywhere if all recipients share an HR partner","Selecting a static talent pool overrides the hierarchy limitation","Recipients must be in the same organization hierarchy for that private goal","A private goal can cross hierarchies only if it is marked noneditable"],"answer":2,"why":"Privacy of the supported organizational goal constrains the eligible hierarchy. Changing the distribution mechanism does not remove the boundary.","reference":{"title":"Cascade Goal to Employees","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/goals/dan1370796587654.html"},"sample":0,"memberships":[{"collection":"bp200","label":"184"}]},{"id":"BP-185","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"Workers manage ad hoc goals and managers cascade goals. HR wants a tenant-specific validation of goal weights at entry through either path. Which two BPs should be evaluated?","options":["Start Performance Review and Manage Goals, excluding the cascade initiating action","Cascade Goals and Start Performance Review only","Manage Goals and Complete Manager Evaluation only","Manage Goals and Cascade Goals"],"answer":3,"why":"Both goal-entry paths need the configured weighting rule. A review-only rule would not cover ad hoc goal entry throughout the year.","reference":{"title":"FAQ: Individual Goals","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/goals/syt1498114684039.html"},"sample":0,"memberships":[{"collection":"bp200","label":"185"}]},{"id":"BP-186","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"A manager cannot change a goal from the worker profile while the review is in progress, but can change it inside the review. Which configuration explains the difference?","options":["The requirement to include a feedback section","A warning on the goal completion status","Lock Goals Associated with In Progress Reviews","A prior-approver restriction on the manager's review"],"answer":2,"why":"The lock prevents ad hoc updates to goals associated with an open review while permitting work within the review itself.","reference":{"title":"Goals Management","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/goals-management.html"},"sample":0,"memberships":[{"collection":"bp200","label":"186"}]},{"id":"BP-187","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"A regional director distributes a public organization goal to selected workers. The coordinator expects the resulting worker records to be new organization goals. What are they?","options":["One shared organization goal attached to every worker","One shared individual goal with a common completion status across recipients","Copies of the organization goal owned by each worker's supervisory organization","Individual goals on the selected workers"],"answer":3,"why":"Cascading distributes individual goals even when an organization goal supplied the starting point.","reference":{"title":"Cascade Goal to Employees","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/goals/dan1370796587654.html"},"sample":0,"memberships":[{"collection":"bp200","label":"187"}]},{"id":"BP-188","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"An annual review type is available in organization-wide launches. Authorized HR partners also need to start that type for a single employee. Which review-type option specifically controls this?","options":["Allow Employee to Self-Initiate","Enable Additional Manager Evaluations for All Sections","Initiate on Individual Employee","Include subordinate organizations"],"answer":2,"why":"The individual-initiation option supports authorized managers, HR partners, and other roles starting one employee's review. Self-initiation is a separate option.","reference":{"title":"Define Employee Review Types","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/common-employee-review-setup/dan1370796683112.html"},"sample":0,"memberships":[{"collection":"bp200","label":"188"}]},{"id":"BP-189","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"An administrator wants a self-starting development plan and a self-starting disciplinary action. Both would use the same initiating group. Which review-type constraint changes the design?","options":["Any category supports self-initiation if no manager approval is required","Self-initiation is available for individual development plans and performance reviews","Only disciplinary actions support self-initiation when the individual option is selected","Self-initiation becomes available for every category with Employee as Self on a later step"],"answer":1,"why":"Allow Employee to Self-Initiate applies to two review categories. Routing employees to later steps is separate from starting their own event.","reference":{"title":"Define Employee Review Types","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/common-employee-review-setup/dan1370796683112.html"},"sample":0,"memberships":[{"collection":"bp200","label":"189"}]},{"id":"BP-190","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"A worker holds two jobs. HR wants a host manager to perform an annual evaluation and assumes that routing to the host creates a second review for the additional job. What should it expect?","options":["The review switches its job whenever an additional manager comments","The employee review is generated for the primary job; manager routing is a separate configuration","Two reviews are generated automatically whenever the worker holds two jobs","The review is generated for whichever manager submits first"],"answer":1,"why":"Employee reviews are generated for the primary job. A supported position routing modifier can change who receives a step without changing that principle.","reference":{"title":"Concept: Employee Reviews","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/employee-reviews/common-employee-review-setup/dan1370796576541.html"},"sample":0,"memberships":[{"collection":"bp200","label":"190"}]},{"id":"BP-191","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"A reviewer saves a partially entered launch. At that moment no data satisfy any rule-based definition. They add qualifying data later and expect a different route. Why was the default selected?","options":["The manager's approval always switches to the default definition","Definition selection occurred using the information present at Save for Later","The future review end date overrides all rule-based definitions","Default definitions apply only when the event includes a subprocess"],"answer":1,"why":"Saving can fix the selected definition before final submission. Test with qualifying values present at the point the event is first saved.","reference":{"title":"Configure Rule-Based Business Processes","url":"https://doc.workday.com/admin-guide/en-us/manage-workday/business-processes/customize-business-processes/ala1435595998613.html"},"sample":0,"memberships":[{"collection":"bp200","label":"191"}]},{"id":"BP-192","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"The sponsor gives two instructions for a talent approval. Skip the step for temporary assignments. On permanent assignments, prevent an otherwise eligible initiator from approving their own submission and use a fallback if needed. Which pairing fits?","options":["An entry condition for assignment type and a routing restriction with an alternate for the initiator","An initiator restriction for assignment type and a step delay for the fallback","Two entry conditions, with the excluded initiator's manager written into the review template","A permanent-assignment validation on every submission and ad hoc approval on the parent"],"answer":0,"why":"The first rule controls whether the step runs. The second controls individual eligibility based on that person's interaction with the event and can invoke alternate routing.","reference":{"title":"Advanced Business Process Configurations","url":"https://doc.workday.com/workday-education/en-us/course-manuals/hcm-core-supplemental-for-administrators/advanced-business-process-configurations.html"},"sample":0,"memberships":[{"collection":"bp200","label":"192"}]},{"id":"BP-193","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"A team needs the lead manager to own the rating, two project managers to comment on goals, and peers to rate competencies. Which design preserves all three roles?","options":["Primary manager evaluation plus three sequential approval steps","A single Get Additional Reviewers step using manager and peer reviewer types for all goals","Two additional managers and an ad hoc peer approval on the manager evaluation","Primary manager evaluation plus additional manager evaluations plus Get Additional Reviewers"],"answer":3,"why":"The primary evaluator owns the formal assessment. Additional managers contribute section comments; the multi-rater workflow gathers competency input.","reference":{"title":"Employee Review Business Process Framework","url":"https://doc.workday.com/workday-education/en-us/course-manuals/talent-for-administrators/employee-review-business-process-framework.html"},"sample":0,"memberships":[{"collection":"bp200","label":"193"}]},{"id":"BP-194","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"The manager submitted the initial review and sees workers in the nBox. HR now wants the calibrated result visible in the manager evaluation. Which remaining sequence is correct?","options":["Finish and submit calibration, then run the manager rating-update step","Send the employee's acknowledgement back, then copy the initial rating into calibration","Rescind the initial manager evaluation and relaunch it as a talent review","Run the manager rating-update step, then start Shared Participation for the first time"],"answer":0,"why":"Initial ratings flow into placement. The calibrated value comes back through the configured update step after calibration completes.","reference":{"title":"Concept: Employee Reviews with Calibration","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/reviews-with-calibration/jai1395701231093.html"},"sample":0,"memberships":[{"collection":"bp200","label":"194"}]},{"id":"BP-195","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"A talent review and calibration launch together. The business wants the talent review's potential assessment as the starting potential and the final calibrated potential on the worker profile. Which design fits?","options":["Use Potential - Talent Review with Calibration as the program default and complete calibration","Use Potential - Performance Review with Calibration and end the process when the worker submits Update Profile","Use the most recent potential default and submit the talent review without completing calibration","Use the manager's performance rating as the potential default and close the individual review"],"answer":0,"why":"Select the field tied to this kind of review. Completing calibration writes the resulting potential assessment to the worker profile.","reference":{"title":"FAQ: Talent Reviews","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-reviews/uqx1502723998855.html?toc=7.6.9"},"sample":0,"memberships":[{"collection":"bp200","label":"195"}]},{"id":"BP-196","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"An authorized facilitator pulls a department's calibration forward to act for its manager. The manager then looks for the original Calibrate Team item. What change should the help desk expect?","options":["Each employee becomes the recipient of the manager's calibration task","A second actionable copy stays with the manager until the controller submits","The pull-forward rescinds all of the department's performance reviews","The item leaves the manager's Inbox while the facilitator controls that calibration work"],"answer":3,"why":"Completing calibration work on a manager's behalf transfers control of the detail event. This differs from adding a second observer.","reference":{"title":"Concept: Calibration Facilitation","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/talent/talent-and-performance-calibration/tre1453502525869.html"},"sample":0,"memberships":[{"collection":"bp200","label":"196"}]},{"id":"BP-197","module":"T","domain":1,"topic":"Goal cascades and cross-process cases","stem":"Leadership wants standard questions in a feedback request that requesters cannot alter, and it wants corroborating project input rather than competency ratings. Which design best fits?","options":["Solicit unstructured feedback and enforce a manager acknowledgement on the review","Use a locked feedback template in the feedback request workflow","Use an unlocked feedback template and hide the primary manager's comments","Use competency reviewer types and edit item
