:{"title":"talent.pdf, PDF p. 272-274","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q282"},{"collection":"talent150","label":"B44"}]},{"id":"T300-283","module":"T","domain":4,"topic":"Succession planning","stem":"A plan lists three ready candidates, but the sponsor wants the preferred replacement for a critical position explicitly identified. What plan information supplies that distinction?","options":["The shortest readiness horizon alone","The first candidate after sorting alphabetically","The top successor designation","The highest potential assessment"],"answer":2,"why":"Readiness can be shared by several candidates. The top successor identifies the preferred candidate for that particular position.","reference":{"title":"talent.pdf, PDF p. 281","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q283"},{"collection":"talent150","label":"C17"}]},{"id":"T300-284","module":"T","domain":4,"topic":"Succession roles","stem":"A succession pool manager expects approval authority solely from that role. Which role distinction matters?","options":["Every pool manager automatically approves all succession events in every organization","Readiness values automatically assign approval authority","Only a worker's current manager can approve any succession event","The pool manager role does not itself provide approval authority; the pool creator has that authority"],"answer":3,"why":"The reference distinguishes succession pool management from approval authority, which is assigned to the creator of the pool.","reference":{"title":"talent.pdf, PDF p. 273","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q284"}]},{"id":"T300-285","module":"T","domain":4,"topic":"Succession sourcing","stem":"An administrator wants to populate a position's succession plan directly from a source pool. Which source does the setup guidance identify?","options":["An employee-review rating scale's population","A feedback template's recipients","A talent pool","A succession pool as an automatic source"],"answer":2,"why":"The setup guidance identifies talent pools as a source for populating succession plans; succession pools do not provide that automatic population mechanism.","reference":{"title":"talent.pdf, PDF p. 272","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q285"}]},{"id":"T300-286","module":"T","domain":4,"topic":"Succession setup","stem":"HR wants succession reports to identify business-critical roles reliably. Which setup should it review?","options":["Set every incumbent's potential to High","Enable the critical-job indicator on job profiles and position restrictions","Mark every candidate as top successor","Set every pool to restricted view"],"answer":1,"why":"Critical-role indicators inform reports such as Critical Open Positions and Succession Plans for Critical Positions.","reference":{"title":"talent.pdf, PDF p. 274","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q286"}]},{"id":"T300-287","module":"T","domain":4,"topic":"Succession setup","stem":"A design proposes basing core succession planning on location and intersection roles instead of supervisory organizations. What is the documented recommendation?","options":["Use intersection roles as the only organizational structure","Base every plan on the employee's home address location","Base succession planning on supervisory organizations","Base position plans on the pool creator's private lists"],"answer":2,"why":"The succession setup guidance recommends supervisory organizations as the organizational basis for planning.","reference":{"title":"talent.pdf, PDF p. 274","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q287"}]},{"id":"T300-288","module":"T","domain":4,"topic":"Potential assessment","stem":"Managers should assess potential as part of a development plan. Which review workflow addition supports this?","options":["An additional-reviewer competency rating with no potential subprocess","A new succession pool with the same name as the development template","Assess Potential Initiating Action subprocess in Start Development Plan","A potential question added only to the acknowledgment status list"],"answer":2,"why":"The reference supports including Assess Potential as an initiating-action subprocess in development plans and performance reviews.","reference":{"title":"talent.pdf, PDF p. 278","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q288"}]},{"id":"T300-289","module":"T","domain":4,"topic":"Potential assessment","stem":"HR needs potential assessments for many supervisory organizations without launching performance reviews. Which mass-operation target fits?","options":["Assess My Team's Potential events for organizations in a custom report","Only Update Performance Review Ratings events","Only individual Give Feedback events","Only Start Performance Review for Organization events"],"answer":0,"why":"Mass Operations Management can launch team potential-assessment events independently of performance reviews.","reference":{"title":"talent.pdf, PDF p. 278-279","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q289"}]},{"id":"T300-290","module":"T","domain":4,"topic":"Succession pools","stem":"A talent partner creates a new succession pool for a job profile. Which role is automatically assigned to the creator?","options":["Succession Pool Manager","Talent Review Employee as Self","Calibration Participant for every organization","Manager for Majority of Event"],"answer":0,"why":"Creating the succession pool automatically assigns its creator the Succession Pool Manager role.","reference":{"title":"talent.pdf, PDF p. 282","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q290"}]},{"id":"T300-291","module":"T","domain":4,"topic":"Succession candidates","stem":"A recruiter creates an external prospect, but the person should be available specifically for succession planning. Which prospect classification should be selected?","options":["Top Successor as the prospect's recruiting status","Succession Candidate in the Type prompt","High Potential as the prospect's supervisory organization","Ready Now as the prospect's job profile"],"answer":1,"why":"The prospect's type makes the candidate available for succession pools and plans. Readiness and preferred-successor decisions are separate plan data.","reference":{"title":"talent.pdf, PDF p. 283","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q291"}]},{"id":"T300-292","module":"T","domain":4,"topic":"Succession candidates","stem":"HR needs a confidential internal prospect in a succession plan. Which task supports creating that candidate record?","options":["Start Talent Review for Worker","Create Confidential Prospect","Create Private Talent Pool","Create Prospect only, with a private goal attached"],"answer":1,"why":"Create Confidential Prospect supports internal or external confidential candidates; ordinary Create Prospect supports external candidates.","reference":{"title":"talent.pdf, PDF p. 283","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q292"}]},{"id":"T300-293","module":"T","domain":4,"topic":"Succession security","stem":"A manager can access an employee who is a candidate but cannot open the position's succession plan. What determines plan access?","options":["Only the candidate's readiness value","The plan's display order in Find Workers","Security for the position associated with the plan","Only access to at least one candidate on the plan"],"answer":2,"why":"Succession-plan access is tied to the associated position. Candidate visibility alone does not confer access to the plan.","reference":{"title":"talent.pdf, PDF p. 288","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q293"}]},{"id":"T300-294","module":"T","domain":4,"topic":"Succession security","stem":"An HR partner can open HR Partner Hub but sees no expected organizations in its Succession Planning report. What access alignment should be checked?","options":["Identical labels on every succession plan and talent pool","The same security-group access to Worker Data: HR Partner Hub and Worker Data: Succession","The date of the employee's last goal cascade","The manager's feedback anonymity preference"],"answer":1,"why":"The hub's succession overview requires aligned access to those two domains, along with a supported security-group type.","reference":{"title":"talent.pdf, PDF p. 283","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q294"}]},{"id":"T300-295","module":"T","domain":4,"topic":"Succession lifecycle","stem":"A plan has prior events and can no longer be deleted. HR wants to prevent future use. Which maintenance action fits?","options":["Rename the plan to Inactive without changing its status","Delete its readiness values","Inactivate the plan","Clear every candidate's potential assessment"],"answer":2,"why":"Prior event history prevents deletion. Inactivation prevents use while preserving the existing record.","reference":{"title":"talent.pdf, PDF p. 288","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q295"}]},{"id":"T300-296","module":"T","domain":4,"topic":"Succession lifecycle","stem":"A terminated worker remains on a succession plan. HR assumes the plan is corrupt. What is the documented default?","options":["Every terminated worker must automatically disappear from all plans","A terminated worker's readiness must be changed to trigger automatic deletion","Workers disappear only after every candidate is re-rated","Terminated workers are not automatically removed; configure removal or remove them manually"],"answer":3,"why":"Because plans can include external candidates, termination does not inherently remove plan membership.","reference":{"title":"talent.pdf, PDF p. 288","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q296"}]},{"id":"T300-297","module":"T","domain":4,"topic":"Succession lifecycle","stem":"HR wants termination to remove workers from succession plans, succession pools, and talent pools. Where should Remove Worker from Talent be placed?","options":["Before Termination initiation as a required employee self-evaluation","After the completion step of Termination, with the required removal actions configured","Only on the talent review template's Applies To rule","Only inside the next annual performance review"],"answer":1,"why":"The reference places Remove Worker from Talent after Termination's completion step and configures the specific removal actions within it.","reference":{"title":"talent.pdf, PDF p. 318","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q297"}]},{"id":"T300-298","module":"T","domain":4,"topic":"Succession lifecycle","stem":"A succession pool intentionally retains former employees as possible future candidates. The termination workflow removes pool members elsewhere. What pool setting creates the exception?","options":["Exclude from Termination","Hide the pool's member report","Change every former employee to top successor","Make the pool inactive"],"answer":0,"why":"Exclude from Termination is available for a succession pool or static talent pool to prevent this automated membership removal.","reference":{"title":"talent.pdf, PDF p. 319","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q298"}]},{"id":"T300-299","module":"T","domain":4,"topic":"Succession lifecycle","stem":"A worker and their unchanged position transfer to a new organization. What happens to the succession plan associated with that position?","options":["It must be rescinded and recreated solely because the organization changed","It always moves to the worker's former manager","It becomes a dynamic talent pool","It stays with the position"],"answer":3,"why":"When the transfer retains the job or position, the succession plan remains associated with that job or position.","reference":{"title":"talent.pdf, PDF p. 288","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q299"}]},{"id":"T300-300","module":"T","domain":4,"topic":"Succession comparison","stem":"HR compares plan candidates and wants to include an external prospect who has not been added to the plan. What can the comparison report do?","options":["Compare only employees in the position's current organization","Include internal or external candidates outside the plan using Candidates for Comparison","Compare only candidates already marked ready now on the plan","Add the prospect to the plan automatically before showing any comparison"],"answer":1,"why":"Candidates for Comparison allows evaluation of people who are not yet plan members; comparison does not itself imply membership.","reference":{"title":"talent.pdf, PDF p. 286","url":"","note":"Your supplied 332-page reference; file pages, not printed guide pages."},"sample":0,"memberships":[{"collection":"new300","label":"Q300"}]},{"id":"L150-A01","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"An administrator wants a program to require passing its graded component, even when the learner has opened or attended it. Which program control addresses that distinction?","options":["Requires Enrollment","Recognize Previous Completions","Recognize Course Expiration Dates","Requires Successful Completion"],"answer":3,"why":"Successful-completion recognition makes component grading and attendance requirements count toward program completion. Enrollment and prior-credit controls answer different questions.","reference":{"title":"Manage Learner Enrollment","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/manage-learner-enrollment.html?toc=8"},"sample":0,"memberships":[{"collection":"learning150","label":"A01"}]},{"id":"L150-A02","module":"L","domain":1,"topic":"Packaged content and SCORM","stem":"Two packages run in the same tenant with interaction reporting enabled. Only one supplies question-level data. What is the best next test?","options":["Compare the packages’ visible completion messages without inspecting the emitted data","Run the failing package independently and inspect the interactions it emits","Change the course’s grade field before testing the package outside the tenant","Switch off the tenant option so both packages use summary tracking"],"answer":1,"why":"The difference between packages points to what the authoring package actually sends. A tenant setting cannot invent missing interaction data.","reference":{"title":"Setup Considerations: Packaged Content for Learning","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/packaged-content/hfx1625670674607.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A02"}]},{"id":"L150-A03","module":"L","domain":1,"topic":"Packaged content and SCORM","stem":"A SCORM zip contains its own quiz. The author wants Workday to track the attempt. Where should the administrator place the package?","options":["As the media on a stand-alone lesson","As a media lesson within a course","As a program item pointing to a stand-alone zip","As an attachment to the offering roster"],"answer":1,"why":"Packaged content belongs in a course lesson. A stand-alone resource or roster attachment does not provide the same SCORM tracking.","reference":{"title":"Setup Considerations: Packaged Content for Learning","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/packaged-content/hfx1625670674607.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A03"}]},{"id":"L150-A04","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"The campaign author wants a learner notification now, while reserving a second learning item for a later fixed calendar date. Which design achieves this within one campaign?","options":["Use one course expiration period for the entire campaign","Give each campaign item its own delivery schedule","Set one audience end date and give both items the same send trigger","Assign two learning administrators with different time zones"],"answer":1,"why":"Item-level schedules let related content follow different delivery rules for the same audience.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"A04"}]},{"id":"L150-A05","module":"L","domain":1,"topic":"Equivalencies, prerequisites and certifications","stem":"Three courses teach the same material in different languages. Completing any one should give equivalent credit across the set. Which approach best models the set?","options":["A group equivalency covering the three versions","One prerequisite row containing all three versions","One required program containing all three language versions","A one-way singular rule with just one language as source"],"answer":0,"why":"A group equivalency expresses mutual interchangeability. A single source would privilege one language, and a program would collect the courses rather than equate them.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"A05"}]},{"id":"L150-A06","module":"L","domain":4,"topic":"Drive and Media Cloud","stem":"The training team wants to analyze answers to interactive questions inside a Drive video, rather than course pass/fail. What reporting approach fits?","options":["Report on overall grades from course enrollments and treat those as item responses","Build a custom report on the recorded video-interaction responses","Use course ratings grouped by lesson and infer each viewer’s selected response","Use the packaged-content interaction report for an ordinary Drive video"],"answer":1,"why":"Media Cloud records interaction responses. The manual directs administrators to custom reporting for those results.","reference":{"title":"Workday Drive and Media Cloud","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-drive-and-media-cloud.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A06"}]},{"id":"L150-A07","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"A manager can see Enroll My Team but cannot enroll a direct report who skipped the prerequisite. A learning administrator succeeds for the same person. What explains the difference?","options":["Manager enrollment requires a due date, while administrative enrollment never does","The first submission permanently removed the prerequisite for all later users","The admin report treats a prerequisite as met whenever a manager views the course","Manager enrollment enforces prerequisites, while the administrative route can override them"],"answer":3,"why":"Different enrollment methods enforce different rules. An administrator’s success does not prove that the worker met the prerequisite.","reference":{"title":"Mass Enroll Learners","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pia1560344513585.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A07"}]},{"id":"L150-A08","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"Two workshops should have the same duration and format but different dates and trainers. How can a scheduler reuse the first workshop’s configuration?","options":["Add an alternate date in version notes and keep one offering","Add a second meeting to the first offering and keep a common enrollment list","Copy the course version and wait for an offering to be generated","Copy the course offering, then review dates and trainer before submitting"],"answer":3,"why":"Copying an offering provides a new session with reusable defaults. Its date and trainer can then be set independently.","reference":{"title":"Maintain Learning Content and Course Offerings","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/maintain-learning-content-and-course-offerings.html?toc=5"},"sample":0,"memberships":[{"collection":"learning150","label":"A08"}]},{"id":"L150-A09","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"The same reminder should repeat weekly only three times. Where should that limit be established?","options":["In the item’s relative due date, expressed as three weeks","In the reminder’s recurrence settings for the campaign item","In the audience recalculation interval, expressed as seven days","In the campaign run recurrence, limiting all campaign runs to three"],"answer":1,"why":"Reminder frequency and occurrence limits belong to the delivery schedule. Changing the course or audience changes a different population or behavior.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"A09"}]},{"id":"L150-A10","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"A digital course should remain accessible by direct link to assigned workers but should stop appearing as a catalog search result. Which change best targets discoverability?","options":["Clear Requires Enrollment and make the course on demand","Select Exclude From Search and Browse","Select Exclude From Recommendations only","Inactivate the course and keep the old version label"],"answer":1,"why":"Catalog search and recommendation placement are separate settings. Excluding search results preserves the content for other access paths.","reference":{"title":"Workday Learning Components","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-learning-components.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A10"}]},{"id":"L150-A11","module":"L","domain":1,"topic":"Equivalencies, prerequisites and certifications","stem":"Workers may book Advanced Safety as soon as they enroll in Foundations, before they finish it. What must the administrator change?","options":["Create a certification rule for Foundations without a prerequisite","Use enrollment as the prerequisite qualifier for Foundations","Use completion as the qualifier and allow automatic waitlisting","Make Advanced Safety the prerequisite for Foundations"],"answer":1,"why":"The qualifier decides which event opens the target. Reversing the courses or using certification does not implement this booking policy.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"A11"}]},{"id":"L150-A12","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"A lab has both a teaching session and an on-the-job observation. Which assignment puts the right trainer at each activity?","options":["Assign an assessor at the classroom lesson and leave the observation to the course contact","An assessor for the classroom lesson and an instructor for the training activity","Assign both trainers only as course contacts, then enable attendance on both lessons","An instructor for the classroom lesson and an assessor for the training activity"],"answer":3,"why":"Instructor and assessor assignments follow how learning is delivered and evaluated. A contact or audience does not grant the observation role.","reference":{"title":"Configure Workday Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/configure-workday-learning.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A12"}]},{"id":"L150-A13","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"A blended course version changes only the description and skills. A project lead expects old offerings to retain the former wording. What explains the result they see?","options":["Only completed enrollments adopt new descriptions","All course fields are frozen once an offering opens","These fields update across versions","Only offerings updated with Update Offering to Version receive new skills"],"answer":2,"why":"Description and skills are non-effective-dated. Versioning protects designated time-sensitive fields, not every piece of course metadata.","reference":{"title":"Maintain Learning Content and Course Offerings","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/maintain-learning-content-and-course-offerings.html?toc=5"},"sample":0,"memberships":[{"collection":"learning150","label":"A13"}]},{"id":"L150-A14","module":"L","domain":1,"topic":"Retraining and expiration","stem":"Safety training expires for field engineers after six months and for everyone else after twelve. Which design uses one course and avoids maintaining two catalogs?","options":["Make two course versions effective on the same day, one for each group","Use a single twelve-month rule and give engineers earlier campaign due dates","Set the default to six months and use a twelve-month retrain window for others","Set a twelve-month default and a six-month advanced rule for engineers"],"answer":3,"why":"Advanced rules vary validity by learner group. A campaign due date or retrain window changes scheduling, not how long a completion is valid.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"A14"}]},{"id":"L150-A15","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"A waitlisted learner needs approval to join the queue. A seat opens while approval is still pending. Which conclusion is safest?","options":["The seat is reserved until the pending learner’s manager decides","Pending approval does not guarantee that seat ahead of an approved learner","The offering must close before any approved learner can move","The learner becomes enrolled immediately and approval follows enrollment"],"answer":1,"why":"A pending waitlist request is distinct from an approved position. An approved learner may take the available place.","reference":{"title":"Concept: Waitlists for Learning Course Offerings","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pzq1545307922509.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A15"}]},{"id":"L150-A16","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"The learning administrator needs to retire an audience used in an old campaign so it cannot be selected for new work. Which action directly targets the audience?","options":["Inactivate every course the old campaign distributed","Replace the audience’s report filters with a filter returning zero workers","Deactivate it through Manage Audiences","Remove the audience from the schedule of the most recent campaign only"],"answer":2,"why":"The audience has its own lifecycle. Changing content, schedules, or worker records would have broader effects without retiring that audience.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"A16"}]},{"id":"L150-A17","module":"L","domain":3,"topic":"Learning reports","stem":"Several manual waitlists exist. The administrator needs only offerings where a seat is now free and a manual promotion is possible. Which report section is relevant?","options":["My Team’s Learning","Expression of Interest in Learning Courses","Waitlists Requiring Action","All Other Waitlists"],"answer":2,"why":"The action queue isolates waitlists needing intervention. Simply listing all queues would include fully booked offerings.","reference":{"title":"Concept: Waitlists for Learning Course Offerings","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pzq1545307922509.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A17"}]},{"id":"L150-A18","module":"L","domain":1,"topic":"Packaged content and SCORM","stem":"A tested SCORM package launches for administrators, but a learner’s browser blocks the new window. What change most directly tests the observed failure?","options":["Replace the package with an external URL and assume equivalent tracking","Enable grade entry on the lesson before retesting the blocked window","Republish the same package with a different passing threshold","Permit the package launch window and retry the course lesson"],"answer":3,"why":"A blocked launch window prevents the content/player interaction. Changing delivery type would also change the tracking path.","reference":{"title":"Setup Considerations: Packaged Content for Learning","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/packaged-content/hfx1625670674607.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A18"}]},{"id":"L150-A19","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"A campaign item should be due two weeks after each recipient receives it. The cohort is added in waves. What setup preserves the same interval?","options":["Give the item a relative due date of two weeks after delivery","Give the campaign one fixed end date two weeks after launch","Place a two-week expiry period on the course completion","Make delivery relative to the first item but retain one deadline for the entire cohort"],"answer":0,"why":"An item-relative due date accounts for different delivery dates. The campaign end date applies to the campaign as a whole.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"A19"}]},{"id":"L150-A20","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"Workers have already been identified in a custom search report. HR wants only eight of the 90 matches enrolled, without creating a new population definition. What should they do?","options":["Make the report optional and submit all 90 rows","Schedule a campaign using all results and disable reminders for 82","Select the eight rows and invoke the authorized mass enrollment action","Enroll all 90 and mark 82 as optional"],"answer":2,"why":"Selection defines the targets of the mass action. Optional status or reminder suppression does not remove an enrollment.","reference":{"title":"Mass Enroll Learners","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pia1560344513585.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A20"}]},{"id":"L150-A21","module":"L","domain":3,"topic":"Completion corrections and exceptions","stem":"A three-lesson enrollment needs a manual completion correction. Two lessons show Completed and one shows In Progress. Why can the administrator not mark the whole enrollment complete?","options":["Every learner in the offering must finish before the administrator acts","The learner must receive a second enrollment before a manual update can be submitted","The course must be closed to all future enrollments first","Each lesson’s tracking status must be completed first"],"answer":3,"why":"The manual correction must account for every lesson in that enrollment. Other learners’ progress is unrelated.","reference":{"title":"Manage Enrollment Completion","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/eas1550266780581.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A21"}]},{"id":"L150-A22","module":"L","domain":3,"topic":"Learning reports","stem":"A trainer needs a weekly view of the instructor-led sessions they will deliver. Which report is the closest fit?","options":["Manage Waitlists","Manage My Training Activities","Instructor Schedule Calendar","Find Workers to Enroll"],"answer":2,"why":"The instructor calendar organizes assigned teaching sessions by time. The training-activities view is designed for assessor work.","reference":{"title":"The Learning Trainer","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/the-learning-trainer.html?toc=10"},"sample":0,"memberships":[{"collection":"learning150","label":"A22"}]},{"id":"L150-A23","module":"L","domain":4,"topic":"Drive and Media Cloud","stem":"A reviewer needs to annotate a Drive file but must not be able to change the media or publish edits. Which share permission fits?","options":["Can Comment","Can View","Can Edit","Drive Administrator"],"answer":0,"why":"Commenting allows feedback without edit privileges. View-only access lacks the requested annotation ability.","reference":{"title":"Workday Drive and Media Cloud","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-drive-and-media-cloud.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A23"}]},{"id":"L150-A24","module":"L","domain":1,"topic":"Equivalencies, prerequisites and certifications","stem":"A course completion should issue a named credential from an external issuer. The issuer and credential do not yet exist in the tenant. What is the correct sequence?","options":["Create a prerequisite rule, then rename its target to the issuer","Enter credits in Units, then add the issuer to the course contacts","Define the certification, then link it to the course in a learning certification rule","Create an equivalency from the course to the issuer, then set an expiry"],"answer":2,"why":"The certification defines what is awarded. The learning certification rule ties that credential to successful completion of the specified content.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"A24"}]},{"id":"L150-A25","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"An audit should show workers with actual enrollment records, including voluntary enrollments. Which report basis best matches the measure?","options":["Scheduled course offerings without learner records","Learning Assignment Records restricted to required learning","Learning Enrollments","Campaign audiences filtered to employees"],"answer":2,"why":"Enrollment data records participation. Assignment and audience data can include people who have not enrolled and miss voluntary participants.","reference":{"title":"Mass Enroll Learners","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pia1560344513585.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A25"}]},{"id":"L150-A26","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"A campaign uses a custom population report. The author will change jobs and lose access to part of that population. Which configuration can preserve the intended calculation context?","options":["Select an appropriate worker in Override Default User","Set the default campaign priority to High","Restrict the saved search to the current author’s accessible regions","Clear all report filters and use the creator’s permissions"],"answer":0,"why":"The override supplies a user with sufficient access to evaluate the report. Scheduling priority does not expand access to workers.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"A26"}]},{"id":"L150-A27","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"A manager wants nine people trained today. The room has four seats left, a waitlist with five open places, and no approved capacity override. What can the manager do directly through Enroll My Team?","options":["Enroll nine because seats and waitlist places add up to nine","Enroll none until all nine can be seated together","Enroll four and ask the other five to join the waitlist themselves","Enroll four and put the other five on the waitlist in the same submission"],"answer":2,"why":"Manager mass enrollment is limited to open seats and cannot waitlist others. Queue places are not additional training seats.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"A27"}]},{"id":"L150-A28","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"Three existing digital courses are maintained by different teams. HR wants one curriculum that reuses all three without rebuilding their lessons. Which structure fits?","options":["A program that references the existing courses","A digital course with three external links to the courses","A single offering that lists three parent courses","A blended course with the existing courses as lessons"],"answer":0,"why":"A program groups existing catalog items. Rebuilding links or lessons would lose the individual course enrollments the teams already maintain.","reference":{"title":"Workday Learning Components","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-learning-components.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A28"}]},{"id":"L150-A29","module":"L","domain":4,"topic":"Instructor and assessor security","stem":"A trainer can see an assigned on-the-job activity but cannot record observations or attach evidence. Which permission area should be reviewed?","options":["On-the-job training management and assessor access","The instructor’s self-service domain for classroom roster management only","Facilitated enrollment permissions for the worker population","Instructor Schedule Calendar access only"],"answer":0,"why":"The missing actions concern evaluation of a training activity. Instructor calendar access or campaign security does not enable assessor work.","reference":{"title":"The Learning Trainer","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/the-learning-trainer.html?toc=10"},"sample":0,"memberships":[{"collection":"learning150","label":"A29"}]},{"id":"L150-A30","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"Twenty learners were booked into the wrong Tuesday session. Wednesday’s roster is accurate, and Tuesday’s session will still run for other learners. Where should the admin target the drop?","options":["Batch Drop Enrollment for the Tuesday offering and the named learners","Mass waive all assignments for the course","Inactivate the parent course version","Cancel Course Offering for Tuesday"],"answer":0,"why":"A batch drop can select an offering and individuals. Canceling the session or inactivating the course would affect people outside the correction.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"A30"}]},{"id":"L150-A31","module":"L","domain":4,"topic":"Drive and Media Cloud","stem":"Editors add interactive questions to a safety video used in five courses. Only a sixth pilot course should receive the questions. What should they do before editing?","options":["Publish the original, then update only the pilot offering’s roster","Copy the media file in Drive and use the edited copy for the pilot","Add the questions to the original and share it with fewer editors","Edit the original file and change only the pilot course’s version notes"],"answer":1,"why":"Interactions are stored on the media file. A separate copy isolates the pilot from other courses that share the original.","reference":{"title":"Workday Drive and Media Cloud","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-drive-and-media-cloud.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A31"}]},{"id":"L150-A32","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"A required campaign should send course content to workers in two specific locations who hold one job profile. Find Workers has all three filters. Which approach is most reusable?","options":["Save the filtered worker search and use it to define the campaign audience","Select two course offerings and use their room locations as the audience","Create an equivalency rule using the job profile as its source","Enter the location names in the course description and send to all workers"],"answer":0,"why":"The saved search identifies people by worker attributes. The course location describes delivery and cannot stand in for population filtering.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"A32"}]},{"id":"L150-A33","module":"L","domain":3,"topic":"Grading, attendance and trainer scope","stem":"A primary instructor needs to enter final results for 12 learners and record one session’s attendance separately. Which use of the roster fits?","options":["Use Overall Grade for course results and Lessons for lesson-level results","Use an enrollment approval action for both entries","Use the course’s catalog rating for final scores and Overall Grade for session dates","Use Lessons for final course scores and waitlist status for attendance"],"answer":0,"why":"The roster distinguishes overall results from individual lesson records. They describe different levels of completion evidence.","reference":{"title":"The Learning Trainer","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/the-learning-trainer.html?toc=10"},"sample":0,"memberships":[{"collection":"learning150","label":"A33"}]},{"id":"L150-A34","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"A learner is waived from a retraining assignment and has no new initial assignment. Someone argues the existing expiry date alone will immediately reopen the requirement. What should the analyst expect?","options":["The waiver is always reversed at the next midnight recalculation","The waiver moves the existing expiration date backward to the last completion","The waiver applies only until the next course offering opens","The waiver stays in effect unless an applicable later action changes it"],"answer":3,"why":"The waived retraining assignment remains waived until an action such as undoing the waiver or a new initial assignment changes the situation.","reference":{"title":"Steps: Waive Learning Assignments","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/shb1581540363812.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A34"}]},{"id":"L150-A35","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"A trainer corrects a misspelled blended-course title and wants the correction visible on all versions. Which action is sufficient?","options":["Issue a new version schema and leave the title untouched","Edit the course title once as a non-effective-dated change","Create a new effective-dated version and copy every offering","Change the course title separately on each historical version"],"answer":1,"why":"Title changes apply across versions. Creating a future version is useful for changes that need different values over time.","reference":{"title":"Maintain Learning Content and Course Offerings","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/maintain-learning-content-and-course-offerings.html?toc=5"},"sample":0,"memberships":[{"collection":"learning150","label":"A35"}]},{"id":"L150-A36","module":"L","domain":3,"topic":"Completion corrections and exceptions","stem":"A duplicate future enrollment was created in error for one worker. It is eligible for cancellation and the session must run for everyone else. Which action has the intended scope?","options":["Cancel Learning Enrollment for the duplicate record","Inactivate the course version containing the duplicate","Cancel Course Offering for the session","Waive all learning assignments for the course"],"answer":0,"why":"The erroneous object is one enrollment. Canceling the offering would affect all scheduled participants.","reference":{"title":"Reference: Learning Business Processes","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-setup-and-maintenance/learning-security/kkd1468238672415.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A36"}]},{"id":"L150-A37","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"A worker drops an offering but still sees required learning. The compliance team confirms that the requirement was assigned in error. Which record needs action now?","options":["The expired waitlist record","The instructor’s attendance entry","The open learning assignment","The completed course version"],"answer":2,"why":"Dropping removes the enrollment. An independently open assignment can still require the learner to take the content.","reference":{"title":"Steps: Waive Learning Assignments","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/shb1581540363812.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A37"}]},{"id":"L150-A38","module":"L","domain":4,"topic":"Instructor and assessor security","stem":"An internal instructor should manage the roster for assigned offerings only. Which group is the better choice on the instructor self-service domain?","options":["Internal Learning Instructor as Self","All Internal Learning Instructors","All External Learning Instructors","Learning Administrator"],"answer":0,"why":"The as-self group supports the instructor’s own assignments. The all-instructors group can expose a broader set of offerings.","reference":{"title":"The Learning Trainer","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/the-learning-trainer.html?toc=10"},"sample":0,"memberships":[{"collection":"learning150","label":"A38"}]},{"id":"L150-A39","module":"L","domain":1,"topic":"Retraining and expiration","stem":"An expiry rule and a learner’s initial assignment deadline happen to fall on the same date. Which record should govern the period of validity after the learner passes?","options":["The due date on the open initial assignment","The effective end date of the course version","The completed enrollment’s expiration date","The original campaign item’s send date"],"answer":2,"why":"An assignment deadline sets when the worker should finish. The expiry period determines when the completed learning needs renewal.","reference":{"title":"Concept: Expiry Periods for Learning Content","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/usx1517492748668.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A39"}]},{"id":"L150-A40","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"A peer wants to publish a reference PDF that colleagues can open immediately as a single item. There is no required enrollment, sequence, or instructor. Which is the simplest match?","options":["A program requiring successful completion","A blended course with a single offering","A stand-alone lesson","A digital course requiring enrollment"],"answer":2,"why":"A stand-alone lesson supports a single independently consumed resource. Each alternative adds a course, scheduling, or program layer the requirement does not call for.","reference":{"title":"Workday Learning Components","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-learning-components.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A40"}]},{"id":"L150-A41","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"Two reports return the same 30 workers. In the administrator’s report, selecting all rows offers an enrollment action. The reporting analyst’s copy only exports the rows. What is missing from the copy?","options":["A filter limiting results to workers without an existing assignment","The Learning Mass Enroll mass action on a suitable search report","A worker prompt defaulted to the administrator’s supervisory organization","A required-learning category on each report column"],"answer":1,"why":"Returning workers does not make a report actionable. The intended mass action must be present and the operator must be authorized.","reference":{"title":"Mass Enroll Learners","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pia1560344513585.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A41"}]},{"id":"L150-A42","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"Version 3 is future-dated. An administrator must schedule an offering against version 3 today without changing the current version. Where should they start?","options":["Rename the current version to version 3 and schedule from it","View version 3 on the Versions tab before scheduling the offering","Schedule from the current version and set only the offering date after version 3 begins","Update the version notes after scheduling the offering from version 2"],"answer":1,"why":"The displayed course version supplies the offering defaults. Choosing a future session date alone does not select the future version.","reference":{"title":"Maintain Learning Content and Course Offerings","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/maintain-learning-content-and-course-offerings.html?toc=5"},"sample":0,"memberships":[{"collection":"learning150","label":"A42"}]},{"id":"L150-A43","module":"L","domain":1,"topic":"Retraining and expiration","stem":"A certification course must recur at the same audit date every year. Which configuration avoids editing a one-time date each year?","options":["A campaign send date with no course expiry","A duration measured only from each employee’s first enrollment","A recurrence-frequency expiry rule","A new one-time date in the course description"],"answer":2,"why":"A recurrence defines a repeating calendar pattern. A one-time date needs later maintenance and an individual duration can drift from the audit date.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"A43"}]},{"id":"L150-A44","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"A regional administrator needs authority to enroll above capacity, but only within their assigned geography. Which design combines those requirements?","options":["Learning Facilitated Enroll with a location-based constraint","Enroll My Team with a location prompt","Unconstrained Learning Mass Enroll and a saved location filter","Mass Enroll by Role with a location-based constraint"],"answer":3,"why":"The by-role route can combine organizational scope with override capability. A report filter alone is not a security boundary.","reference":{"title":"Mass Enroll Learners","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pia1560344513585.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A44"}]},{"id":"L150-A45","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"A manager wants optional training for direct reports. Enrollment is appropriate, but the course should not become a compliance requirement. How should they submit?","options":["Enroll the team with required learning left off","Enroll the team as required and omit the due date","Create a required campaign with a future send date","Enroll the team as required and omit all reminders"],"answer":0,"why":"A missing deadline or reminder does not undo the required designation. Optional enrollment leaves that designation off.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"A45"}]},{"id":"L150-A46","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"A saved search has the correct job profiles but still includes contractors outside the population. What should the operator do before mass enrollment?","options":["Submit the enrollment, then remove contractors from the saved search","Refine the worker filters and verify the selected workers before launching the action","Start the mass action for all results and rely on the course title to remove ineligible rows","Make the learning optional so all contractors are excluded from the enrollments"],"answer":1,"why":"A later search edit does not reverse enrollments already created. Validate the actual target set before starting the mass action.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"A46"}]},{"id":"L150-A47","module":"L","domain":1,"topic":"Equivalencies, prerequisites and certifications","stem":"Compliance wants learners’ transcripts to show the equivalent target as well as the course actually completed. The equivalency itself already works. Which setting should change?","options":["Display Equivalency Records on Learning History","Display on Content on the certification rule","Recognize Previous Completions on a program","Recognize Course Expiration Dates on the program"],"answer":0,"why":"The learning-history display setting controls visibility of equivalent records. Rebuilding the rule is unnecessary when credit is already working.","reference":{"title":"Learning Content Rules","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/learning-content-rules.html?toc=6"},"sample":0,"memberships":[{"collection":"learning150","label":"A47"}]},{"id":"L150-A48","module":"L","domain":3,"topic":"Completion corrections and exceptions","stem":"The administrator can correct a missing tracking result on a media lesson but cannot enter a course score. Which lesson setting should be checked?","options":["Requires Enrollment","Enable Auto-Enrollment from the Waitlist","Recognize Course Expiration Dates","Provide Course Grade"],"answer":3,"why":"Manual entry of a score and grade depends on the media lesson providing a course grade. Enrollment eligibility alone is insufficient.","reference":{"title":"Manage Enrollment Completion","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/eas1550266780581.html"},"sample":0,"memberships":[{"collection":"learning150","label":"A48"}]},{"id":"L150-A49","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"A department needs recurring delivery of multiple learning items with messages and reminders to a changing population. Which approach minimizes repeated manual enrollments?","options":["One global offering with a larger waitlist","A program with no audience or distribution schedule","Repeated manager mass enrollments from a fixed worker spreadsheet","A scheduled learning campaign with a report-based audience"],"answer":3,"why":"A campaign manages whom to contact, what to send, and when. A program can group content but does not by itself perform scheduled outreach.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"A49"}]},{"id":"L150-A50","module":"L","domain":3,"topic":"Grading, attendance and trainer scope","stem":"A guest instructor is assigned only to the second lesson of a workshop. They need to enter their own lesson results but should not grade the whole offering. What scope matches that role?","options":["Overall grading for every learner in every offering","Roster management for all offerings using the same training room","Grade entry for every lesson in the course version","Lesson-level grading for the assigned lesson"],"answer":3,"why":"A lesson-level assignment limits grading and attendance to that lesson. Overall grading requires a broader role.","reference":{"title":"The Learning Trainer","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/the-learning-trainer.html?toc=10"},"sample":0,"memberships":[{"collection":"learning150","label":"A50"}]},{"id":"L150-B01","module":"L","domain":4,"topic":"Instructor and assessor security","stem":"An instructor can manage grades but cannot promote workers from a manual waitlist. What should be checked before expanding all of their learning access?","options":["Whether a required campaign uses the offering","Waitlist-management permissions for the instructor’s security group","Whether the course has at least two versions","Whether the grading rubric includes a pass value"],"answer":1,"why":"Waitlist management and grading are separate permissions. Confirm the instructor can operate the relevant waitlist task.","reference":{"title":"The Learning Trainer","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/the-learning-trainer.html?toc=10"},"sample":0,"memberships":[{"collection":"learning150","label":"B01"}]},{"id":"L150-B02","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"A course has custom validation and available seats. A facilitator’s request is rejected, but an administrator can submit it for the same workers. Which explanation best fits?","options":["The facilitated route respects the validation and the administrative route can override it","Available seats bypass custom validations for facilitators","The facilitator must choose a fixed due date to bypass validations","Selecting workers from a saved search disables validations for administrators only"],"answer":0,"why":"Available seats satisfy capacity only. The enrollment method determines whether the additional validation can be overridden.","reference":{"title":"Mass Enroll Learners","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pia1560344513585.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B02"}]},{"id":"L150-B03","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"An administrator schedules reminders and sets item due dates, but reminders are disabled across the tenant. Which configuration is relevant to that common failure?","options":["Enable learning expiry reminders at the course level only","Raise the priority on the next scheduled campaign distribution","Enable Reminders in Edit Tenant Setup - Notifications","Duplicate the reminder definitions on every item"],"answer":2,"why":"Tenant notification setup can prevent properly configured item reminders from sending. Course-level learning options address unrelated functions.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"B03"}]},{"id":"L150-B04","module":"L","domain":3,"topic":"Learning reports","stem":"A new learning administrator knows a standard report exists but has only its functional area, not its exact name. What is the most direct discovery route?","options":["Filter Manage Waitlists by report title","Run My Transcript for every worker in the learning department","Filter Workday Standard Reports by the Learning report category","Search the instructor’s own calendar for matching report prompts"],"answer":2,"why":"The standard reports inventory identifies delivered reports by category. Operational learning reports do not inventory each other.","reference":{"title":"The Learning Trainer","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/the-learning-trainer.html?toc=10"},"sample":0,"memberships":[{"collection":"learning150","label":"B04"}]},{"id":"L150-B05","module":"L","domain":3,"topic":"Learning reports","stem":"A planner must decide where extra offerings are needed, including demand from learners who could not find any suitable date. What report provides that evidence?","options":["Manage Waitlists for one selected offering","My Team’s Learning for a single manager","Instructor Schedule Calendar","Expression of Interest in Learning Courses"],"answer":3,"why":"Expressions of interest capture demand beyond a particular waitlist. An instructor’s schedule shows supply rather than unmet demand.","reference":{"title":"Manage Learner Enrollment","url":"https://stage.doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/manage-learner-enrollment.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B05"}]},{"id":"L150-B06","module":"L","domain":3,"topic":"Grading, attendance and trainer scope","stem":"A classroom course requires both attendance and a passing overall grade. Attendance is recorded for every learner, yet one record still shows In Progress. What should you check first?","options":["Whether the learner’s assignment deadline falls after the offering end date","The missing required grade and any incomplete required lessons","Whether the manager approved the original enrollment before the session","Whether the completion status of another learner in the offering changed"],"answer":1,"why":"Attendance alone cannot satisfy a course that also tracks grades. Check the required results before changing the enrollment.","reference":{"title":"The Learning Trainer","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/the-learning-trainer.html?toc=10"},"sample":0,"memberships":[{"collection":"learning150","label":"B06"}]},{"id":"L150-B07","module":"L","domain":1,"topic":"Retraining and expiration","stem":"Two advanced expiration rules match a worker. The first specifies 12 months and the second specifies six months. The default is 24 months. Which period applies?","options":["Six months","12 months","The average of the two advanced periods","24 months"],"answer":1,"why":"Evaluation uses the first matching advanced rule. It does not choose the shortest period or fall through to the default.","reference":{"title":"Concept: Expiry Periods for Learning Content","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-content/usx1517492748668.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B07"}]},{"id":"L150-B08","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"A reminder should go only to people who still have an incomplete campaign item. The item has a send date but no deadline. What is the most direct configuration change?","options":["Send a second copy of the campaign to everyone","Put a due date only on the enrollment, leaving the campaign item without a due date","Change the audience from dynamic to static","Add an item due date and schedule reminders relative to it"],"answer":3,"why":"Item reminders use the due date and completion status. Re-sending the campaign would also reach people outside the intended reminder group.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"B08"}]},{"id":"L150-B09","module":"L","domain":3,"topic":"Grading, attendance and trainer scope","stem":"An observation spans three shifts. Different qualified assessors need to contribute evidence to the same learner’s training activity. Which design fits?","options":["Create three unrelated digital courses and average their course ratings","Create three new course versions and assign an instructor to each","Assign multiple assessors to the learner’s training activity","Assign the assessors as enrollment approvers only"],"answer":2,"why":"Workday supports multiple assessors for a training activity. Approval alone does not give the assessor a place to grade or comment on the observation.","reference":{"title":"The Learning Trainer","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/the-learning-trainer.html?toc=10"},"sample":0,"memberships":[{"collection":"learning150","label":"B09"}]},{"id":"L150-B10","module":"L","domain":1,"topic":"Content, programs, trainers and costs","stem":"A program should accept a valid course completion from last month, but return to In Progress when that underlying course expires. Which combination is needed?","options":["Requires Successful Completion and Requires Enrollment only","Recognize Previous Completions and Recognize Course Expiration Dates","Recognize Previous Completions and disable expiration recognition","Recognize Course Expiration Dates and disregard previous completions"],"answer":1,"why":"One setting credits earlier work. The other makes continued validity of that credit depend on the course expiration.","reference":{"title":"Manage Learner Enrollment","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/manage-learner-enrollment.html?toc=8"},"sample":0,"memberships":[{"collection":"learning150","label":"B10"}]},{"id":"L150-B11","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"An administrator uses the mass waiver task and selects a program as the learning content. What is the scope of that action?","options":["The program assignment as a whole","All enrollments in every course included in the program","Only the first mandatory program item","Only the most recently completed program item"],"answer":0,"why":"Selecting a program targets the program obligation. This action does not individually waive program items or cancel each underlying enrollment.","reference":{"title":"Steps: Waive Learning Assignments","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/shb1581540363812.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B11"}]},{"id":"L150-B12","module":"L","domain":3,"topic":"Completion corrections and exceptions","stem":"An offering has reached its Workday capacity but a larger room has been secured. One exceptional learner must be added immediately. Which action can use an authorized override?","options":["The learner self-enrolls by selecting the required-learning flag","The direct manager submits Enroll My Team with an earlier due date","The facilitator submits Learning Facilitated Enroll and ignores the capacity validation","An administrator uses Learning Mass Enroll for that learner"],"answer":3,"why":"Administrative mass enrollment can override capacity. Neither an earlier due date nor required status increases manager enrollment authority.","reference":{"title":"Mass Enroll Learners","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/pia1560344513585.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B12"}]},{"id":"L150-B13","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"Everyone in a newly acquired unit must complete training by September 30, including people enrolled late in August. Which timing choice produces the common deadline?","options":["Set a 30-day duration for every enrollment","Set a fixed calendar due date on the required enrollment","Set the offering end date to September 30","Set an expiry period of September 30 on completed enrollments"],"answer":1,"why":"A fixed date gives the cohort one deadline. A duration yields different dates as people enter at different times.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"B13"}]},{"id":"L150-B14","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"A learner was waived accidentally. The requirement should be restored with its administrative history intact. What is the proper correction?","options":["Mark the old assignment completed and issue a new course version","Undo the waiver using Manage Learning Assignment Waive or rescind the waiver event","Issue a second assignment and leave the original waived transaction as the active requirement","Edit the learner’s enrollment status directly to Passed"],"answer":1,"why":"Undoing the waiver corrects the transaction that removed the obligation. Editing completion would misrepresent what the learner did.","reference":{"title":"Steps: Waive Learning Assignments","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/shb1581540363812.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B14"}]},{"id":"L150-B15","module":"L","domain":1,"topic":"Offerings, waitlists and versions","stem":"An administrator can edit existing offerings but cannot use Copy Course Offering. Which security configuration specifically enables that action?","options":["Copy Course Offering initiating action on Manage Course Offering","Manage Course initiating action for editing version notes","Waitlist in Course initiating action on Enroll in Content","Copy Course Offering initiating action on Enroll in Content"],"answer":0,"why":"Copying creates another offering. Its initiating action belongs to the offering-management business process.","reference":{"title":"Reference: Learning Business Processes","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-setup-and-maintenance/learning-security/kkd1468238672415.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B15"}]},{"id":"L150-B16","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"Reminders were scheduled after a campaign’s end date. Earlier reminders worked. What should be checked before changing notification security?","options":["Whether the last reminder was configured as a notification to the campaign owner","Whether reminders were scheduled relative to the date the audience was created","Whether the campaign ends before the remaining reminders can be sent","Whether a course version change reset the displayed learning title"],"answer":2,"why":"Campaign end dates bound reminder delivery. An otherwise valid recurring schedule cannot extend past that boundary.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"B16"}]},{"id":"L150-B17","module":"L","domain":3,"topic":"Learning reports","stem":"A manager wants the training progress of direct reports, while an administrator needs to maintain an inactive catalog item. Which report pairing best fits?","options":["Instructor Schedule Calendar for progress and My Transcript for maintenance","Find Workers to Enroll for progress and Manage Waitlists for maintenance","My Team’s Learning for progress and Manage Learning Content for maintenance","Manage Learning Content for progress and Browse Learning Content for maintenance"],"answer":2,"why":"Team progress is a learner-level reporting need. An inactive item requires an administrative catalog search.","reference":{"title":"Introduction to Workday Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/introduction-to-workday-learning.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B17"}]},{"id":"L150-B18","module":"L","domain":2,"topic":"Campaigns and reminders","stem":"A required-learning campaign cannot find an existing audience. Both carry the same display name, but the audience was built for optional learning. What should change?","options":["Select a relative due date before opening the audience prompt","Increase the audience run priority to Critical","Rename both items and add the same reminder text","Use an audience with the matching campaign type and required category"],"answer":3,"why":"Eligibility uses type and category. A matching name, priority, or due date is insufficient.","reference":{"title":"Administer Learning","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/administer-learning.html?toc=9"},"sample":0,"memberships":[{"collection":"learning150","label":"B18"}]},{"id":"L150-B19","module":"L","domain":3,"topic":"Completion corrections and exceptions","stem":"A learner finished a SCORM lesson offline during a connectivity interruption. Evidence is available, but the enrolled course remains In Progress. Which task can record the verified result?","options":["Manage Enrollment Completion","Manage Grading and Attendance for a classroom session","Reset Learning Due Dates","Waive Learning Assignment"],"answer":0,"why":"Manual enrollment completion handles missing results from eligible media or packaged lessons. A waiver does not record successful learning.","reference":{"title":"Manage Enrollment Completion","url":"https://stage.doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/eas1550266780581.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B19"}]},{"id":"L150-B20","module":"L","domain":1,"topic":"Packaged content and SCORM","stem":"Learners pass a packaged quiz but the lesson remains in progress while its player is open. What is the best first diagnostic?","options":["Re-enroll the class before closing the player","Reset every learner’s expiry date and reopen the program","Mark the course instructor-led so the player sends a grade","Exit the package normally and recheck the lesson status"],"answer":3,"why":"With interaction tracking, the default lesson status update occurs on exit. Check the normal exit path before changing enrollment records.","reference":{"title":"Workday Learning Components","url":"https://doc.workday.com/workday-education/en-us/course-manuals/learning-for-administrators/workday-learning-components.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B20"}]},{"id":"L150-B21","module":"L","domain":2,"topic":"Enrollment workflow and security","stem":"An approval is needed only for learners enrolling themselves in a selected digital course. Which business process is the starting point?","options":["Manage Course Offering","Manage Course","Enroll in Content","Mass Enroll"],"answer":2,"why":"Self-enrollment initiates Enroll in Content. The mass enrollment and catalog-maintenance processes govern different transactions.","reference":{"title":"Reference: Learning Business Processes","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-setup-and-maintenance/learning-security/kkd1468238672415.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B21"}]},{"id":"L150-B22","module":"L","domain":2,"topic":"Mass actions and assignment records","stem":"A business unit needs consistent reasons for exemptions so the compliance report can group them reliably. Where should the options be maintained?","options":["Add a free-text note to each learner’s enrollment rather than defining waiver reasons","Maintain Learning Assignment Waive Reasons","Maintain the reasons used when an enrollment is canceled","Maintain Cancel Course Offering Reason Categories"],"answer":1,"why":"Waiver reasons classify exemptions from assignments. Offering cancellation reasons classify a different event.","reference":{"title":"Steps: Waive Learning Assignments","url":"https://doc.workday.com/admin-guide/en-us/human-capital-management/learning/learning-enrollments/shb1581540363812.html"},"sample":0,"memberships":[{"collection":"learning150","label":"B22"}]},{"id":"L150-B23","module":"L","domain":3,"topic":"Grading, attendance and trainer scope","stem":"A learner failed a graded course and wants a fresh attempt. A colleague passed and only wants to reread the materials. Which pair of actions fits?","options":["View Course Again for both learners to reset both grades","Reset Learning Due Dates for the failed learner and Retake Course for the successful learner","Retake Course for both learners to retain both original statuses","Retake Course for the failed learner and View Course Again for the successful learner"],"answer":3,"why":"Retaking starts another attempt. Replaying a successful course reviews the material without changing that completion.","reference":{"title":"Manage Learner Enrollment","url":"https://doc.workday.com/workda
